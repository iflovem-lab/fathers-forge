<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>父の窯と鉄の夢 v27</title><style>html,body{margin:0;height:100%;background:#08040b;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}.badge{position:fixed;left:8px;top:8px;z-index:99;background:#100a16e8;border:2px solid #8ff0b2;border-radius:999px;padding:5px 9px;color:#dfffea;font:900 11px system-ui;pointer-events:none}</style></head><body><div class="badge">v27 • SMART STOCK</div><iframe id="shell" src="/v26.html?v=27" title="父の窯と鉄の夢 v27"></iframe><script>
const shell=document.getElementById('shell');
function deepest(win){try{let cur=win;for(let i=0;i<36;i++){const f=[...cur.document.querySelectorAll('iframe')].find(x=>x.contentWindow&&x.contentDocument);if(!f)break;cur=f.contentWindow}return cur}catch(e){return null}}
function install(){try{const w=deepest(shell.contentWindow);if(!w||!w.document?.body||w.__v27installed)return;w.__v27installed=1;const d=w.document;d.title='父の窯と鉄の夢 v27';
const s=d.createElement('style');s.textContent=`
.v27stock{margin:10px 0 12px;padding:13px;border-radius:21px;background:linear-gradient(145deg,#13251d,#130e19);border:2px solid #6fd49a;box-shadow:0 9px 26px #0008;color:#effff4}.v27head{display:flex;justify-content:space-between;align-items:center;gap:10px}.v27head h3{margin:0;color:#caffdc;font-size:15px}.v27pill{font-size:10px;font-weight:1000;padding:4px 8px;border-radius:999px;background:#d6ffe3;color:#173321}.v27grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.v27metric{padding:8px;border-radius:13px;text-align:center;background:#0d1611;border:1px solid #385943}.v27metric small{display:block;color:#a8c4b1;font-size:10px}.v27metric b{display:block;margin-top:2px;font-size:17px;color:#edfff2}.v27hint{margin-top:8px;font-size:11px;line-height:1.5;color:#bad0c0}.v27enhanced{position:relative;padding-top:34px!important}.v27chips{position:absolute;left:7px;right:7px;top:6px;display:flex;gap:5px;flex-wrap:wrap}.v27chip{font-size:9px;font-weight:1000;border-radius:999px;padding:3px 6px;background:#18201b;border:1px solid #48614f;color:#def2e3}.v27chip.hot{background:#573d1c;border-color:#ffcc76;color:#fff0c8}.v27chip.rare{background:#392050;border-color:#c89aff;color:#f0e0ff}.v27chip.hold{background:#1f2745;border-color:#809cff;color:#e5ebff}.v27best{outline:3px solid #ffd98a;outline-offset:1px;box-shadow:0 0 24px #ffd98a44!important}.v27empty{margin-top:9px;padding:9px;border-radius:12px;border:1px dashed #52705d;background:#0c1510;color:#a9c4b1;font-size:11px}.v27legend{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}@media(max-width:620px){.v27grid{grid-template-columns:1fr 1fr}.v27metric:last-child{grid-column:1/-1}}
`;d.head.appendChild(s);
function sales(){return [...d.querySelectorAll('.screen')].find(x=>/market|shop|sell/i.test(x.id||'')&&x.offsetParent!==null)||[...d.querySelectorAll('.screen')].find(x=>/販売|市場|店/.test(x.innerText||'')&&x.offsetParent!==null)}
function candidates(sc){return [...sc.querySelectorAll('.sellrow,.item,.card,.result')].filter(x=>{const t=x.innerText||'';return /売|販売|G|円|在庫|武器|剣|斧|槍|完成品/i.test(t)&&!x.closest('.v27stock')})}
function valueOf(t){const nums=[...t.matchAll(/[0-9][0-9,]{1,}/g)].map(m=>+m[0].replace(/,/g,''));return nums.length?Math.max(...nums):0}
function qualityOf(t){if(/\bS\b|最高|希少|伝説|名品/.test(t))return 3;if(/\bA\b|高品質|上質|良品/.test(t))return 2;return 1}
function label(t){return (t.split('\n').find(x=>/剣|斧|槍|武器|完成|商品/.test(x))||t.split('\n')[0]||'完成品').trim().slice(0,14)}
function render(){const sc=sales();if(!sc)return;let box=sc.querySelector('.v27stock');if(!box){box=d.createElement('section');box.className='v27stock';box.innerHTML='<div class="v27head"><h3>📦 スマート在庫</h3><span class="v27pill">SELL GUIDE</span></div><div class="v27grid"><div class="v27metric"><small>販売候補</small><b data-k="count">0</b></div><div class="v27metric"><small>最優先</small><b data-k="best">—</b></div><div class="v27metric"><small>在庫状態</small><b data-k="health">空</b></div></div><div class="v27legend"><span class="v27chip hot">★ 今売る</span><span class="v27chip rare">◆ 高品質</span><span class="v27chip hold">● 温存</span></div><div class="v27hint">価値と品質をもとに、売却優先度を表示します。ゲーム内部の価格計算は変更しません。</div><div class="v27empty">完成品ができると、商品ごとに販売判断タグが付きます。</div>';const title=sc.querySelector('.title,h2,h3');if(title&&title.nextSibling)sc.insertBefore(box,title.nextSibling);else sc.prepend(box)}const rs=candidates(sc);box.querySelector('[data-k="count"]').textContent=rs.length;box.querySelector('[data-k="health"]').textContent=rs.length===0?'制作優先':rs.length<=2?'少なめ':rs.length<=5?'適正':'多め';let ranked=rs.map((r,i)=>{const t=r.innerText||'',v=valueOf(t),q=qualityOf(t);return{r,i,t,v,q,score:q*100000+v}}).sort((a,b)=>b.score-a.score);box.querySelector('[data-k="best"]').textContent=ranked[0]?label(ranked[0].t):'—';rs.forEach(r=>{r.classList.remove('v27best');r.querySelector('.v27chips')?.remove()});ranked.forEach((x,rank)=>{x.r.classList.add('v27enhanced');const chips=d.createElement('div');chips.className='v27chips';let tag=rank===0?'<span class="v27chip hot">★ 今売る</span>':rank>=3?'<span class="v27chip hold">● 温存</span>':'<span class="v27chip">○ 候補</span>';chips.innerHTML=tag+(x.q>=2?'<span class="v27chip rare">◆ '+(x.q===3?'名品':'高品質')+'</span>':'')+(x.v?'<span class="v27chip">💰 '+x.v.toLocaleString()+'</span>':'');x.r.prepend(chips);if(rank===0)x.r.classList.add('v27best')});box.querySelector('.v27empty').style.display=rs.length?'none':'block'}
const mo=new MutationObserver(()=>{clearTimeout(w.__v27timer);w.__v27timer=setTimeout(render,100)});mo.observe(d.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['class','style']});d.addEventListener('click',()=>setTimeout(render,120),true);render();
}catch(e){console.error('v27 install',e)}}function boot(){install();setTimeout(install,350);setTimeout(install,1400)}shell.addEventListener('load',boot);boot();
</script></body></html>
