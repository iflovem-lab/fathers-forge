<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>父の窯と鉄の夢 v24</title><style>html,body{margin:0;height:100%;background:#08040b;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}.badge{position:fixed;left:8px;top:8px;z-index:99;background:#100a16e8;border:2px solid #e8c77a;border-radius:999px;padding:5px 9px;color:#fff0bd;font:900 11px system-ui;pointer-events:none}</style></head><body><div class="badge">v24 • CLEAR FLOW</div><iframe id="shell" src="/v23.html?v=24" title="父の窯と鉄の夢 v24"></iframe><script>
const shell=document.getElementById('shell');
function deepest(win){try{let cur=win;for(let i=0;i<24;i++){const f=[...cur.document.querySelectorAll('iframe')].find(x=>x.contentWindow&&x.contentDocument);if(!f)break;cur=f.contentWindow}return cur}catch(e){return null}}
function install(){try{const w=deepest(shell.contentWindow);if(!w||!w.document?.body||w.__v24installed)return;w.__v24installed=1;const d=w.document;d.title='父の窯と鉄の夢 v24';
const css=d.createElement('style');css.textContent=`
.v24flow{position:fixed;left:50%;bottom:56px;transform:translateX(-50%);z-index:11880;width:min(680px,calc(100vw - 18px));background:linear-gradient(145deg,#23162dee,#120b19f4);border:2px solid #f1cd7c;border-radius:20px;box-shadow:0 14px 38px #000b,0 0 24px #d99b3b22;color:#fff3dc;padding:10px 12px;backdrop-filter:blur(12px);transition:.2s}.v24flow.compact{width:auto;left:auto;right:9px;transform:none;padding:8px 10px;border-radius:999px}.v24flow.compact .v24body,.v24flow.compact .v24steps{display:none}.v24head{display:flex;align-items:center;gap:9px}.v24orb{width:34px;height:34px;flex:0 0 34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#ffe5a8,#cf8f35);color:#2a1600;box-shadow:0 0 18px #ffd98a55;font-size:18px}.v24label{min-width:0;flex:1}.v24label small{display:block;color:#cdbbce;font-size:10px;font-weight:900;letter-spacing:.08em}.v24label b{display:block;color:#fff0b4;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.v24toggle{border:1px solid #7d6388!important;background:#25182d!important;color:#f5e8ff!important;border-radius:999px!important;padding:5px 9px!important;box-shadow:none!important;font-size:11px!important}.v24body{display:grid;grid-template-columns:1fr auto;gap:9px;align-items:center;margin-top:7px}.v24body p{margin:0;color:#e5d6c4;font-size:12px;line-height:1.45}.v24go{border:2px solid #fff0bd!important;background:linear-gradient(#ffe2a7,#d79028)!important;color:#2b1600!important;border-radius:14px!important;padding:9px 12px!important;font-weight:1000!important;box-shadow:0 4px #70420d!important;white-space:nowrap}.v24go:active{transform:translateY(2px)!important;box-shadow:0 2px #70420d!important}.v24steps{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:8px}.v24step{height:5px;border-radius:99px;background:#493a52;overflow:hidden;position:relative}.v24step.done{background:#4e8a62}.v24step.on{background:#d79b3b;box-shadow:0 0 10px #ffd98a88}.v24mark{outline:3px solid #ffe3a3!important;outline-offset:3px;box-shadow:0 0 0 3px #5e3f1c,0 0 28px #ffd98aaa!important;animation:v24mark 1s ease-in-out infinite alternate}.v24pulse{position:fixed;z-index:11870;pointer-events:none;border:3px solid #ffe0a0;border-radius:18px;animation:v24pulse .8s ease-out forwards}@keyframes v24mark{from{filter:brightness(1)}to{filter:brightness(1.15)}}@keyframes v24pulse{0%{transform:scale(.88);opacity:1}100%{transform:scale(1.18);opacity:0}}@media(max-width:520px){.v24flow{bottom:52px}.v24body{grid-template-columns:1fr}.v24go{width:100%}.v24label b{font-size:13px}}@media(prefers-reduced-motion:reduce){.v24mark,.v24pulse{animation:none!important}}
`;d.head.appendChild(css);
const flow=d.createElement('div');flow.className='v24flow';flow.innerHTML='<div class="v24head"><div class="v24orb">🧭</div><div class="v24label"><small>NEXT ACTION</small><b id="v24title">今日の流れを確認</b></div><button class="v24toggle" type="button">小さく</button></div><div class="v24body"><p id="v24hint">迷ったら、ここに出る次の一手だけ進めればOKです。</p><button class="v24go" type="button">ここへ進む</button></div><div class="v24steps"><i class="v24step" data-k="home"></i><i class="v24step" data-k="explore"></i><i class="v24step" data-k="forge"></i><i class="v24step" data-k="sell"></i><i class="v24step" data-k="life"></i></div>';d.body.appendChild(flow);
const toggle=flow.querySelector('.v24toggle');toggle.onclick=()=>{flow.classList.toggle('compact');toggle.textContent=flow.classList.contains('compact')?'戻す':'小さく'};
let target=null,lastKey='home';function visibleScreen(){return [...d.querySelectorAll('.screen')].find(x=>x.classList.contains('on')&&x.offsetParent!==null)?.id||''}function visBtns(){return [...d.querySelectorAll('button,.tab')].filter(x=>x.offsetParent!==null)}function find(rx){return visBtns().find(x=>rx.test(x.textContent.trim()))||null}function clear(){d.querySelectorAll('.v24mark').forEach(x=>x.classList.remove('v24mark'))}function setGuide(key,title,hint,rx){lastKey=key;target=rx?find(rx):null;flow.querySelector('#v24title').textContent=title;flow.querySelector('#v24hint').textContent=hint;flow.querySelector('.v24go').disabled=!target;flow.querySelector('.v24go').textContent=target?'ここへ進む':'画面で確認';d.querySelectorAll('.v24step').forEach((s,i)=>{const keys=['home','explore','forge','sell','life'];const idx=keys.indexOf(key);s.classList.toggle('done',i<idx);s.classList.toggle('on',s.dataset.k===key)});if(target)target.classList.add('v24mark')}
function guide(){clear();const id=visibleScreen();if(/forge/.test(id)){const hit=find(/ここだ/);if(hit)return setGuide('forge','タイミングを合わせて叩く','光っている「ここだ！」で品質を上げよう。',/ここだ/);return setGuide('forge','武器を完成させる','レシピを選んで制作開始。4工程を終えると完成します。',/制作|開始/)}if(/market|shop|sell/.test(id))return setGuide('sell','お客さんへ完成品を販売','希望と在庫を見て、今売る一本を選ぼう。',/販売|売る|接客/);if(/explore|adventure/.test(id))return setGuide('explore','素材を持ち帰る','探索を進めて次の鍛造に必要な素材を確保しよう。',/探索|出発|回収/);if(/life|rest|home2/.test(id))return setGuide('life','今日は体調も整える','体力・空腹・母の様子を見て必要なケアをしよう。',/食事|薬|看病|睡眠/);const sell=find(/販売|売る|接客/),forge=find(/制作|鍛冶/),explore=find(/探索/);if(sell)return setGuide('sell','完成品があるなら販売へ','売ってお金と評判を増やし、次の制作につなげよう。',/販売|売る|接客/);if(forge)return setGuide('forge','次は武器制作','素材が揃っているなら一本作ってみよう。',/制作|鍛冶/);if(explore)return setGuide('explore','まず素材集め','探索で素材を集めると、制作できる武器が増えます。',/探索/);setGuide('home','今日の目標を確認','ミッションと工房ランクを見て、次の目標を決めよう。',null)}
function pulse(el){if(!el)return;const r=el.getBoundingClientRect();const p=d.createElement('i');p.className='v24pulse';p.style.left=(r.left-5)+'px';p.style.top=(r.top-5)+'px';p.style.width=(r.width+10)+'px';p.style.height=(r.height+10)+'px';d.body.appendChild(p);setTimeout(()=>p.remove(),900)}flow.querySelector('.v24go').onclick=()=>{if(!target)return;target.scrollIntoView({behavior:'smooth',block:'center'});pulse(target);setTimeout(()=>target.focus?.(),250)};
let queued=false;const refresh=()=>{if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;guide()})};d.addEventListener('click',()=>setTimeout(refresh,80),true);const mo=new MutationObserver(refresh);mo.observe(d.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['class','style']});guide();
}catch(e){console.error('v24 install',e)}}function boot(){install();setTimeout(install,350);setTimeout(install,1300)}shell.addEventListener('load',boot);boot();
</script></body></html>
