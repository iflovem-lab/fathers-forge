<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>父の窯と鉄の夢 v32</title><style>html,body{margin:0;height:100%;background:#08040b;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}.badge{position:fixed;left:max(8px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));z-index:99;background:#100a16e8;border:2px solid #efc084;border-radius:999px;padding:5px 9px;color:#fff2de;font:900 11px system-ui;pointer-events:none;box-shadow:0 5px 16px #0008}</style></head><body><div class="badge">v32 • CLEAR FLOW</div><iframe id="shell" src="/v31.html?v=32" title="父の窯と鉄の夢 v32"></iframe><script>
const shell=document.getElementById('shell');
function deepest(win){try{let cur=win;for(let i=0;i<48;i++){const f=[...cur.document.querySelectorAll('iframe')].find(x=>x.contentWindow&&x.contentDocument);if(!f)break;cur=f.contentWindow}return cur}catch(e){return null}}
function install(){try{const w=deepest(shell.contentWindow);if(!w||!w.document?.body||w.__v32installed)return;w.__v32installed=1;const d=w.document;d.title='父の窯と鉄の夢 v32';
const s=d.createElement('style');s.id='v32-flow-style';s.textContent=`
.v32-flow{position:fixed;left:50%;top:max(46px,calc(env(safe-area-inset-top) + 44px));transform:translateX(-50%);z-index:99998;width:min(92vw,520px);pointer-events:auto;font-family:system-ui,-apple-system,sans-serif;color:#fff3e5}.v32-card{background:linear-gradient(180deg,#171018f2,#0f0a11f5);border:1px solid #8b6249;border-radius:16px;box-shadow:0 12px 34px #000a,0 0 0 1px #f0b97414 inset;overflow:hidden}.v32-head{display:flex;align-items:center;gap:8px;padding:9px 10px 7px}.v32-title{font:900 11px/1.1 system-ui;letter-spacing:.05em;color:#ffd9a7}.v32-sub{font:700 9px/1.2 system-ui;color:#bca898;flex:1}.v32-toggle{appearance:none;border:0!important;background:#2a1b1f!important;color:#f4d9bd!important;min-height:28px!important;height:28px!important;padding:0 9px!important;border-radius:999px!important;font:900 9px system-ui!important;box-shadow:none!important}.v32-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 9px 9px}.v32-step{position:relative;border:1px solid #4e3835;background:#120d12;border-radius:12px;padding:8px 7px;min-width:0;transition:.18s ease}.v32-step b{display:block;font:900 10px/1.2 system-ui;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.v32-step small{display:block;margin-top:3px;font:700 8px/1.2 system-ui;color:#a99487}.v32-step:before{content:attr(data-n);position:absolute;right:6px;top:5px;font:900 16px/1 system-ui;color:#ffffff14}.v32-step.now{border-color:#f0b76f;background:linear-gradient(180deg,#322019,#1b1213);box-shadow:0 0 18px #efaf5f25}.v32-step.now b{color:#ffe0af}.v32-step.done{border-color:#5e7e61;background:#122018}.v32-step.done b{color:#bce1b9}.v32-step.done:after{content:'✓';position:absolute;right:6px;bottom:5px;font:900 11px system-ui;color:#9fd29c}.v32-go{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid #4a3431;padding:7px 9px;background:#100b10}.v32-msg{font:800 9px/1.3 system-ui;color:#ddc5ae}.v32-action{appearance:none;border:1px solid #d69b5a!important;background:linear-gradient(#c77d3b,#9c5428)!important;color:white!important;min-height:34px!important;height:34px!important;padding:0 11px!important;border-radius:10px!important;font:900 10px system-ui!important;white-space:nowrap}.v32-flow.compact .v32-steps,.v32-flow.compact .v32-go{display:none}.v32-pulse{animation:v32pulse 1.6s ease-in-out infinite!important;outline:2px solid #f1b468aa!important;outline-offset:3px!important}@keyframes v32pulse{0%,100%{box-shadow:0 0 0 0 #f2b56b10}50%{box-shadow:0 0 0 8px #f2b56b20,0 0 20px #f2b56b35}}@media(max-width:380px){.v32-flow{top:max(44px,calc(env(safe-area-inset-top) + 42px));width:94vw}.v32-step small{display:none}.v32-head{padding:7px 8px 6px}.v32-steps{padding:0 7px 7px;gap:4px}.v32-step{padding:7px 5px}.v32-go{padding:6px 7px}}@media(prefers-reduced-motion:reduce){.v32-pulse{animation:none!important}}
`;d.head.appendChild(s);
const flow=d.createElement('div');flow.className='v32-flow';flow.innerHTML=`<div class="v32-card"><div class="v32-head"><div class="v32-title">🔥 今日の3ステップ</div><div class="v32-sub">迷ったらこの順番だけでOK</div><button class="v32-toggle" type="button">しまう</button></div><div class="v32-steps"><div class="v32-step" data-key="explore" data-n="1"><b>🧭 素材を集める</b><small>探索・冒険へ</small></div><div class="v32-step" data-key="craft" data-n="2"><b>🔨 武器を作る</b><small>鍛冶・制作へ</small></div><div class="v32-step" data-key="sell" data-n="3"><b>🪙 店で売る</b><small>販売して1周完了</small></div></div><div class="v32-go"><div class="v32-msg">まずは素材を探しに行こう</div><button class="v32-action" type="button">ここから進む</button></div></div>`;d.body.appendChild(flow);
const steps=[...flow.querySelectorAll('.v32-step')],msg=flow.querySelector('.v32-msg'),go=flow.querySelector('.v32-action'),toggle=flow.querySelector('.v32-toggle');let state={explore:false,craft:false,sell:false};try{state={...state,...JSON.parse(sessionStorage.getItem('ff-v32-flow')||'{}')}}catch(e){}
function txt(el){return (el?.innerText||el?.textContent||el?.getAttribute?.('aria-label')||'').trim()}function visible(el){return !!(el&&el.offsetParent!==null)}function kind(t){if(/探索|冒険|素材.*集|採取/i.test(t))return'explore';if(/鍛冶|制作|作る|打つ|叩|完成/i.test(t))return'craft';if(/販売|売る|店先|売却/i.test(t))return'sell';return''}function target(k){const re=k==='explore'?/探索|冒険|素材.*集|採取/i:k==='craft'?/鍛冶|制作|作る|打つ|叩/i:/販売|売る|店先|売却/i;return[...d.querySelectorAll('button,.btn,[role="button"],a')].filter(visible).find(x=>re.test(txt(x)))}
function next(){return!state.explore?'explore':!state.craft?'craft':!state.sell?'sell':'done'}function render(){const n=next();steps.forEach(x=>{const k=x.dataset.key;x.classList.toggle('done',!!state[k]);x.classList.toggle('now',k===n)});[...d.querySelectorAll('.v32-pulse')].forEach(x=>x.classList.remove('v32-pulse'));if(n==='done'){msg.textContent='✨ 1周完了！ 次は好きな遊び方で工房を育てよう';go.textContent='もう一周';go.disabled=false}else{const copy={explore:'まずは素材を探しに行こう',craft:'素材が集まったら武器を作ろう',sell:'完成品を店に並べて1周完了'};msg.textContent=copy[n];go.textContent='ここから進む';const t=target(n);if(t)t.classList.add('v32-pulse')}try{sessionStorage.setItem('ff-v32-flow',JSON.stringify(state))}catch(e){}}
toggle.addEventListener('click',()=>{flow.classList.toggle('compact');toggle.textContent=flow.classList.contains('compact')?'ひらく':'しまう'});go.addEventListener('click',()=>{const n=next();if(n==='done'){state={explore:false,craft:false,sell:false};render();return}const t=target(n);if(t){t.scrollIntoView({behavior:'smooth',block:'center'});t.focus?.();setTimeout(()=>t.click(),120)}else{msg.textContent='下のメニューから該当する行動を選んでね'}});
d.addEventListener('click',e=>{const b=e.target.closest('button,.btn,[role="button"],a');if(!b||flow.contains(b))return;const k=kind(txt(b));if(!k)return;state[k]=true;setTimeout(render,120)},true);const mo=new MutationObserver(()=>{clearTimeout(w.__v32timer);w.__v32timer=setTimeout(render,140)});mo.observe(d.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class','style','aria-selected']});render();
}catch(e){console.error('v32 install',e)}}function boot(){install();setTimeout(install,350);setTimeout(install,1400)}shell.addEventListener('load',boot);boot();
</script></body></html>
