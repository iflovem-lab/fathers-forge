const key='fathersForgeV29Care';let state={date:'',actions:0};try{state=Object.assign(state,JSON.parse(w.localStorage.getItem(key)||'{}'))}catch(e){}function day(){return new Date().toISOString().slice(0,10)}function resetDay(){if(state.date!==day()){state={date:day(),actions:0};save()}}function save(){try{w.localStorage.setItem(key,JSON.stringify(state))}catch(e){}}
function visibleScreen(){return [...d.querySelectorAll('.screen')].find(x=>x.offsetParent!==null)||d.body}
function lifeScreen(){const all=[...d.querySelectorAll('.screen,main,section')].filter(x=>x.offsetParent!==null);return all.find(x=>/母|生活|家|休息|食事|看病|薬|体調|mother|life|home|care/i.test((x.id||'')+' '+(x.className||'')+' '+(x.innerText||'')))||visibleScreen()}
function careButtons(sc){return [...sc.querySelectorAll('button,.btn,[role="button"]')].filter(b=>/母|看病|薬|食事|料理|休|寝|話|会話|水|世話|ケア|care|rest|meal|medicine|mother/i.test(b.innerText||b.getAttribute('aria-label')||''))}
function healthText(sc){const t=sc.innerText||'';const m=t.match(/(?:母[^\n]{0,12}(?:体調|健康)|(?:体調|健康)[^\n]{0,12}母)[^0-9]{0,8}(\d{1,3})/);return m?Math.max(0,Math.min(100,+m[1])):null}
function ensure(sc){let box=sc.querySelector('.v29care');if(box)return box;box=d.createElement('section');box.className='v29care';box.innerHTML='<div class="v29head"><h3>🌷 母と暮らす今日</h3><span class="v29tag">LIFE CARE</span></div><div class="v29summary">工房だけでなく、家で過ごす時間もこの物語の一部です。</div><div class="v29grid"><div class="v29tile"><small>母の様子</small><b data-k="condition">見守り中</b><div class="v29bar"><i></i></div></div><div class="v29tile"><small>今日のケア</small><b data-k="actions">0 回</b></div><div class="v29tile"><small>おすすめ</small><b data-k="best">声をかける</b></div></div><div class="v29todo"><span>♡</span><div><strong>今日のひとこと</strong><br><span data-k="hint">生活タブで母の様子を確認しよう。</span></div></div>';const title=sc.querySelector('.title,h1,h2,h3');if(title&&title.nextSibling)sc.insertBefore(box,title.nextSibling);else sc.prepend(box);return box}
function render(){resetDay();const sc=lifeScreen();if(!sc)return;const box=ensure(sc),btns=careButtons(sc),hp=healthText(sc);box.querySelector('[data-k="actions"]').textContent=state.actions+' 回';let cond='穏やか',pct=74;if(hp!==null){pct=hp;cond=hp<35?'かなり心配':hp<60?'少し疲れ気味':hp<82?'落ち着いている':'とても元気'}else if(/危険|悪化|重い|つら|苦し/i.test(sc.innerText||'')){cond='かなり心配';pct=28}else if(/疲|不調|弱/i.test(sc.innerText||'')){cond='少し疲れ気味';pct=52}else if(/元気|回復|良好/i.test(sc.innerText||'')){cond='とても元気';pct=90}box.querySelector('[data-k="condition"]').textContent=cond;box.querySelector('.v29bar i').style.width=pct+'%';let best=btns.find(b=>/薬|看病|食事|料理|休|話|会話|水|世話|ケア/i.test(b.innerText||''));box.querySelector('[data-k="best"]').textContent=best?(best.innerText||'ケアする').trim().slice(0,11):'様子を見る';const hint=box.querySelector('[data-k="hint"]');hint.textContent=pct<40?'母の体調を優先。工房仕事より先にケアしよう。':pct<65?'少し気にかけたい状態。余裕のあるうちにケアがおすすめ。':state.actions<1?'今日はまだケアしていない。ひと声かけてから工房へ。':'今日のケア済み。安心して工房の仕事を進められそう。';btns.forEach(b=>b.classList.add('v29carebtn'));if(best&&state.actions<1){best.classList.remove('v29focus');void best.offsetWidth;best.classList.add('v29focus')}}
function feedback(el){state.actions++;state.date=day();save();const sc=lifeScreen(),box=ensure(sc);box.classList.remove('v29flash');void box.offsetWidth;box.classList.add('v29flash');const r=el.getBoundingClientRect(),f=d.createElement('div');f.className='v29float';f.style.left=(r.left+r.width/2)+'px';f.style.top=r.top+'px';f.textContent=['ほっとした','ありがとう','♡','少し安心'][state.actions%4];d.body.appendChild(f);setTimeout(()=>f.remove(),900);setTimeout(render,120)}
d.addEventListener('click',e=>{const sc=lifeScreen(),b=e.target.closest('button,.btn,[role="button"]');if(b&&sc&&careButtons(sc).includes(b))feedback(b)},true);const mo=new MutationObserver(()=>{clearTimeout(w.__v29timer);w.__v29timer=setTimeout(render,130)});mo.observe(d.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['class','style']});render();
