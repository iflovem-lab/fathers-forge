<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>父の窯と鉄の夢 v41</title><style>html,body{margin:0;height:100%;background:#08040b;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}.badge{position:fixed;left:max(8px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));z-index:99;background:#120b10e8;border:1px solid #e2a75f;border-radius:999px;padding:5px 9px;color:#fff1dc;font:900 11px system-ui;pointer-events:none;box-shadow:0 5px 18px #0009,0 0 20px #d67a241f}</style></head><body><div class="badge">v41 • LIVING FORGE</div><iframe id="game" src="/v40.html?v=41" title="父の窯と鉄の夢 v41"></iframe><script>
const game=document.getElementById('game');
function deepest(win){try{let cur=win;for(let i=0;i<64;i++){const f=[...cur.document.querySelectorAll('iframe')].find(x=>x.contentWindow&&x.contentDocument);if(!f)break;cur=f.contentWindow}return cur}catch(e){return null}}
function install(){try{const w=deepest(game.contentWindow);if(!w||!w.document?.body||w.__v41installed)return;w.__v41installed=1;const d=w.document;d.title='父の窯と鉄の夢 v41';
const css=d.createElement('style');css.id='v41-living-forge-style';css.textContent=`
:root{--v41-warm:#e59a47;--v41-gold:#ffd28a}.v41-atmosphere{position:fixed;inset:0;z-index:2147483000;pointer-events:none;overflow:hidden}.v41-vignette{position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,transparent 40%,#09040a18 70%,#05020752 100%);mix-blend-mode:multiply}.v41-glow{position:absolute;left:50%;bottom:-18vh;width:min(70vw,480px);height:30vh;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse,#e8782224 0%,#ba4a0d0f 45%,transparent 72%);filter:blur(20px);animation:v41breathe 5.2s ease-in-out infinite}.v41-ember{position:absolute;bottom:-16px;width:4px;height:4px;border-radius:50%;background:#ffbd68;box-shadow:0 0 7px #ff8a32;opacity:0;animation:v41rise var(--dur) linear forwards}.v41-pop{position:fixed;z-index:2147483646;pointer-events:none;font:900 15px/1 system-ui;text-shadow:0 2px 7px #000c;animation:v41pop .72s cubic-bezier(.2,.7,.2,1) forwards}.v41-ripple{position:fixed;z-index:2147483645;pointer-events:none;width:14px;height:14px;border:2px solid #ffca7a;border-radius:50%;transform:translate(-50%,-50%);animation:v41ripple .55s ease-out forwards}.v41-sheen{position:relative;box-shadow:inset 0 1px 0 #fff7da12}.v41-sheen:after{content:'';position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:linear-gradient(110deg,transparent 34%,#fff7da0a 47%,#fff7da18 50%,#fff7da0a 53%,transparent 66%);background-size:260% 100%;background-position:140% 0;animation:v41sheen 8s ease-in-out infinite}.v41-impact{animation:v41impact .22s ease-out!important}
@keyframes v41breathe{0%,100%{opacity:.62;transform:translateX(-50%) scale(.96)}50%{opacity:1;transform:translateX(-50%) scale(1.04)}}@keyframes v41rise{0%{opacity:0;transform:translate(0,0) scale(.5)}12%{opacity:.75}100%{opacity:0;transform:translate(var(--drift),-24vh) scale(1.15)}}@keyframes v41pop{0%{opacity:0;transform:translate(-50%,-35%) scale(.65)}20%{opacity:1;transform:translate(-50%,-72%) scale(1.08)}100%{opacity:0;transform:translate(-50%,-125%) scale(.96)}}@keyframes v41ripple{0%{opacity:.8;transform:translate(-50%,-50%) scale(.5)}100%{opacity:0;transform:translate(-50%,-50%) scale(5)}}@keyframes v41sheen{0%,72%,100%{background-position:140% 0}82%{background-position:-40% 0}}@keyframes v41impact{0%{filter:brightness(1)}40%{filter:brightness(1.16)}100%{filter:brightness(1)}}
@media(prefers-reduced-motion:reduce){.v41-glow,.v41-ember,.v41-pop,.v41-ripple,.v41-sheen:after{animation:none!important}.v41-ember,.v41-pop,.v41-ripple{display:none!important}}
`;d.head.appendChild(css);
const layer=d.createElement('div');layer.className='v41-atmosphere';layer.innerHTML='<div class="v41-glow"></div><div class="v41-vignette"></div>';d.body.appendChild(layer);
[...d.querySelectorAll('.card,.panel,section')].slice(0,10).forEach(el=>el.classList.add('v41-sheen'));
function ember(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const e=d.createElement('i');e.className='v41-ember';e.style.left=(18+Math.random()*64)+'%';e.style.setProperty('--dur',(3.8+Math.random()*2.6)+'s');e.style.setProperty('--drift',((Math.random()-.5)*70)+'px');layer.appendChild(e);setTimeout(()=>e.remove(),6600)}
let emberTimer=setInterval(()=>{if(d.visibilityState==='visible'&&layer.querySelectorAll('.v41-ember').length<7)ember()},900);
function text(el){return(el?.innerText||el?.textContent||el?.getAttribute?.('aria-label')||'').trim()}
function burst(el,kind){const r=el.getBoundingClientRect();const x=r.left+r.width/2,y=r.top+r.height/2;const rip=d.createElement('span');rip.className='v41-ripple';rip.style.left=x+'px';rip.style.top=y+'px';d.body.appendChild(rip);setTimeout(()=>rip.remove(),600);const glyph=kind==='sale'?'✦ +G':'✦';for(let i=0;i<(kind==='sale'?4:3);i++){const p=d.createElement('span');p.className='v41-pop';p.textContent=glyph;p.style.left=(x+(i-1.5)*15)+'px';p.style.top=(y+(i%2)*6)+'px';p.style.color=kind==='sale'?'#ffd477':'#ffb25f';p.style.animationDelay=(i*35)+'ms';d.body.appendChild(p);setTimeout(()=>p.remove(),900)}el.classList.remove('v41-impact');void el.offsetWidth;el.classList.add('v41-impact')}
d.addEventListener('click',e=>{const b=e.target.closest('button,.btn,[role="button"],a');if(!b)return;const t=text(b);if(/鍛|打つ|作る|制作|製作|クラフト|forge/i.test(t))burst(b,'forge');else if(/販売|売る|売却|購入してもら|店に出す/i.test(t))burst(b,'sale')},true);
w.addEventListener('beforeunload',()=>clearInterval(emberTimer),{once:true});
}catch(e){console.error('v41 install',e)}}
function boot(){install();setTimeout(install,450);setTimeout(install,1500)}game.addEventListener('load',boot);boot();
</script></body></html>
