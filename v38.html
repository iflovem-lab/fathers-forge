<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>父の窯と鉄の夢 v38</title><style>html,body{margin:0;height:100%;background:#08040b;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}.badge{position:fixed;left:max(8px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));z-index:99;background:#11100ee8;border:2px solid #e7bd77;border-radius:999px;padding:5px 9px;color:#fff4df;font:900 11px system-ui;pointer-events:none;box-shadow:0 5px 16px #0008}</style></head><body><div class="badge">v38 • CHAPTER GOALS</div><iframe id="shell" src="/v37.html?v=38" title="父の窯と鉄の夢 v38"></iframe><script>
const shell=document.getElementById('shell');
function deepest(win){try{let cur=win;for(let i=0;i<72;i++){const f=[...cur.document.querySelectorAll('iframe')].find(x=>x.contentWindow&&x.contentDocument);if(!f)break;cur=f.contentWindow}return cur}catch(e){return null}}
function install(){try{const w=deepest(shell.contentWindow);if(!w||!w.document?.body||w.__v38installed)return;w.__v38installed=1;const d=w.document;d.title='父の窯と鉄の夢 v38';
const css=d.createElement('style');css.textContent=`.v38-goals{position:fixed;z-index:99997;left:50%;top:max(10px,env(safe-area-inset-top));transform:translateX(-50%);width:min(390px,calc(100vw - 100px));font-family:system-ui,-apple-system,sans-serif;color:#fff6e8;filter:drop-shadow(0 10px 24px #0009)}.v38-card{border:1px solid #8b6338;border-radius:16px;background:linear-gradient(155deg,#241a11f4,#0e0b09f7);overflow:hidden;backdrop-filter:blur(10px)}.v38-head{display:flex;align-items:center;gap:8px;padding:8px 10px;background:linear-gradient(90deg,#3a2918,#20160f)}.v38-chapter{flex:1;min-width:0}.v38-kicker{font:900 8px/1 system-ui;letter-spacing:.12em;color:#d7a968}.v38-title{margin-top:3px;font:1000 12px/1.15 system-ui;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.v38-toggle{appearance:none;border:1px solid #795733!important;background:#241a11!important;color:#f3d7ad!important;border-radius:999px!important;min-height:26px!important;height:26px!important;padding:0 8px!important;font:900 9px system-ui!important;box-shadow:none!important}.v38-body{padding:8px 10px 9px}.v38-progress{display:flex;gap:5px}.v38-step{flex:1;height:5px;border-radius:99px;background:#352b22;overflow:hidden}.v38-step i{display:block;width:0;height:100%;background:linear-gradient(90deg,#c47c31,#f3c16f);transition:width .25s ease}.v38-list{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:7px}.v38-goal{padding:6px 7px;border:1px solid #493a2c;border-radius:9px;background:#15110e;color:#cdbca6;font:800 8px/1.25 system-ui}.v38-goal b{display:block;color:#f5dfbd;font-size:9px;margin-bottom:2px}.v38-goal.done{border-color:#557251;background:#111a12;color:#9fc198}.v38-goal.done b{color:#cae6c4}.v38-next{margin-top:7px;text-align:center;color:#c7a981;font:800 8px/1.3 system-ui}.v38-goals.compact{width:auto}.v38-goals.compact .v38-body{display:none}.v38-goals.compact .v38-card{border-radius:999px}.v38-goals.compact .v38-kicker{display:none}.v38-goals.compact .v38-title{font-size:10px}.v38-toast{position:fixed;z-index:999999;left:50%;top:19%;transform:translateX(-50%);padding:10px 14px;border:2px solid #e8b967;border-radius:14px;background:#24180ff5;color:#fff0d2;text-align:center;box-shadow:0 15px 45px #000c;font:1000 12px/1.25 system-ui;animation:v38toast 2s ease forwards;pointer-events:none}.v38-toast small{display:block;margin-top:4px;color:#d5b78d;font:800 9px system-ui}@keyframes v38toast{0%{opacity:0;transform:translate(-50%,-8px) scale(.92)}12%,78%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-10px) scale(.98)}}@media(max-width:620px){.v38-goals{top:max(8px,env(safe-area-inset-top));width:min(330px,calc(100vw - 78px))}.v38-body{padding:7px 8px 8px}.v38-list{gap:4px}.v38-goal{padding:5px;font-size:7px}.v38-goal b{font-size:8px}}@media(prefers-reduced-motion:reduce){.v38-step i{transition:none}.v38-toast{animation:none;opacity:1}}`;d.head.appendChild(css);
const chapters=[{title:'火を絶やさない',goals:[['explore','素材を集める','探索を1回'],['craft','鉄を打つ','鍛冶を1回'],['sell','最初の商い','販売を1回']]},{title:'街の注文に応える',goals:[['craft','腕を磨く','鍛冶を2回'],['sell','客へ届ける','販売を2回'],['life','家を気づかう','暮らしを1回']]},{title:'名工への道',goals:[['explore','良材を探す','探索を2回'],['craft','作品を重ねる','鍛冶を3回'],['sell','評判を広げる','販売を3回']]},{title:'王都へ届く噂',goals:[['sell','商いを続ける','販売を4回'],['life','帰る場所を守る','暮らしを2回'],['craft','名工の一打','鍛冶を4回']]}];
let state={chapter:0,counts:{explore:0,craft:0,sell:0,life:0}};try{state=Object.assign(state,JSON.parse(localStorage.getItem('ff-v38-goals')||'{}'));state.counts=Object.assign({explore:0,craft:0,sell:0,life:0},state.counts||{})}catch(e){};
const box=d.createElement('aside');box.className='v38-goals';box.innerHTML='<div class="v38-card"><div class="v38-head"><span>📜</span><div class="v38-chapter"><div class="v38-kicker">CHAPTER GOAL</div><div class="v38-title"></div></div><button class="v38-toggle" type="button">しまう</button></div><div class="v38-body"><div class="v38-progress"><span class="v38-step"><i></i></span><span class="v38-step"><i></i></span><span class="v38-step"><i></i></span></div><div class="v38-list"></div><div class="v38-next"></div></div></div>';d.body.appendChild(box);
function need(label){const m=label.match(/(\d+)回/);return m?Number(m[1]):1}function save(){try{localStorage.setItem('ff-v38-goals',JSON.stringify(state))}catch(e){}}function current(){return chapters[Math.min(state.chapter,chapters.length-1)]}function completeGoal(g){return (state.counts[g[0]]||0)>=need(g[2])}function toast(title,sub){const el=d.createElement('div');el.className='v38-toast';el.innerHTML=title+(sub?'<small>'+sub+'</small>':'');d.body.appendChild(el);setTimeout(()=>el.remove(),2100)}function render(){const c=current();box.querySelector('.v38-title').textContent=`第${state.chapter+1}章 • ${c.title}`;const list=box.querySelector('.v38-list');list.innerHTML='';let done=0;c.goals.forEach((g,i)=>{const ok=completeGoal(g);if(ok)done++;const el=d.createElement('div');el.className='v38-goal'+(ok?' done':'');const n=need(g[2]),v=Math.min(n,state.counts[g[0]]||0);el.innerHTML=`<b>${ok?'✓ ':''}${g[1]}</b>${v} / ${n}`;list.appendChild(el);box.querySelectorAll('.v38-step i')[i].style.width=ok?'100%':'0%'});box.querySelector('.v38-next').textContent=done===3?(state.chapter<chapters.length-1?'章の目標達成！ 次の章へ進みます。':'🏆 すべての章目標を達成しました'):`あと ${3-done} つで章クリア`;if(done===3&&state.chapter<chapters.length-1){setTimeout(()=>{if(current().goals.every(completeGoal)){state.chapter++;state.counts={explore:0,craft:0,sell:0,life:0};save();toast('✨ CHAPTER CLEAR',`第${state.chapter+1}章「${current().title}」へ`);render()}},500)}save()}
function txt(el){return(el?.innerText||el?.textContent||el?.getAttribute?.('aria-label')||'').trim()}function kind(t){if(/販売|売る|売却|会計|購入/i.test(t))return'sell';if(/鍛冶|鍛える|打つ|叩|ハンマー|製作|制作|作る|仕上/i.test(t))return'craft';if(/探索|冒険|採取|素材.*集|出発/i.test(t))return'explore';if(/母|看病|薬|食事|休む|暮らし|生活|会話/i.test(t))return'life';return''}let lock='';d.addEventListener('click',e=>{const b=e.target.closest('button,.btn,[role=button],a');if(!b||box.contains(b))return;const k=kind(txt(b));if(!k)return;const key=k+'|'+Math.floor(Date.now()/650);if(key===lock)return;lock=key;state.counts[k]=(state.counts[k]||0)+1;render()},true);box.querySelector('.v38-toggle').addEventListener('click',()=>{box.classList.toggle('compact');box.querySelector('.v38-toggle').textContent=box.classList.contains('compact')?'目標':'しまう'});render();
}catch(e){console.error('v38 install',e)}}function boot(){install();setTimeout(install,450);setTimeout(install,1700)}shell.addEventListener('load',boot);boot();
</script></body></html>
