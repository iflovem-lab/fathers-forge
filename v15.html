function visibleScreen(){return [...d.querySelectorAll('.screen')].find(x=>x.classList.contains('on'))?.id||'home'}function clearFocus(){d.querySelectorAll('.v15focus').forEach(x=>x.classList.remove('v15focus'))}function findButton(rx){return [...d.querySelectorAll('button')].find(b=>b.offsetParent!==null&&rx.test(b.textContent.trim()))}
function guide(){clearFocus();const id=visibleScreen(),next=d.getElementById('v15next'),hint=d.getElementById('v15hint');let key='home',title='今日のミッションを確認',msg='工房ホームで今日の目標を確認しよう。',rx=null;if(id==='forge'){key='forge';title='武器を1つ完成させよう';msg='レシピを選び、制作開始→4工程の順で進めます。';rx=/制作|開始|ここだ/}else if(/market|shop|sell/.test(id)){key='sell';title='目の前のお客さんへ販売';msg='客の希望を見ながら、完成品を販売しよう。';rx=/販売|売る|接客/}else if(/explore|adventure/.test(id)){key='explore';title='素材を集めに探索へ';msg='不足素材を増やして、次の制作につなげよう。';rx=/探索|出発|回収/}else if(/life|home2|rest/.test(id)){key='life';title='体調を整えて次の日へ';msg='空腹や体力を見て、食事か睡眠を選ぼう。';rx=/食事|睡眠/}else if(findButton(/探索/)){key='explore';title='まず素材を集めよう';msg='「探索」を押して制作に必要な素材を確保。';rx=/探索/}else if(findButton(/制作/)){key='forge';title='素材があるなら武器制作へ';msg='「制作」から最初の武器を完成させよう。';rx=/制作/}if(next)next.textContent=title;if(hint)hint.textContent=msg;d.querySelectorAll('.v15step').forEach(x=>x.classList.toggle('on',x.dataset.k===key));if(rx){const b=findButton(rx);if(b)b.classList.add('v15focus')}}
