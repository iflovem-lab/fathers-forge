<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>父の窯と鉄の夢 v44</title><style>html,body{margin:0;height:100%;background:#08040b;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}.badge{position:fixed;left:max(8px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));z-index:99;background:#100b12e8;border:1px solid #d6a55f;border-radius:999px;padding:5px 9px;color:#fff1dc;font:900 11px system-ui;pointer-events:none;box-shadow:0 5px 18px #0009}</style></head><body><div class="badge">v44 • INVENTORY CLARITY</div><iframe id="game" src="/v43.html?v=44" title="父の窯と鉄の夢 v44"></iframe><script>
const game=document.getElementById('game');
function deepest(win){try{let cur=win;for(let i=0;i<80;i++){const f=[...cur.document.querySelectorAll('iframe')].find(x=>x.contentWindow&&x.contentDocument);if(!f)break;cur=f.contentWindow}return cur}catch(e){return null}}
function install(){try{const w=deepest(game.contentWindow);if(!w||!w.document?.body||w.__v44installed)return;w.__v44installed=1;const d=w.document;d.title='父の窯と鉄の夢 v44';
const css=d.createElement('style');css.id='v44-inventory-style';css.textContent=`
.v44-stock{position:fixed;right:max(10px,env(safe-area-inset-right));bottom:max(12px,calc(env(safe-area-inset-bottom) + 10px));z-index:2147483245;width:min(292px,calc(100vw - 20px));font-family:system-ui,-apple-system,sans-serif;color:#f7ead8;background:linear-gradient(155deg,#171614f2,#0e0d0cf2);border:1px solid #5d594a;border-radius:16px;box-shadow:0 12px 34px #0009,0 0 24px #c6a96a14;backdrop-filter:blur(10px);overflow:hidden}.v44-stock[data-mini="1"] .v44-body{display:none}.v44-head{display:flex;align-items:center;gap:8px;padding:9px 10px;border-bottom:1px solid #ffffff0c}.v44-kicker{font:900 9px/1 system-ui;letter-spacing:.12em;color:#cdb682}.v44-title{margin-top:3px;font:900 12px/1.05 system-ui;color:#fff0d9}.v44-toggle{margin-left:auto;border:1px solid #535047;background:#181714;color:#d7ceb9;border-radius:999px;padding:4px 7px;font:900 9px/1 system-ui;cursor:pointer}.v44-body{padding:9px 10px 10px}.v44-status{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 9px;border:1px solid #3d3a32;border-radius:12px;background:#12110f}.v44-mode{font:900 12px/1.1 system-ui}.v44-mode small{display:block;margin-top:3px;color:#9f9787;font:800 9px/1.2 system-ui}.v44-chip{flex:none;border-radius:999px;padding:5px 7px;background:#252219;border:1px solid #6b6248;color:#e9d7a8;font:900 9px/1 system-ui}.v44-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:7px}.v44-stat{padding:7px 6px;border:1px solid #33312b;border-radius:10px;background:#11100e;text-align:center}.v44-num{font:950 16px/1 system-ui;color:#f3d69a}.v44-lab{margin-top:3px;font:800 8px/1.15 system-ui;color:#948c7c}.v44-action{width:100%;margin-top:8px;border:1px solid #7a6846;border-radius:11px;background:linear-gradient(#2b2417,#1c1811);color:#fff0cf;padding:8px 9px;font:900 10px/1 system-ui;cursor:pointer}.v44-action:active{transform:translateY(1px)}.v44-note{margin-top:6px;font:750 8px/1.3 system-ui;color:#8f8879}.v44-highlight{outline:2px solid #e2bd69!important;outline-offset:3px!important;box-shadow:0 0 0 5px #e2bd6920,0 0 22px #e2bd6940!important;animation:v44pulse .75s ease 2}@keyframes v44pulse{50%{filter:brightness(1.18)}}@media(max-width:600px){.v44-stock{bottom:max(92px,calc(env(safe-area-inset-bottom) + 84px));width:min(276px,calc(100vw - 20px))}}@media(prefers-reduced-motion:reduce){.v44-highlight{animation:none!important}.v44-action{transform:none!important}}
`;d.head.appendChild(css);
const panel=d.createElement('section');panel.className='v44-stock';panel.setAttribute('aria-label','在庫の見通し');panel.innerHTML=`<div class="v44-head"><div><div class="v44-kicker">INVENTORY GLANCE</div><div class="v44-title">在庫の見通し</div></div><button class="v44-toggle" type="button">しまう</button></div><div class="v44-body"><div class="v44-status"><div class="v44-mode">確認中…<small>今の画面から販売・制作候補を探します</small></div><div class="v44-chip">AUTO</div></div><div class="v44-grid"><div class="v44-stat"><div class="v44-num" data-stat="sell">0</div><div class="v44-lab">販売候補</div></div><div class="v44-stat"><div class="v44-num" data-stat="craft">0</div><div class="v44-lab">制作候補</div></div><div class="v44-stat"><div class="v44-num" data-stat="stock">0</div><div class="v44-lab">在庫表示</div></div></div><button class="v44-action" type="button">おすすめ箇所を光らせる</button><div class="v44-note">価格や在庫数は変更せず、今見える操作だけを整理して表示します。</div></div>`;d.body.appendChild(panel);
const visible=el=>{try{const r=el.getBoundingClientRect(),s=getComputedStyle(el);return r.width>2&&r.height>2&&s.display!=='none'&&s.visibility!=='hidden'&&Number(s.opacity||1)>.01}catch(e){return false}};
const txt=el=>(el?.innerText||el?.textContent||el?.getAttribute?.('aria-label')||'').replace(/\s+/g,' ').trim();
function buttons(re){return [...d.querySelectorAll('button,.btn,[role="button"],a')].filter(el=>!el.closest('.v44-stock')&&visible(el)&&re.test(txt(el)))}
function stockNodes(){const all=[...d.querySelectorAll('[class*="inventory"],[class*="stock"],[class*="item"],li,.card,[class*="card"]')];return all.filter(el=>!el.closest('.v44-stock')&&visible(el)&&/(在庫|完成品|所持|アイテム)/.test(txt(el))).slice(0,30)}
function scan(){const sell=buttons(/販売|売る|売却|店に出す|納品/);const craft=buttons(/鍛冶|鍛える|制作|製作|作る|クラフト/).filter(el=>!/売|販売/.test(txt(el)));const stock=stockNodes();panel.querySelector('[data-stat="sell"]').textContent=sell.length;panel.querySelector('[data-stat="craft"]').textContent=craft.length;panel.querySelector('[data-stat="stock"]').textContent=stock.length;let title,sub,chip;if(sell.length){title='今は「売る」が見つけやすい';sub='販売できる操作を優先して確認';chip='SELL'}else if(craft.length){title='補充・制作のタイミング';sub='まず完成品を増やす流れが見えます';chip='CRAFT'}else if(stock.length){title='在庫を確認して次を決める';sub='在庫表示から販売／制作へ';chip='CHECK'}else{title='画面を移動すると自動で更新';sub='販売・制作・在庫の操作を探しています';chip='AUTO'}panel.querySelector('.v44-mode').innerHTML=title+'<small>'+sub+'</small>';panel.querySelector('.v44-chip').textContent=chip;panel.__targets={sell,craft,stock}}
function highlight(){scan();const t=panel.__targets||{};const targets=(t.sell?.length?t.sell:t.craft?.length?t.craft:t.stock||[]).slice(0,3);targets.forEach(el=>{el.classList.add('v44-highlight');try{el.scrollIntoView({behavior:'smooth',block:'center',inline:'nearest'})}catch(e){};setTimeout(()=>el.classList.remove('v44-highlight'),1800)})}
panel.querySelector('.v44-action').addEventListener('click',highlight);panel.querySelector('.v44-toggle').addEventListener('click',()=>{const mini=panel.dataset.mini==='1';panel.dataset.mini=mini?'0':'1';panel.querySelector('.v44-toggle').textContent=mini?'しまう':'開く'});
let timer=0;const requestScan=()=>{clearTimeout(timer);timer=setTimeout(scan,160)};new MutationObserver(requestScan).observe(d.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class','style','hidden','disabled']});d.addEventListener('click',()=>setTimeout(scan,120),true);scan();setInterval(scan,1800);
}catch(e){console.error('v44 install',e)}}function boot(){install();setTimeout(install,500);setTimeout(install,1600)}game.addEventListener('load',boot);boot();
</script></body></html>
