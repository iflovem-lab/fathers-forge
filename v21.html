<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>父の窯と鉄の夢 v21</title><style>html,body{margin:0;height:100%;background:#09050c;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}.v21badge{position:fixed;left:8px;top:8px;z-index:99;background:#100a16e8;border:2px solid #e8c77a;border-radius:999px;padding:5px 9px;color:#fff0bd;font:900 11px system-ui;pointer-events:none;box-shadow:0 5px 20px #0008}</style></head><body><div class="v21badge">v21 • DAILY LOOP</div><iframe id="shell" src="/v20.html?v=21" title="父の窯と鉄の夢 v21"></iframe><script>
const shell=document.getElementById('shell');
function deepest(win){try{let cur=win;for(let i=0;i<14;i++){const f=[...cur.document.querySelectorAll('iframe')].find(x=>x.contentWindow&&x.contentDocument);if(!f)break;cur=f.contentWindow}return cur}catch(e){return null}}
function install(){try{const w=deepest(shell.contentWindow);if(!w||!w.document?.body)return;const d=w.document;if(w.__v21installed)return;w.__v21installed=1;d.title='父の窯と鉄の夢 v21';
const s=d.createElement('style');s.textContent=`
.v21daily{margin:10px 0;padding:13px;background:linear-gradient(145deg,#2f1e3c,#17101f);border:3px solid #8b6a9b;border-radius:20px;box-shadow:0 8px 24px #0008}.v21head{display:flex;align-items:center;justify-content:space-between;gap:10px}.v21head h3{margin:0;color:#fff0b8}.v21head small{color:#d5c1da}.v21reward{padding:5px 9px;border-radius:999px;background:#120c18;border:1px solid #856593;color:#ffe0a1;font-size:11px;font-weight:900}.v21quests{display:grid;gap:8px;margin-top:10px}.v21q{display:grid;grid-template-columns:38px 1fr auto;gap:9px;align-items:center;padding:9px;background:#120c18;border:2px solid #594362;border-radius:15px}.v21q.done{border-color:#7fe3aa;background:linear-gradient(135deg,#11271f,#120c18)}.v21icon{width:34px;height:34px;display:grid;place-items:center;border-radius:11px;background:#2d2035;font-size:19px}.v21q b{display:block;color:#fff3dc}.v21q small{color:#c9b5cf}.v21count{font-weight:1000;color:#ffe3a3;white-space:nowrap}.v21bar{height:7px;margin-top:5px;background:#0b0710;border:1px solid #57425e;border-radius:99px;overflow:hidden}.v21bar i{display:block;height:100%;background:linear-gradient(90deg,#8b63dc,#ffd98a);transition:.25s width}.v21all{margin-top:10px;padding:10px;text-align:center;border-radius:14px;border:2px dashed #6c5278;color:#cdbbd3;font-weight:900}.v21all.done{border-style:solid;border-color:#ffe09a;background:#3b2a17;color:#fff1b0;animation:v21glow 1s ease-in-out infinite alternate}.v21pop{position:fixed;left:50%;top:35%;z-index:10050;transform:translate(-50%,-50%) scale(.7);opacity:0;pointer-events:none;background:#190f20;border:3px solid #ffe09a;border-radius:22px;padding:18px 24px;color:#fff3dc;text-align:center;font-weight:1000;box-shadow:0 20px 60px #000b,0 0 35px #ffd98a66}.v21pop.on{animation:v21pop .8s ease-out}.v21stamp{font-size:42px}.v21tiny{font-size:11px;color:#d6c2dc;margin-top:5px}@keyframes v21pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.65)}25%,70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-58%) scale(.96)}}@keyframes v21glow{from{box-shadow:0 0 8px #ffd98a22}to{box-shadow:0 0 28px #ffd98a77}}
`;d.head.appendChild(s);
const day=new Date().toISOString().slice(0,10),key='fathersForgeV21Daily:'+day;let st={forge:0,sell:0,care:0,claimed:false};try{st={...st,...JSON.parse(localStorage.getItem(key)||'{}')}}catch(e){}const goals=[['forge','⚒️','武器を1本完成','鍛冶を最後まで進める',1],['sell','🛒','商品を1つ販売','お客さんに完成品を届ける',1],['care','🍲','生活ケアを2回','食事・薬・看病・睡眠を行う',2]];
const pop=d.createElement('div');pop.className='v21pop';pop.innerHTML='<div class="v21stamp">✨</div><div>デイリー達成！</div><div class="v21tiny">今日の工房スタンプを獲得</div>';d.body.appendChild(pop);function save(){try{localStorage.setItem(key,JSON.stringify(st))}catch(e){}}
function home(){return d.querySelector('#home')||[...d.querySelectorAll('.screen')].find(x=>/工房ホーム/.test(x.innerText))||d.querySelector('.panel')}
function ensure(){const h=home();if(!h)return;let box=d.querySelector('.v21daily');if(!box){box=d.createElement('div');box.className='v21daily';box.innerHTML='<div class="v21head"><div><small>DAILY CHALLENGE</small><h3>🔥 今日の工房目標</h3></div><div class="v21reward">3/3で達成</div></div><div class="v21quests"></div><div class="v21all"></div>';const title=h.querySelector('.title');if(title&&title.nextSibling)h.insertBefore(box,title.nextSibling);else h.prepend(box)}render()}
function render(){const box=d.querySelector('.v21daily');if(!box)return;const q=box.querySelector('.v21quests');q.innerHTML=goals.map(([k,ic,n,desc,max])=>{const v=Math.min(max,st[k]||0),done=v>=max,p=Math.round(v/max*100);return `<div class="v21q ${done?'done':''}"><div class="v21icon">${done?'✅':ic}</div><div><b>${n}</b><small>${desc}</small><div class="v21bar"><i style="width:${p}%"></i></div></div><div class="v21count">${v}/${max}</div></div>`}).join('');const all=goals.every(([k,,, ,m])=>(st[k]||0)>=m),a=box.querySelector('.v21all');a.className='v21all'+(all?' done':'');a.textContent=all?'🏆 本日の工房目標 COMPLETE — 明日も新しい目標が登場':'あと少しで今日の工房目標を達成';if(all&&!st.claimed){st.claimed=true;save();pop.classList.remove('on');void pop.offsetWidth;pop.classList.add('on')}}
function inc(k,n=1){const g=goals.find(x=>x[0]===k);if(!g)return;st[k]=Math.min(g[4],(st[k]||0)+n);save();render()}
let hadComplete=false;const mo=new MutationObserver(()=>{ensure();const complete=!!d.querySelector('.result')&&/完成！|武器完成|鍛造成功/.test(d.body.innerText);if(complete&&!hadComplete)inc('forge');hadComplete=complete});mo.observe(d.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['class']});
d.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const t=b.textContent.trim();if(/販売|売る|接客/.test(t))setTimeout(()=>inc('sell'),250);if(/食事|薬|看病|睡眠/.test(t))inc('care')},true);ensure();
}catch(e){console.error('v21 install',e)}}function boot(){install();setTimeout(install,350);setTimeout(install,1300)}shell.addEventListener('load',boot);boot();
</script></body></html>
