<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>父の窯と鉄の夢 v14</title><style>html,body{margin:0;height:100%;background:#0d0710;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="game" src="/v12.html?v=14" title="父の窯と鉄の夢 v14"></iframe><script>

const s=d.createElement('style');s.textContent=`

`;d.head.appendChild(s);

const wrap=d.querySelector('.wrap');const coach=d.createElement('div');coach.className='v14coach';coach.innerHTML='<div class="v14coachTop"><div><small>NEXT ACTION</small><br><b id="v14next">今日の流れを確認</b></div><span>🧭</span></div><div class="v14steps"><span class="v14step" data-k="home">①準備</span><span class="v14step" data-k="explore">②探索</span><span class="v14step" data-k="forge">③制作</span><span class="v14step" data-k="sell">④販売</span><span class="v14step" data-k="life">⑤生活</span></div><div class="v14hint" id="v14hint">迷ったら、光っているボタンを押せば進みます。</div>';

function findButton(rx){return [...d.querySelectorAll('button')].find(b=>b.offsetParent!==null&&rx.test(b.textContent.trim()))}
function guide(){clearFocus();const id=visibleScreen(),next=d.getElementById('v14next'),hint=d.getElementById('v14hint');let key='home',title='今日のミッションを確認',msg='工房ホームで今日の目標を確認しよう。',rx=null;if(id==='forge'){key='forge';title='武器を1つ完成させよう';msg='レシピを選び、制作開始→4工程の順で進めます。';rx=/制作|開始|ここだ/}else if(/market|shop|sell/.test(id)){key='sell';title='完成品をお客さんへ販売';msg='在庫から売る品を選び、お客さんの反応を見よう。';rx=/販売|売る|接客/}else if(/explore|adventure/.test(id)){key='explore';title='素材を集めに探索へ';msg='不足素材を増やして、次の制作につなげよう。';rx=/探索|出発|回収/}else if(/life|home2|rest/.test(id)){key='life';title='体調を整えて次の日へ';msg='空腹や体力を見て、食事か睡眠を選ぼう。';rx=/食事|睡眠/}else{const body=d.body.innerText;if(/素材|探索/.test(body)&&findButton(/探索/)){key='explore';title='まず素材を集めよう';msg='「探索」を押して制作に必要な素材を確保。';rx=/探索/}else if(findButton(/制作/)){key='forge';title='素材があるなら武器制作へ';msg='「制作」から最初の武器を完成させよう。';rx=/制作/}}

}catch(e){console.error(e)}});
