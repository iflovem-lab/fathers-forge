<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>父の窯と鉄の夢 v22</title><style>html,body{margin:0;height:100%;background:#09050c;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}.badge{position:fixed;left:8px;top:8px;z-index:99;background:#100a16e8;border:2px solid #e8c77a;border-radius:999px;padding:5px 9px;color:#fff0bd;font:900 11px system-ui;pointer-events:none}</style></head><body><div class="badge">v22 • DAY RECAP</div><iframe id="shell" src="/v21.html?v=22" title="父の窯と鉄の夢 v22"></iframe><script>
const shell=document.getElementById('shell');
function deepest(win){try{let cur=win;for(let i=0;i<16;i++){const f=[...cur.document.querySelectorAll('iframe')].find(x=>x.contentWindow&&x.contentDocument);if(!f)break;cur=f.contentWindow}return cur}catch(e){return null}}
function install(){try{const w=deepest(shell.contentWindow);if(!w||!w.document?.body||w.__v22installed)return;w.__v22installed=1;const d=w.document;d.title='父の窯と鉄の夢 v22';const st={forge:0,sell:0,explore:0,care:0};
const css=d.createElement('style');css.textContent=`.v22recap{position:fixed;inset:0;z-index:12000;background:#07040bd9;display:grid;place-items:center;padding:18px;opacity:0;pointer-events:none;transition:.2s}.v22recap.on{opacity:1;pointer-events:auto}.v22card{width:min(460px,94vw);background:linear-gradient(155deg,#40294f,#17101f 62%,#0e0913);border:4px solid #f1ce79;border-radius:28px;padding:20px;color:#fff3dc;box-shadow:0 24px 70px #000c,0 0 38px #ffd98a44;transform:translateY(16px) scale(.94);transition:.25s}.v22recap.on .v22card{transform:none}.v22ey{font-size:11px;font-weight:1000;color:#d8c0df;letter-spacing:.1em}.v22card h2{margin:4px 0 12px;color:#fff0b2;font-size:28px}.v22grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.v22stat{background:#120c18;border:2px solid #5c4665;border-radius:16px;padding:11px}.v22stat small{display:block;color:#cdb9d2}.v22stat b{display:block;color:#ffe3a3;font-size:25px;margin-top:2px}.v22grade{text-align:center;margin:14px 0 8px;padding:12px;border-radius:18px;background:#2b1d35;border:2px solid #8c6c9c}.v22grade strong{display:block;font-size:35px;color:#fff0a7}.v22msg{color:#d8c5dc;line-height:1.55;font-size:13px}.v22close{width:100%;margin-top:12px;background:linear-gradient(#ffe2a7,#d79028)!important;color:#2b1600!important;border-color:#fff0bd!important}`;d.head.appendChild(css);
const m=d.createElement('div');m.className='v22recap';m.innerHTML='<div class="v22card"><div class="v22ey">WORKSHOP DAY REPORT</div><h2>🌙 今日の工房日誌</h2><div class="v22grid"><div class="v22stat"><small>⚒️ 鍛冶</small><b data-k="forge">0</b></div><div class="v22stat"><small>🛒 販売</small><b data-k="sell">0</b></div><div class="v22stat"><small>🗺️ 探索</small><b data-k="explore">0</b></div><div class="v22stat"><small>🍲 生活ケア</small><b data-k="care">0</b></div></div><div class="v22grade"><small>今日の働きぶり</small><strong>S</strong></div><div class="v22msg"></div><button class="v22close" type="button">明日も工房を開く</button></div>';d.body.appendChild(m);m.querySelector('.v22close').onclick=()=>m.classList.remove('on');
function recap(){Object.keys(st).forEach(k=>m.querySelector(`[data-k="${k}"]`).textContent=st[k]);const score=st.forge*3+st.sell*2+st.explore+st.care;const grade=score>=10?'S':score>=7?'A':score>=4?'B':'C';m.querySelector('.v22grade strong').textContent=grade;m.querySelector('.v22msg').textContent=grade==='S'?'大充実の一日。鍛冶も暮らしもよく回りました。':grade==='A'?'よく働いた一日。工房の評判が少しずつ育っています。':grade==='B'?'着実な一日。明日はもう一本、武器を完成させてみよう。':'今日は無理せず終了。明日は小さな目標から始めよう。';m.classList.add('on')}
let complete=false;const mo=new MutationObserver(()=>{const now=!!d.querySelector('.result')&&/完成！|武器完成|鍛造成功/.test(d.body.innerText);if(now&&!complete)st.forge++;complete=now});mo.observe(d.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['class']});
d.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const t=b.textContent.trim();if(/販売|売る|接客/.test(t))st.sell++;if(/探索|出発|回収/.test(t))st.explore++;if(/食事|薬|看病/.test(t))st.care++;if(/睡眠/.test(t)){st.care++;setTimeout(recap,180)}},true);
}catch(e){console.error('v22 install',e)}}function boot(){install();setTimeout(install,300);setTimeout(install,1200)}shell.addEventListener('load',boot);boot();
</script></body></html>
