<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>父の窯と鉄の夢 v35</title><style>html,body{margin:0;height:100%;background:#08040b;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}.badge{position:fixed;left:max(8px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));z-index:99;background:#100a16e8;border:2px solid #8fd7c0;border-radius:999px;padding:5px 9px;color:#e8fff7;font:900 11px system-ui;pointer-events:none;box-shadow:0 5px 16px #0008}</style></head><body><div class="badge">v35 • STOCK COMPASS</div><iframe id="shell" src="/v34.html?v=35" title="父の窯と鉄の夢 v35"></iframe><script>
const shell=document.getElementById('shell');
function deepest(win){try{let cur=win;for(let i=0;i<56;i++){const f=[...cur.document.querySelectorAll('iframe')].find(x=>x.contentWindow&&x.contentDocument);if(!f)break;cur=f.contentWindow}return cur}catch(e){return null}}
function install(){try{const w=deepest(shell.contentWindow);if(!w||!w.document?.body||w.__v35installed)return;w.__v35installed=1;const d=w.document;d.title='父の窯と鉄の夢 v35';
const css=d.createElement('style');css.id='v35-stock-style';css.textContent=`
.v35-stock{position:fixed;right:max(10px,env(safe-area-inset-right));top:max(52px,calc(env(safe-area-inset-top) + 46px));z-index:99990;width:min(292px,calc(100vw - 20px));font-family:system-ui,-apple-system,sans-serif;color:#effff8;filter:drop-shadow(0 14px 26px #0009);transition:.2s ease}.v35-stock.v35-hide{opacity:0;pointer-events:none;transform:translateY(-6px)}.v35-card{background:linear-gradient(155deg,#11211df2,#0c1113f5);border:1px solid #5b8f7e;border-radius:17px;overflow:hidden;backdrop-filter:blur(10px)}.v35-head{display:flex;align-items:center;gap:8px;padding:9px 10px;border-bottom:1px solid #2d5147;background:#12251f}.v35-title{font:900 12px/1.2 system-ui;letter-spacing:.02em;flex:1}.v35-mini{font:900 8px system-ui;color:#9bd4c1;border:1px solid #416d60;border-radius:999px;padding:3px 6px;background:#0d1916}.v35-toggle{width:26px;height:26px;border:0;border-radius:8px;background:#203a32;color:#eafff8;font-weight:1000;cursor:pointer}.v35-body{padding:9px}.v35-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.v35-stat{padding:7px 5px;border-radius:11px;background:#0c1714;border:1px solid #29493f;text-align:center}.v35-stat small{display:block;color:#8eaea3;font-size:8px}.v35-stat b{display:block;margin-top:2px;font-size:13px;color:#f2fff9}.v35-next{margin-top:7px;padding:8px 9px;border-radius:12px;background:linear-gradient(120deg,#193b2d,#182023);border:1px solid #4e806f}.v35-next small{display:block;color:#9cb8ae;font-size:8px}.v35-next strong{display:block;margin-top:2px;font-size:11px;color:#eafff3}.v35-bar{height:5px;margin-top:7px;border-radius:999px;background:#09100e;overflow:hidden}.v35-fill{height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#70c8a6,#d9ee8f);transition:width .35s ease}.v35-note{margin-top:6px;font-size:9px;line-height:1.35;color:#9bb2aa}.v35-collapsed .v35-body{display:none}.v35-collapsed{width:178px}.v35-pulse{animation:v35pulse .55s ease}@keyframes v35pulse{50%{transform:scale(1.015);box-shadow:0 0 0 3px #86d2b326}}@media(max-width:620px){.v35-stock{top:auto;bottom:max(76px,calc(env(safe-area-inset-bottom) + 70px));right:8px;width:min(260px,calc(100vw - 16px))}.v35-collapsed{width:164px}}@media(prefers-reduced-motion:reduce){.v35-stock,.v35-fill{transition:none}.v35-pulse{animation:none}}
`;d.head.appendChild(css);
const box=d.createElement('aside');box.className='v35-stock v35-hide';box.innerHTML='<div class="v35-card"><div class="v35-head"><span>📦</span><div class="v35-title">在庫コンパス</div><span class="v35-mini">LIVE</span><button class="v35-toggle" type="button" aria-label="在庫コンパスを折りたたむ">−</button></div><div class="v35-body"><div class="v35-grid"><div class="v35-stat"><small>完成品</small><b data-k="made">0</b></div><div class="v35-stat"><small>売り時</small><b data-k="sell">0</b></div><div class="v35-stat"><small>在庫感</small><b data-k="state">—</b></div></div><div class="v35-next"><small>NEXT BEST</small><strong data-k="next">まず1品つくろう</strong><div class="v35-bar"><div class="v35-fill"></div></div></div><div class="v35-note" data-k="note">在庫の偏りを見て、次の行動を短く案内します。</div></div></div>';d.body.appendChild(box);
let collapsed=false;box.querySelector('.v35-toggle').addEventListener('click',()=>{collapsed=!collapsed;box.classList.toggle('v35-collapsed',collapsed);box.querySelector('.v35-toggle').textContent=collapsed?'+':'−'});
function txt(el){return(el?.innerText||el?.textContent||'').trim()}
function visibleScreens(){return [...d.querySelectorAll('.screen,main,section')].filter(x=>{try{return x.offsetParent!==null}catch(e){return false}})}
function stockContext(){const vs=visibleScreens(),hit=vs.find(x=>/在庫|販売|市場|店|完成品|商品/.test(txt(x)));return hit||null}
function countCards(sc){if(!sc)return[];return [...sc.querySelectorAll('.sellrow,.item,.card,.result,[class*=item],[class*=stock]')].filter((x,i,a)=>{if(a.indexOf(x)!==i||x.closest('.v35-stock'))return false;const t=txt(x);if(t.length<2||t.length>450)return false;return /剣|斧|槍|武器|完成品|商品|売る|販売|G|円/.test(t)})}
function render(){const sc=stockContext();if(!sc){box.classList.add('v35-hide');return}box.classList.remove('v35-hide');const cards=countCards(sc);const sale=cards.filter(x=>/売る|販売|売却|今売る/.test(txt(x)));const n=cards.length;const sellN=sale.length||Math.min(n,Math.max(0,Math.round(n*.45)));let state=n===0?'空':n<=2?'少':n<=5?'適正':'多';let next='';let note='';let pct=0;if(n===0){next='鍛冶で完成品を1つ作る';note='販売できる品がありません。まず制作を優先。';pct=12}else if(n<=2){next='あと1〜2品つくって選択肢を増やす';note='在庫が薄め。売り切る前に少し補充すると安定。';pct=38}else if(n<=5){next=sellN?'「今売る」候補から1品販売':'高品質品を残して1品販売';note='在庫はちょうど良い状態。回転を作るタイミング。';pct=68}else{next='在庫を1〜2品売って圧縮';note='完成品が多め。資金化して次の制作へつなげよう。';pct=92}box.querySelector('[data-k="made"]').textContent=n;box.querySelector('[data-k="sell"]').textContent=sellN;box.querySelector('[data-k="state"]').textContent=state;box.querySelector('[data-k="next"]').textContent=next;box.querySelector('[data-k="note"]').textContent=note;box.querySelector('.v35-fill').style.width=pct+'%';box.querySelector('.v35-card').classList.remove('v35-pulse');void box.offsetWidth;box.querySelector('.v35-card').classList.add('v35-pulse')}
let timer;const mo=new MutationObserver(()=>{clearTimeout(timer);timer=setTimeout(render,140)});mo.observe(d.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['class','style']});d.addEventListener('click',()=>setTimeout(render,160),true);render();
}catch(e){console.error('v35 install',e)}}
function boot(){install();setTimeout(install,420);setTimeout(install,1500)}shell.addEventListener('load',boot);boot();
</script></body></html>
