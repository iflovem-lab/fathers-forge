<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>父の窯と鉄の夢 v20</title><style>html,body{margin:0;height:100%;background:#09050c;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}.v20badge{position:fixed;left:8px;top:8px;z-index:99;background:#100a16e8;border:2px solid #e8c77a;border-radius:999px;padding:5px 9px;color:#fff0bd;font:900 11px system-ui;pointer-events:none;box-shadow:0 5px 20px #0008}</style></head><body><div class="v20badge">v20 • MODERN UI</div><iframe id="shell" src="/v19.html?v=20" title="父の窯と鉄の夢 v20"></iframe><script>

function deepest(win){try{let cur=win;for(let i=0;i<12;i++){const f=[...cur.document.querySelectorAll('iframe')].find(x=>x.contentWindow&&x.contentDocument);if(!f)break;cur=f.contentWindow}return cur}catch(e){return null}}
function install(){try{const w=deepest(shell.contentWindow);if(!w||!w.document?.body)return;const d=w.document;if(w.__v20installed)return;w.__v20installed=1;d.title='父の窯と鉄の夢 v20';
const s=d.createElement('style');s.textContent=`

ransition:.13s transform,.13s filter,.13s box-shadow!important}button:active{transform:translateY(3px) scale(.985)!important;filter:brightness(1.15)}button:after{content:'';position:absolute;inset:-20%;background:radial-gradient(circle,#fff6 0,transparent 45%);opacity:0;transform:scale(.2);pointer-events:none}button.v20tap:after{animation:v20tap .4s ease-out}.bubble{box-shadow:0 5px 14px #0004!important}.result{box-shadow:0 8px 24px #0008,0 0 25px #ffd98a22!important}.v20urgent{border-color:#ff8f9f!important;box-shadow:0 0 0 2px #ff8f9f33 inset,0 0 20px #ff6f8833!important;animation:v20urgent 1.2s ease-in-out infinite alternate}.v20good{border-color:#7fe3aa!important}.v20float{position:fixed;z-index:10030;pointer-events:none;font-weight:1000;font-size:18px;color:#fff0a9;text-shadow:0 2px #000,0 0 12px #ffcc67;animation:v20float .75s ease-out forwards}.v20ambient{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffcb6e;box-shadow:0 0 10px #ff9b46;opacity:.65;pointer-events:none;animation:v20ember linear infinite}.v20sectiontag{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;margin-bottom:7px;border-radius:999px;background:#100b16;border:1px solid #73567f;color:#e6d1ee;font-size:10px;font-weight:900;letter-spacing:.06em}@keyframes v20shine{0%,72%{transform:translateX(-120%)}90%,100%{transform:translateX(120%)}}@keyframes v20tap{0%{opacity:.8;transform:scale(.2)}100%{opacity:0;transform:scale(1.5)}}@keyframes v20float{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}25%{opacity:1;transform:translate(-50%,0) scale(1.08)}100%{opacity:0;transform:translate(-50%,-40px) scale(1)}}@keyframes v20urgent{from{filter:brightness(1)}to{filter:brightness(1.12)}}@keyframes v20ember{from{transform:translateY(0) scale(.6);opacity:0}20%{opacity:.7}to{transform:translateY(-95px) translateX(18px) scale(1.2);opacity:0}}@media(max-width:680px){.tabs{gap:5px!important}.tab{padding:9px 7px!important;font-size:12px}.panel{border-radius:18px!important}.go function decorateTitles(){d.querySelectorAll('.title').forEach(t=>{if(t.querySelector('.v20sectiontag'))return;const tx=t.innerText||'';let label='GAME';if(/工房ホーム/.test(tx))label='🏠 WORKSHOP';else if(/武器制作|鍛冶/.test(tx))label='⚒️ CRAFT';else if(/販売|市場|店/.test(tx))label='🛒 SHOP';else if(/探索|冒険/.test(tx))label='🗺️ EXPLORE';else if(/生活|母/.test(tx))label='🍲 LIFE';const e=d.createElement('div');e.className='v20sectiontag';e.textContent=label;t.prepend(e)})}
function embers(){const sc=d.querySelector('.scene');if(!sc||sc.querySelector('.v20ambient'))return;for(let i=0;i<11;i++){const e=d.createElement('i');e.className='v20ambient';e.style.left=(18+Math.random()*25)+'%';e.style.bottom=(18+Math.random()*22)+'%';e.style.animationDuration=(2.5+Math.random()*2.5)+'s';e.style.animationDelay=(-Math.random()*4)+'s';sc.appendChild(e)}}
function statuses(){d.querySelectorAll('.stat').forEach(x=>{x.classList.remove('v20urgent','v20good');const tx=x.innerText;const m=tx.match(/(\d+)/);if(!m)return;const n=+m[1];if(/体力|空腹|睡眠|母|体調/.test(tx)){if(n<=30)x.classList.add('v20urgent');else if(n>=75)x.classList.add('v20good')}})}
function floatAt(b,text){const r=b.getBoundingClientRect(),f=d.createElement('div');f.className='v20float';f.textContent=text;f.style.left=(r.left+r.width/2)+'px';f.style.top=Math.max(80,r.top)+'px';d.body.appendChild(f);setTimeout(()=>f.remove(),800)}
d.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;b.classList.remove('v20tap');void b.offsetWidth;b.classList.add('v20tap');const t=b.textContent.trim();if(/ここだ/.test(t))floatAt(b,'CLANG!');else if(/販売|売る|接客/.test(t))floatAt(b,'+G');else if(/探索|出発/.test(t))floatAt(b,'GO!');else if(/食事|薬|看病/.test(t))floatAt(b,'♥')},true);
let timer;const mo=new MutationObserver(()=>{clearTimeout(timer);timer=setTimeout(()=>{decorateTitles();embers();statuses()},80)});mo.observe(d.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['class']});decorateTitles();embers();statuses();
}catch(e){console.error('v20 install',e)}}
function boot(){install();setTimeout(install,300);setTimeout(install,1200)}shell.addEventListener('load',boot);boot();
