<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>父の窯と鉄の夢 v33</title><style>html,body{margin:0;height:100%;background:#08040b;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}.badge{position:fixed;left:max(8px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));z-index:99;background:#100a16e8;border:2px solid #efc084;border-radius:999px;padding:5px 9px;color:#fff2de;font:900 11px system-ui;pointer-events:none;box-shadow:0 5px 16px #0008}</style></head><body><div class="badge">v33 • STAGE ROAD</div><iframe id="shell" src="/v32.html?v=33" title="父の窯と鉄の夢 v33"></iframe><script>
const shell=document.getElementById('shell');
function deepest(win){try{let cur=win;for(let i=0;i<48;i++){const f=[...cur.document.querySelectorAll('iframe')].find(x=>x.contentWindow&&x.contentDocument);if(!f)break;cur=f.contentWindow}return cur}catch(e){return null}}
function install(){try{const w=deepest(shell.contentWindow);if(!w||!w.document?.body||w.__v33installed)return;w.__v33installed=1;const d=w.document;d.title='父の窯と鉄の夢 v33';
const css=d.createElement('style');css.id='v33-stage-style';css.textContent=`
.v33-stage{position:fixed;right:max(10px,env(safe-area-inset-right));bottom:max(78px,calc(env(safe-area-inset-bottom) + 70px));z-index:99996;width:min(286px,calc(100vw - 20px));font-family:system-ui,-apple-system,sans-serif;color:#fff2df;pointer-events:auto}.v33-card{background:linear-gradient(165deg,#1a1115f3,#0e0a0df7);border:1px solid #7c5948;border-radius:16px;box-shadow:0 14px 34px #000a,0 0 0 1px #f2bd7810 inset;overflow:hidden}.v33-head{display:flex;align-items:center;gap:7px;padding:9px 10px 7px}.v33-icon{font-size:16px}.v33-txt{min-width:0;flex:1}.v33-title{font:900 10px/1.15 system-ui;color:#ffdca9;letter-spacing:.04em}.v33-rank{font:800 9px/1.3 system-ui;color:#c8b29f;margin-top:2px}.v33-toggle{appearance:none;border:0!important;background:#2a1b1f!important;color:#f0d7be!important;min-height:27px!important;height:27px!important;padding:0 8px!important;border-radius:999px!important;font:900 9px system-ui!important;box-shadow:none!important}.v33-body{padding:0 10px 10px}.v33-row{display:flex;align-items:center;justify-content:space-between;gap:8px;font:800 9px/1.2 system-ui;color:#d6c0aa;margin-bottom:6px}.v33-row strong{color:#fff0cf;font-size:10px}.v33-bar{height:8px;border-radius:999px;background:#2b2020;overflow:hidden;border:1px solid #4a3632;box-shadow:inset 0 1px 3px #0008}.v33-fill{height:100%;width:0;background:linear-gradient(90deg,#9a542d,#e4a65b,#ffd28a);border-radius:inherit;transition:width .45s cubic-bezier(.22,.8,.24,1)}.v33-road{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px}.v33-stop{text-align:center;opacity:.38;transition:.25s ease}.v33-stop i{display:grid;place-items:center;margin:auto;width:22px;height:22px;border-radius:50%;border:1px solid #67504a;background:#171013;font:900 9px system-ui;font-style:normal}.v33-stop span{display:block;margin-top:3px;font:800 7px/1.15 system-ui;color:#bda999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.v33-stop.on{opacity:1}.v33-stop.on i{border-color:#efb66d;background:#3a2418;color:#ffe0aa;box-shadow:0 0 14px #e9a85a25}.v33-stop.done{opacity:.82}.v33-stop.done i{border-color:#769071;background:#17261a;color:#c9e3bf}.v33-next{margin-top:8px;padding:7px 8px;border-radius:10px;background:#140e11;border:1px solid #493431;font:800 8px/1.3 system-ui;color:#bfa996}.v33-stage.compact .v33-body{display:none}.v33-pop{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%) scale(.92);z-index:999999;background:linear-gradient(180deg,#3b2518f7,#171014f8);border:2px solid #efb46c;border-radius:18px;padding:14px 18px;color:#fff2d7;text-align:center;box-shadow:0 20px 60px #000c,0 0 30px #efaa5830;opacity:0;pointer-events:none;animation:v33pop 2.2s ease forwards}.v33-pop b{display:block;font:1000 15px/1.2 system-ui}.v33-pop small{display:block;margin-top:5px;font:800 10px/1.3 system-ui;color:#d9b98e}@keyframes v33pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.82)}12%,76%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-54%) scale(.98)}}@media(max-width:480px){.v33-stage{right:8px;bottom:max(72px,calc(env(safe-area-inset-bottom) + 64px));width:min(248px,calc(100vw - 16px))}.v33-head{padding:8px 9px 6px}.v33-body{padding:0 9px 9px}.v33-stop span{font-size:6.5px}}@media(prefers-reduced-motion:reduce){.v33-fill{transition:none}.v33-pop{animation:none;opacity:1}}
`;d.head.appendChild(css);
const box=d.createElement('div');box.className='v33-stage';box.innerHTML=`<div class="v33-card"><div class="v33-head"><div class="v33-icon">🏰</div><div class="v33-txt"><div class="v33-title">工房ランク</div><div class="v33-rank">駆け出しの鍛冶屋</div></div><button class="v33-toggle" type="button">しまう</button></div><div class="v33-body"><div class="v33-row"><span>名声</span><strong class="v33-score">0 / 4</strong></div><div class="v33-bar"><div class="v33-fill"></div></div><div class="v33-road"><div class="v33-stop" data-at="0"><i>1</i><span>火を起こす</span></div><div class="v33-stop" data-at="4"><i>2</i><span>街の工房</span></div><div class="v33-stop" data-at="9"><i>3</i><span>評判の名工</span></div><div class="v33-stop" data-at="15"><i>4</i><span>王都の噂</span></div></div><div class="v33-next">探索・鍛冶・販売・暮らしを重ねると工房の名が広がります。</div></div></div>`;d.body.appendChild(box);
const ranks=[{at:0,name:'駆け出しの鍛冶屋',label:'火を起こす'},{at:4,name:'街で知られる工房',label:'街の工房'},{at:9,name:'評判の名工',label:'評判の名工'},{at:15,name:'王都まで届く名声',label:'王都の噂'}];let score=0;try{score=Math.max(0,Number(localStorage.getItem('ff-v33-fame')||0)||0)}catch(e){}let prevRank=-1;function rankIndex(){let x=0;ranks.forEach((r,i)=>{if(score>=r.at)x=i});return x}function save(){try{localStorage.setItem('ff-v33-fame',String(score))}catch(e){}}function celebrate(name){const p=d.createElement('div');p.className='v33-pop';p.innerHTML=`<b>✨ 工房ランクアップ</b><small>${name}</small>`;d.body.appendChild(p);setTimeout(()=>p.remove(),2300)}function render(initial=false){const ri=rankIndex(),cur=ranks[ri],nxt=ranks[ri+1];box.querySelector('.v33-rank').textContent=cur.name;const max=nxt?nxt.at:15;box.querySelector('.v33-score').textContent=nxt?`${score} / ${max}`:`${score} • MAX`;const start=cur.at,end=nxt?nxt.at:Math.max(15,score),pct=nxt?Math.min(100,Math.max(0,(score-start)/(end-start)*100)):100;box.querySelector('.v33-fill').style.width=pct+'%';[...box.querySelectorAll('.v33-stop')].forEach((el,i)=>{el.classList.toggle('done',i<ri);el.classList.toggle('on',i===ri)});box.querySelector('.v33-next').textContent=nxt?`次は「${nxt.name}」まであと ${Math.max(0,nxt.at-score)} 名声`:'🏆 王都にも名を知られる工房になりました';if(!initial&&prevRank>=0&&ri>prevRank)celebrate(cur.name);prevRank=ri;save()}
function text(el){return(el?.innerText||el?.textContent||el?.getAttribute?.('aria-label')||'').trim()}function gainFor(t){if(/販売|売る|売却|購入/i.test(t))return 2;if(/鍛冶|制作|作る|打つ|叩|完成/i.test(t))return 2;if(/探索|冒険|採取|素材.*集/i.test(t))return 1;if(/母|看病|休む|食事|暮らし|生活/i.test(t))return 1;return 0}let last='';d.addEventListener('click',e=>{const b=e.target.closest('button,.btn,[role="button"],a');if(!b||box.contains(b))return;const t=text(b),g=gainFor(t);if(!g)return;const key=t+'|'+Math.floor(Date.now()/800);if(key===last)return;last=key;score=Math.min(99,score+g);render(false)},true);box.querySelector('.v33-toggle').addEventListener('click',()=>{box.classList.toggle('compact');box.querySelector('.v33-toggle').textContent=box.classList.contains('compact')?'ひらく':'しまう'});render(true);
}catch(e){console.error('v33 install',e)}}function boot(){install();setTimeout(install,400);setTimeout(install,1500)}shell.addEventListener('load',boot);boot();
</script></body></html>
