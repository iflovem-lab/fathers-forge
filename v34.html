<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>父の窯と鉄の夢 v34</title><style>html,body{margin:0;height:100%;background:#08040b;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}.badge{position:fixed;left:max(8px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));z-index:99;background:#100a16e8;border:2px solid #efc084;border-radius:999px;padding:5px 9px;color:#fff2de;font:900 11px system-ui;pointer-events:none;box-shadow:0 5px 16px #0008}</style></head><body><div class="badge">v34 • CUSTOMER JOY</div><iframe id="shell" src="/v33.html?v=34" title="父の窯と鉄の夢 v34"></iframe><script>
const shell=document.getElementById('shell');
function deepest(win){try{let cur=win;for(let i=0;i<48;i++){const f=[...cur.document.querySelectorAll('iframe')].find(x=>x.contentWindow&&x.contentDocument);if(!f)break;cur=f.contentWindow}return cur}catch(e){return null}}
function install(){try{const w=deepest(shell.contentWindow);if(!w||!w.document?.body||w.__v34installed)return;w.__v34installed=1;const d=w.document;d.title='父の窯と鉄の夢 v34';
const css=d.createElement('style');css.id='v34-customer-style';css.textContent=`
.v34-toast{position:fixed;left:50%;bottom:max(88px,calc(env(safe-area-inset-bottom) + 82px));transform:translateX(-50%) translateY(18px) scale(.96);z-index:999999;width:min(340px,calc(100vw - 24px));background:linear-gradient(160deg,#21151bf5,#100b0ff8);border:1px solid #b87a50;border-radius:18px;padding:11px 12px;color:#fff2df;box-shadow:0 18px 46px #000b,0 0 24px #d98c4120;opacity:0;pointer-events:none;font-family:system-ui,-apple-system,sans-serif}.v34-toast.show{animation:v34in 2.5s ease forwards}.v34-top{display:flex;align-items:center;gap:9px}.v34-face{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#33211f;border:1px solid #795044;font-size:21px;box-shadow:inset 0 1px #ffffff10}.v34-copy{min-width:0;flex:1}.v34-name{font:900 9px/1.2 system-ui;color:#d8b28f;letter-spacing:.04em}.v34-voice{margin-top:3px;font:900 12px/1.35 system-ui;color:#fff0d2}.v34-meta{display:flex;gap:6px;align-items:center;margin-top:8px}.v34-chip{padding:4px 7px;border-radius:999px;background:#171014;border:1px solid #49332e;font:900 8px system-ui;color:#d7bfa8}.v34-chip.good{border-color:#7e8e68;color:#d7e7c8;background:#152016}.v34-stars{margin-left:auto;color:#ffd17e;font-size:11px;letter-spacing:1px}.v34-spark{position:fixed;z-index:1000000;pointer-events:none;font-size:15px;animation:v34spark .85s ease-out forwards}@keyframes v34in{0%{opacity:0;transform:translateX(-50%) translateY(18px) scale(.96)}10%,76%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}100%{opacity:0;transform:translateX(-50%) translateY(-9px) scale(.99)}}@keyframes v34spark{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1.2) rotate(18deg)}}@media(prefers-reduced-motion:reduce){.v34-toast.show{animation:none;opacity:1}.v34-spark{display:none}}
`;d.head.appendChild(css);
let sales=0;try{sales=Math.max(0,Number(localStorage.getItem('ff-v34-sales')||0)||0)}catch(e){}
const customers=[
 {face:'🧑‍🌾',name:'旅の農夫',voices:['これなら畑仕事の護身にも使えそうだ。','手に馴染むな。いい仕事だ！','村のみんなにも教えてやろう。']},
 {face:'🛡️',name:'若い騎士',voices:['重心がいい。次の遠征に持っていく。','この刃なら仲間を守れそうだ。','隊長にも見せたい出来だな。']},
 {face:'🧙',name:'旅の術師',voices:['鉄の響きに、作り手の気配を感じる。','これは長旅の相棒になりそうだ。','よい品には物語が宿るものだ。']},
 {face:'🧔',name:'古参の冒険者',voices:['こういう道具は派手さより信頼だ。','うむ、長く使えそうだな。','久しぶりに良い鍛冶屋を見つけた。']}
];
function label(el){return(el?.innerText||el?.textContent||el?.getAttribute?.('aria-label')||'').trim()}
function isSale(t){return /販売|売る|売却|購入してもら|店に出す|売店/i.test(t)&&!/販売画面|販売候補|販売先/i.test(t)}
function spark(el){const r=el?.getBoundingClientRect?.();if(!r)return;for(let i=0;i<6;i++){const s=d.createElement('span');s.className='v34-spark';s.textContent=i%2?'✦':'✨';s.style.left=(r.left+r.width/2)+'px';s.style.top=(r.top+r.height/2)+'px';s.style.setProperty('--x',((Math.random()-.5)*110)+'px');s.style.setProperty('--y',(-30-Math.random()*70)+'px');d.body.appendChild(s);setTimeout(()=>s.remove(),900)}}
function cheer(target){sales++;try{localStorage.setItem('ff-v34-sales',String(sales))}catch(e){}const c=customers[(sales-1)%customers.length],v=c.voices[(sales-1)%c.voices.length];const old=d.querySelector('.v34-toast');if(old)old.remove();const box=d.createElement('div');box.className='v34-toast';const streak=sales>=5?`🔥 ${sales}件販売`:`${sales}件目`;const stars=sales%5===0?'★★★★★':'★★★★☆';box.innerHTML=`<div class="v34-top"><div class="v34-face">${c.face}</div><div class="v34-copy"><div class="v34-name">${c.name}</div><div class="v34-voice">「${v}」</div></div></div><div class="v34-meta"><span class="v34-chip good">✓ 購入満足</span><span class="v34-chip">${streak}</span><span class="v34-stars">${stars}</span></div>`;d.body.appendChild(box);requestAnimationFrame(()=>box.classList.add('show'));spark(target);setTimeout(()=>box.remove(),2700)}
let guard='';d.addEventListener('click',e=>{const b=e.target.closest('button,.btn,[role="button"],a');if(!b)return;const t=label(b);if(!isSale(t))return;const key=t+'|'+Math.floor(Date.now()/1000);if(key===guard)return;guard=key;setTimeout(()=>cheer(b),160)},true);
}catch(e){console.error('v34 install',e)}}
function boot(){install();setTimeout(install,450);setTimeout(install,1600)}shell.addEventListener('load',boot);boot();
</script></body></html>
