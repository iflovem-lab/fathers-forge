<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>父の窯と鉄の夢 v43</title><style>html,body{margin:0;height:100%;background:#08040b;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}.badge{position:fixed;left:max(8px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));z-index:99;background:#100b12e8;border:1px solid #d6a55f;border-radius:999px;padding:5px 9px;color:#fff1dc;font:900 11px system-ui;pointer-events:none;box-shadow:0 5px 18px #0009}</style></head><body><div class="badge">v43 • DAILY FORGE GOALS</div><iframe id="game" src="/v42.html?v=43" title="父の窯と鉄の夢 v43"></iframe><script>
const game=document.getElementById('game');
function deepest(win){try{let cur=win;for(let i=0;i<72;i++){const f=[...cur.document.querySelectorAll('iframe')].find(x=>x.contentWindow&&x.contentDocument);if(!f)break;cur=f.contentWindow}return cur}catch(e){return null}}
function install(){try{const w=deepest(game.contentWindow);if(!w||!w.document?.body||w.__v43installed)return;w.__v43installed=1;const d=w.document;d.title='父の窯と鉄の夢 v43';
const css=d.createElement('style');css.id='v43-goals-style';css.textContent=`
.v43-goals{position:fixed;left:max(10px,env(safe-area-inset-left));bottom:max(12px,calc(env(safe-area-inset-bottom) + 10px));z-index:2147483250;width:min(310px,calc(100vw - 20px));font-family:system-ui,-apple-system,sans-serif;color:#fff0db;background:linear-gradient(155deg,#21150ff2,#100b0df2);border:1px solid #75513b;border-radius:16px;box-shadow:0 12px 34px #0009,0 0 26px #d9913920;backdrop-filter:blur(10px);overflow:hidden;transition:opacity .2s,transform .2s}.v43-goals[data-mini="1"] .v43-body{display:none}.v43-head{display:flex;align-items:center;gap:8px;padding:9px 10px;border-bottom:1px solid #ffffff0d}.v43-title{font:900 10px/1.1 system-ui;letter-spacing:.08em;color:#e7bd93}.v43-sub{font:800 9px/1 system-ui;color:#9f8776}.v43-toggle{margin-left:auto;border:1px solid #5d4031;background:#1a1110;color:#dbc2aa;border-radius:999px;padding:4px 7px;font:900 9px/1 system-ui;cursor:pointer}.v43-body{padding:9px 10px 10px}.v43-row{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #ffffff0a}.v43-row:last-of-type{border-bottom:0}.v43-icon{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;background:#2c1c17;border:1px solid #5f4031}.v43-name{font:900 11px/1.15 system-ui}.v43-desc{margin-top:2px;font:700 9px/1.2 system-ui;color:#aa9383}.v43-check{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1px solid #654736;background:#17100f;color:#7f685b;font:900 12px system-ui}.v43-row.done .v43-check{background:#25341f;border-color:#728760;color:#dbefc9;box-shadow:0 0 16px #99c97522}.v43-row.done .v43-name{color:#ddecce}.v43-progress{height:5px;margin-top:9px;border-radius:99px;background:#120d0d;overflow:hidden;border:1px solid #392820}.v43-fill{height:100%;width:0;background:linear-gradient(90deg,#a96532,#e6b467);transition:width .35s ease}.v43-foot{display:flex;justify-content:space-between;align-items:center;margin-top:7px;font:800 9px/1.2 system-ui;color:#aa9383}.v43-complete{color:#e8c781}.v43-toast{position:fixed;left:50%;top:18%;z-index:2147483646;pointer-events:none;transform:translateX(-50%);padding:8px 12px;border-radius:999px;background:#19110ff2;border:1px solid #ad7545;color:#ffe3b8;font:900 11px/1 system-ui;box-shadow:0 10px 30px #0009;animation:v43toast 1.15s ease forwards}@keyframes v43toast{0%{opacity:0;transform:translate(-50%,8px) scale(.94)}18%,70%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-8px) scale(.98)}}@media(max-width:600px){.v43-goals{bottom:max(92px,calc(env(safe-area-inset-bottom) + 84px));width:min(290px,calc(100vw - 20px))}}@media(prefers-reduced-motion:reduce){.v43-goals,.v43-fill,.v43-toast{transition:none!important;animation:none!important}}
`;d.head.appendChild(css);
const key='ff-v43-goals';const today=()=>new Date().toISOString().slice(0,10);let state={day:today(),explore:0,craft:0,sell:0};try{const old=JSON.parse(localStorage.getItem(key)||'null');if(old&&old.day===today())state={...state,...old}}catch(e){}
const panel=d.createElement('section');panel.className='v43-goals';panel.setAttribute('aria-label','今日の工房依頼');panel.innerHTML=`<div class="v43-head"><div><div class="v43-title">TODAY'S FORGE</div><div class="v43-sub">今日の小さな依頼</div></div><button class="v43-toggle" type="button">しまう</button></div><div class="v43-body"><div class="v43-row" data-goal="explore"><div class="v43-icon">🧭</div><div><div class="v43-name">素材を探す</div><div class="v43-desc">探索を1回進める</div></div><div class="v43-check">•</div></div><div class="v43-row" data-goal="craft"><div class="v43-icon">🔨</div><div><div class="v43-name">鉄を打つ</div><div class="v43-desc">鍛冶を1回進める</div></div><div class="v43-check">•</div></div><div class="v43-row" data-goal="sell"><div class="v43-icon">🪙</div><div><div class="v43-name">客へ届ける</div><div class="v43-desc">販売を1回進める</div></div><div class="v43-check">•</div></div><div class="v43-progress"><div class="v43-fill"></div></div><div class="v43-foot"><span class="v43-count">0 / 3 達成</span><span class="v43-complete">一日の工房リズム</span></div></div>`;d.body.appendChild(panel);
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}}
function render(){const vals=['explore','craft','sell'];let n=0;vals.forEach(k=>{const row=panel.querySelector(`[data-goal="${k}"]`);const done=!!state[k];row.classList.toggle('done',done);row.querySelector('.v43-check').textContent=done?'✓':'•';if(done)n++});panel.querySelector('.v43-fill').style.width=(n/3*100)+'%';panel.querySelector('.v43-count').textContent=n+' / 3 達成';panel.querySelector('.v43-complete').textContent=n===3?'✓ 今日の依頼 完了':'一日の工房リズム'}
function toast(msg){const t=d.createElement('div');t.className='v43-toast';t.textContent=msg;d.body.appendChild(t);setTimeout(()=>t.remove(),1250)}
function classify(t){t=(t||'').replace(/\s+/g,'');if(/探索|冒険|採取|素材を探|出発/.test(t))return'explore';if(/鍛冶|鍛える|打つ|制作|製作|作る|クラフト/.test(t)&&!/売|販売/.test(t))return'craft';if(/販売|売る|売却|店に出す|購入してもら/.test(t))return'sell';return''}
function text(el){return(el?.innerText||el?.textContent||el?.getAttribute?.('aria-label')||'').trim()}
let last='';d.addEventListener('click',e=>{const b=e.target.closest('button,.btn,[role="button"],a');if(!b)return;if(b.closest('.v43-goals'))return;const k=classify(text(b));if(!k||state[k])return;const sig=k+'|'+Math.floor(Date.now()/700);if(sig===last)return;last=sig;state[k]=1;save();render();const names={explore:'探索の依頼を達成',craft:'鍛冶の依頼を達成',sell:'販売の依頼を達成'};toast('✓ '+names[k]);if(state.explore&&state.craft&&state.sell)setTimeout(()=>toast('✦ 今日の工房依頼 すべて達成'),500)},true);
panel.querySelector('.v43-toggle').addEventListener('click',()=>{const mini=panel.dataset.mini==='1';panel.dataset.mini=mini?'0':'1';panel.querySelector('.v43-toggle').textContent=mini?'しまう':'開く'});render();
}catch(e){console.error('v43 install',e)}}function boot(){install();setTimeout(install,500);setTimeout(install,1600)}game.addEventListener('load',boot);boot();
</script></body></html>
