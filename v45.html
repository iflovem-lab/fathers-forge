<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>父の窯と鉄の夢 v45</title><style>html,body{margin:0;height:100%;background:#08040b;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}.badge{position:fixed;left:max(8px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));z-index:99;background:#100b12e8;border:1px solid #d88e4c;border-radius:999px;padding:5px 9px;color:#fff1dc;font:900 11px system-ui;pointer-events:none;box-shadow:0 5px 18px #0009}</style></head><body><div class="badge">v45 • CRAFTING FEEDBACK</div><iframe id="game" src="/v44.html?v=45" title="父の窯と鉄の夢 v45"></iframe><script>
const game=document.getElementById('game');
function deepest(win){try{let cur=win;for(let i=0;i<90;i++){const f=[...cur.document.querySelectorAll('iframe')].find(x=>x.contentWindow&&x.contentDocument);if(!f)break;cur=f.contentWindow}return cur}catch(e){return null}}
function install(){try{const w=deepest(game.contentWindow);if(!w||!w.document?.body||w.__v45installed)return;w.__v45installed=1;const d=w.document;d.title='父の窯と鉄の夢 v45';
const css=d.createElement('style');css.textContent=`.v45-forge{position:fixed;left:50%;top:max(58px,calc(env(safe-area-inset-top) + 48px));transform:translateX(-50%);z-index:2147483250;width:min(330px,calc(100vw - 24px));pointer-events:none;font-family:system-ui,-apple-system,sans-serif}.v45-card{opacity:0;transform:translateY(-8px) scale(.98);transition:.18s ease;background:linear-gradient(160deg,#24150ef2,#100c0af2);border:1px solid #8d5d36;border-radius:16px;box-shadow:0 12px 34px #000a,0 0 28px #ff8c3218;color:#fff1df;padding:10px 12px;backdrop-filter:blur(8px)}.v45-card.on{opacity:1;transform:none}.v45-row{display:flex;align-items:center;gap:10px}.v45-hit{font:950 20px/1 system-ui;color:#ffd38d;text-shadow:0 0 18px #ff8c4966}.v45-grade{margin-left:auto;border:1px solid #9b7046;background:#2a1a10;border-radius:999px;padding:5px 8px;font:950 10px/1 system-ui;color:#ffe0a8}.v45-sub{margin-top:5px;font:800 9px/1.25 system-ui;color:#c7ad94}.v45-bar{height:5px;margin-top:8px;background:#251910;border-radius:999px;overflow:hidden}.v45-fill{height:100%;width:0;background:linear-gradient(90deg,#a35b30,#ffb65b);transition:width .16s ease}.v45-ring{position:fixed;z-index:2147483249;width:34px;height:34px;border:2px solid #ffb55e;border-radius:50%;pointer-events:none;animation:v45ring .45s ease-out forwards}.v45-spark{position:fixed;z-index:2147483251;width:5px;height:5px;border-radius:50%;background:#ffd28a;box-shadow:0 0 8px #ff8b38;pointer-events:none;animation:v45spark .55s ease-out forwards}@keyframes v45ring{to{transform:scale(2.6);opacity:0}}@keyframes v45spark{to{transform:translate(var(--x),var(--y)) scale(.4);opacity:0}}@media(prefers-reduced-motion:reduce){.v45-card{transition:none}.v45-ring,.v45-spark{display:none}.v45-fill{transition:none}}`;d.head.appendChild(css);
const box=d.createElement('div');box.className='v45-forge';box.innerHTML='<div class="v45-card"><div class="v45-row"><div class="v45-hit">CLANG!</div><div class="v45-grade">NICE</div></div><div class="v45-sub">打つほど鍛冶のリズムが乗っていく</div><div class="v45-bar"><div class="v45-fill"></div></div></div>';d.body.appendChild(box);const card=box.querySelector('.v45-card'),hit=box.querySelector('.v45-hit'),grade=box.querySelector('.v45-grade'),fill=box.querySelector('.v45-fill'),sub=box.querySelector('.v45-sub');let streak=0,last=0,hide=0;const texts=['CLANG!','KLANG!','SHING!','BAM!'];
function forgeButton(el){const t=(el.innerText||el.textContent||el.getAttribute?.('aria-label')||'').replace(/\s+/g,' ').trim();return /(鍛える|鍛冶|打つ|ハンマー|叩く|制作|製作|作る|クラフト)/.test(t)&&!/(販売|売る|売却)/.test(t)}
function fx(x,y){const r=d.createElement('i');r.className='v45-ring';r.style.left=(x-17)+'px';r.style.top=(y-17)+'px';d.body.appendChild(r);setTimeout(()=>r.remove(),500);for(let i=0;i<7;i++){const s=d.createElement('i');s.className='v45-spark';s.style.left=x+'px';s.style.top=y+'px';s.style.setProperty('--x',((Math.random()-.5)*90)+'px');s.style.setProperty('--y',((-25-Math.random()*60))+'px');d.body.appendChild(s);setTimeout(()=>s.remove(),650)}}
function pulse(el,e){const now=Date.now();streak=now-last<1600?Math.min(streak+1,12):1;last=now;const lvl=streak>=9?['MASTER','火花が完全に噛み合った']:streak>=6?['GREAT','いいリズム。このまま仕上げる']:streak>=3?['GOOD','鍛冶のテンポが乗ってきた']:['NICE','一打一打、形になっていく'];grade.textContent=lvl[0];sub.textContent=lvl[1];hit.textContent=texts[(streak-1)%texts.length];fill.style.width=Math.min(100,streak*9)+'%';card.classList.add('on');clearTimeout(hide);hide=setTimeout(()=>card.classList.remove('on'),1350);let x=e?.clientX,y=e?.clientY;if(!(x>=0&&y>=0)){const r=el.getBoundingClientRect();x=r.left+r.width/2;y=r.top+r.height/2}fx(x,y)}
d.addEventListener('click',e=>{const el=e.target?.closest?.('button,.btn,[role="button"],a');if(el&&forgeButton(el))pulse(el,e)},true);
}catch(e){console.error('v45 install',e)}}function boot(){install();setTimeout(install,500);setTimeout(install,1600)}game.addEventListener('load',boot);boot();
</script></body></html>
