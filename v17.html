<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>父の窯と鉄の夢 v17</title><style>html,body{margin:0;height:100%;background:#0d0710;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}.v17badge{position:fixed;left:8px;top:8px;z-index:99;background:#160d1eee;border:2px solid #8ff0b2;border-radius:999px;padding:5px 9px;color:#d9ffe6;font:900 11px system-ui;pointer-events:none}</style></head><body><div class="v17badge">v17 • INVENTORY CLARITY</div><iframe id="shell" src="/v16.html?v=17" title="父の窯と鉄の夢 v17"></iframe><script>
const shell=document.getElementById('shell');
function deepestFrame(win){try{let cur=win;for(let i=0;i<5;i++){const fs=[...cur.document.querySelectorAll('iframe')];if(!fs.length)break;const next=fs.find(x=>x.contentWindow&&x.contentDocument);if(!next)break;cur=next.contentWindow}return cur}catch(e){return null}}
function install(){try{const w=deepestFrame(shell.contentWindow);if(!w||!w.document||!w.document.body)return;const d=w.document;if(w.__v17installed)return;w.__v17installed=1;d.title='父の窯と鉄の夢 v17';
const s=d.createElement('style');s.textContent=`
.v17stock{margin:10px 0 12px;background:linear-gradient(135deg,#14241d,#1d1627);border:3px solid #78dca0;border-radius:20px;padding:12px;box-shadow:0 8px #09050d}.v17stockHead{display:flex;align-items:center;justify-content:space-between;gap:10px}.v17stockHead h3{margin:0;color:#caffda}.v17stockHead small{color:#c8b7cf}.v17stockGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}.v17metric{background:#100b15;border:2px solid #405749;border-radius:13px;padding:8px;text-align:center}.v17metric small{display:block;color:#b9a9c1;font-size:10px}.v17metric b{display:block;color:#dfffea;font-size:18px;margin-top:2px}.v17legend{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.v17tag{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:3px 7px;font-size:10px;font-weight:900;background:#1d1324;border:1px solid #70567c;color:#eadff0}.v17tag.hot{background:#53351b;border-color:#ffc16a;color:#fff1cd}.v17tag.safe{background:#153f2c;border-color:#8ff0b2;color:#dfffea}.v17tag.rare{background:#382052;border-color:#c69cff;color:#f0ddff}.v17enhanced{position:relative;padding-top:32px!important}.v17chips{position:absolute;left:8px;right:8px;top:6px;display:flex;gap:5px;flex-wrap:wrap}.v17value{background:#25192e;border:1px solid #735987;color:#ffe7a7;border-radius:99px;padding:2px 6px;font-size:10px;font-weight:900}.v17recommend{background:#16402d;border:1px solid #8ff0b2;color:#dffff0;border-radius:99px;padding:2px 6px;font-size:10px;font-weight:900}.v17rare{background:#3c2256;border:1px solid #c89aff;color:#f1e3ff;border-radius:99px;padding:2px 6px;font-size:10px;font-weight:900}.v17sellnow{outline:3px solid #ffd98a;outline-offset:1px;box-shadow:0 0 24px #ffd98a44!important}.v17emptyState{margin-top:8px;padding:9px;border-radius:13px;background:#15101b;border:1px dashed #6a5673;color:#cdbfd2;font-size:12px;line-height:1.5}@media(max-width:620px){.v17stockGrid{grid-template-columns:1fr 1fr}.v17metric:last-child{grid-column:1/-1}}
`;d.head.appendChild(s);
function salesScreen(){return [...d.querySelectorAll('.screen')].find(x=>/market|shop|sell/i.test(x.id))||[...d.querySelectorAll('.screen')].find(x=>/販売|市場|店/.test(x.innerText||''))}
function rows(sc){return [...sc.querySelectorAll('.sellrow,.item')].filter(x=>/売|販売|G|円|個|在庫|武器|剣|斧|槍/i.test(x.innerText||''))}
function scoreText(t){let n=1;if(/S\b|最高|希少|レア|名品/.test(t))n=3;else if(/A\b|高品質|上質/.test(t))n=2;return n}
function ensure(){const sc=salesScreen();if(!sc)return;let box=sc.querySelector('.v17stock');if(!box){box=d.createElement('div');box.className='v17stock';box.innerHTML='<div class="v17stockHead"><div><h3>📦 完成品ストック</h3><small>何を売るか、ひと目で判断</small></div><span>SHOP STOCK</span></div><div class="v17stockGrid"><div class="v17metric"><small>販売候補</small><b data-k="count">0</b></div><div class="v17metric"><small>おすすめ</small><b data-k="best">—</b></div><div class="v17metric"><small>売り時</small><b data-k="timing">待機</b></div></div><div class="v17legend"><span class="v17tag safe">● 普段売り</span><span class="v17tag hot">★ おすすめ</span><span class="v17tag rare">◆ 高品質</span></div><div class="v17emptyState">完成品が増えると、商品カードに価値・おすすめ・品質タグが付きます。</div>';const title=sc.querySelector('.title');if(title&&title.nextSibling)sc.insertBefore(box,title.nextSibling);else sc.prepend(box)}const rs=rows(sc);box.querySelector('[data-k="count"]').textContent=rs.length;box.querySelector('[data-k="timing"]').textContent=rs.length?'販売OK':'制作優先';let best='—',bestScore=-1;rs.forEach((r,i)=>{if(r.dataset.v17==='1')return;r.dataset.v17='1';r.classList.add('v17enhanced');const t=r.innerText||'';const quality=scoreText(t),chips=d.createElement('div');chips.className='v17chips';const price=(t.match(/(?:¥|￥)?\s?[0-9,]{2,}\s*(?:G|円)?/)||[])[0]||'価値確認';chips.innerHTML='<span class="v17value">💰 '+price.trim()+'</span><span class="v17recommend">★ '+(i===0?'今売る':'候補')+'</span>'+(quality>=2?'<span class="v17rare">◆ 高品質</span>':'');r.prepend(chips);if(i===0)r.classList.add('v17sellnow');if(quality>bestScore){bestScore=quality;best=(t.split('\n')[0]||'完成品').slice(0,12)}});box.querySelector('[data-k="best"]').textContent=best;box.querySelector('.v17emptyState').style.display=rs.length?'none':'block'}
const mo=new MutationObserver(()=>{clearTimeout(w.__v17timer);w.__v17timer=setTimeout(ensure,80)});mo.observe(d.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['class']});d.addEventListener('click',()=>setTimeout(ensure,100),true);ensure();
}catch(e){console.error('v17 install',e)}}
function boot(){install();setTimeout(install,250);setTimeout(install,800)}shell.addEventListener('load',boot);boot();
</script></body></html>
