<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>父の窯と鉄の夢 v26</title><style>html,body{margin:0;height:100%;background:#08040b;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}.badge{position:fixed;left:8px;top:8px;z-index:99;background:#100a16e8;border:2px solid #e8c77a;border-radius:999px;padding:5px 9px;color:#fff0bd;font:900 11px system-ui;pointer-events:none}</style></head><body><div class="badge">v26 • STAGE ROAD</div><iframe id="shell" src="/v25.html?v=26" title="父の窯と鉄の夢 v26"></iframe><script>
const shell=document.getElementById('shell');
function deepest(win){try{let cur=win;for(let i=0;i<32;i++){const f=[...cur.document.querySelectorAll('iframe')].find(x=>x.contentWindow&&x.contentDocument);if(!f)break;cur=f.contentWindow}return cur}catch(e){return null}}
function install(){try{const w=deepest(shell.contentWindow);if(!w||!w.document?.body||w.__v26installed)return;w.__v26installed=1;const d=w.document;d.title='父の窯と鉄の夢 v26';
const s=d.createElement('style');s.textContent=`
.v26road{margin:10px 0 12px;padding:13px;border-radius:21px;background:linear-gradient(145deg,#21152b,#100a16);border:2px solid #80628e;box-shadow:0 9px 26px #0008;color:#f8ecdc}.v26top{display:flex;align-items:center;justify-content:space-between;gap:10px}.v26top h3{margin:0;color:#ffe3a3;font-size:15px}.v26chapter{font-size:11px;font-weight:1000;color:#2b1600;background:#ffe0a0;border-radius:999px;padding:4px 8px}.v26path{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:11px 0 8px}.v26node{position:relative;min-width:0;text-align:center;padding:9px 4px 8px;border-radius:14px;background:#100a15;border:1px solid #4e3b59;color:#91849a;font-size:10px}.v26node b{display:block;font-size:18px;margin-bottom:2px}.v26node.on{color:#fff0c8;border-color:#f0c86e;box-shadow:0 0 20px #ffd98a30;background:linear-gradient(#2e2138,#17101e)}.v26node.done{color:#d5c7d8;border-color:#7c6687}.v26node.on:after{content:'NOW';position:absolute;right:4px;top:4px;font-size:7px;background:#ffd98a;color:#271300;border-radius:999px;padding:2px 4px;font-weight:1000}.v26bar{height:9px;background:#0a0610;border-radius:999px;overflow:hidden;border:1px solid #4c3954}.v26bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#b77cff,#ffd678);transition:.35s}.v26copy{margin-top:8px;font-size:12px;line-height:1.45;color:#dfcfdf}.v26copy strong{color:#fff1ad}.v26reward{margin-top:8px;padding:8px 9px;border-radius:12px;background:#171020;border:1px solid #5d4768;font-size:11px;color:#cab9cf}.v26unlock{position:fixed;inset:0;z-index:12500;background:#08040ddd;display:grid;place-items:center;padding:20px;opacity:0;pointer-events:none;transition:.22s}.v26unlock.on{opacity:1;pointer-events:auto}.v26card{width:min(390px,90vw);padding:22px;border-radius:26px;text-align:center;background:linear-gradient(150deg,#3b2850,#160d20);border:4px solid #ffe09a;color:#fff3dd;box-shadow:0 22px 70px #000c,0 0 35px #ffd98a44;transform:scale(.86);transition:.26s}.v26unlock.on .v26card{transform:scale(1)}.v26card .icon{font-size:54px}.v26card h2{margin:5px 0;color:#fff0a8}.v26card p{line-height:1.55;color:#dfcfe0}.v26card button{width:100%;font-weight:1000;font-size:16px;background:linear-gradient(#ffe6aa,#d99b36);color:#2b1600}.v26pulse{animation:v26pulse .8s ease-out}@keyframes v26pulse{0%{box-shadow:0 0 0 #ffd98a00}40%{box-shadow:0 0 35px #ffd98aaa}100%{box-shadow:0 0 0 #ffd98a00}}@media(prefers-reduced-motion:reduce){.v26bar i,.v26unlock,.v26card,.v26pulse{transition:none!important;animation:none!important}}
`;d.head.appendChild(s);
const stages=[{icon:'🔨',name:'火を起こす',need:0,goal:'まずは工房を動かし、一本を作って売ろう。',reward:'工房の基本サイクルを覚える'},{icon:'🏪',name:'町の評判',need:5,goal:'制作・販売・探索を重ねて、町に名前を広げよう。',reward:'常連客が増えて店らしくなる'},{icon:'🛡️',name:'騎士団の噂',need:12,goal:'安定して仕事をこなし、王国騎士に認められよう。',reward:'上客からの依頼が似合う工房へ'},{icon:'👑',name:'王国御用達',need:22,goal:'家族と工房を両立し、伝説へ続く土台を作ろう。',reward:'次章「父の名を継ぐ」へ'}];
let state;try{state=JSON.parse(localStorage.getItem('ff_v26_stage')||'null')}catch(e){}if(!state)state={score:0,stage:0,seen:0,actions:{forge:0,sell:0,explore:0,life:0}};function save(){try{localStorage.setItem('ff_v26_stage',JSON.stringify(state))}catch(e){}}
const modal=d.createElement('div');modal.className='v26unlock';modal.innerHTML='<div class="v26card"><div class="icon">🏆</div><h2>STAGE UP!</h2><p></p><button type="button">次の目標を見る</button></div>';d.body.appendChild(modal);modal.querySelector('button').onclick=()=>modal.classList.remove('on');
function current(){let ix=0;stages.forEach((s,i)=>{if(state.score>=s.need)ix=i});return ix}function progress(ix){const a=stages[ix],b=stages[ix+1];if(!b)return 100;return Math.max(0,Math.min(100,((state.score-a.need)/(b.need-a.need))*100))}
function home(){return [...d.querySelectorAll('.screen')].find(x=>/home|main/.test(x.id)&&x.offsetParent!==null)||d.querySelector('.screen.on')||d.querySelector('.wrap')||d.body}
function render(){const sc=home();if(!sc)return;let box=d.querySelector('.v26road');if(!box){box=d.createElement('section');box.className='v26road';box.innerHTML='<div class="v26top"><h3>🗺️ 工房の物語</h3><span class="v26chapter"></span></div><div class="v26path"></div><div class="v26bar"><i></i></div><div class="v26copy"></div><div class="v26reward"></div>';const goal=sc.querySelector?.('.goal');if(goal&&goal.nextSibling)sc.insertBefore(box,goal.nextSibling);else sc.prepend?.(box)}const ix=current(),st=stages[ix];state.stage=ix;box.querySelector('.v26chapter').textContent='CHAPTER '+(ix+1)+'/4';box.querySelector('.v26path').innerHTML=stages.map((x,i)=>`<div class="v26node ${i<ix?'done':i===ix?'on':''}"><b>${x.icon}</b>${x.name}</div>`).join('');box.querySelector('.v26bar i').style.width=progress(ix)+'%';const next=stages[ix+1];box.querySelector('.v26copy').innerHTML='<strong>'+st.name+'</strong> — '+st.goal+(next?`<br><small>次まであと ${Math.max(0,next.need-state.score)} pt</small>`:'<br><small>現在の物語目標を達成！</small>');box.querySelector('.v26reward').textContent='🎁 '+st.reward}
function add(type,pts){state.actions[type]=(state.actions[type]||0)+1;state.score+=pts;const before=state.stage,after=current();save();render();if(after>before&&after>state.seen){state.seen=after;save();const st=stages[after];modal.querySelector('.icon').textContent=st.icon;modal.querySelector('h2').textContent=st.name+' 解放！';modal.querySelector('p').textContent=st.goal;modal.classList.add('on');const box=d.querySelector('.v26road');if(box){box.classList.remove('v26pulse');void box.offsetWidth;box.classList.add('v26pulse')}}}
d.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const t=b.textContent.trim();if(/ここだ/.test(t))return;if(/販売|売る|接客/.test(t))add('sell',2);else if(/探索|出発|回収/.test(t))add('explore',1);else if(/食事|薬|看病|睡眠/.test(t))add('life',1);else if(/制作|開始/.test(t))add('forge',2);setTimeout(render,100)},true);const mo=new MutationObserver(()=>render());mo.observe(d.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class','style']});render();
}catch(e){console.error('v26 install',e)}}function boot(){install();setTimeout(install,350);setTimeout(install,1300)}shell.addEventListener('load',boot);boot();
</script></body></html>
