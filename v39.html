<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>父の窯と鉄の夢 v39</title><style>html,body{margin:0;height:100%;background:#08040b;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}.badge{position:fixed;left:max(8px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));z-index:99;background:#11100ee8;border:2px solid #e7bd77;border-radius:999px;padding:5px 9px;color:#fff4df;font:900 11px system-ui;pointer-events:none;box-shadow:0 5px 16px #0008}</style></head><body><div class="badge">v39 • NEXT ACTION</div><iframe id="shell" src="/v38.html?v=39" title="父の窯と鉄の夢 v39"></iframe><script>

border-radius:999px}.v39-guide.compact .v39-kicker{display:none}.v39-guide.compact .v39-title{font-size:10px}.v39-ping{outline:2px solid #e7ad58!important;outline-offset:3px!important;animation:v39ping 1.4s ease 2}.v39-toast{position:fixed;z-index:999999;left:50%;bottom:16%;transform:translateX(-50%);padding:9px 13px;border:1px solid #d79b4d;border-radius:12px;background:#21170ff5;color:#fff0d4;box-shadow:0 12px 34px #000b;font:900 10px system-ui;pointer-events:none;animation:v39toast 1.6s ease forwards}@keyframes v39ping{0%,100%{box-shadow:0 0 0 0 #d99a4300}50%{box-shadow:0 0 0 7px #d99a4333}}@keyframes v39toast{0%{opacity:0;transform:translate(-50%,6px)}15%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-6px)}}@media(max-width:620px){.v39-guide{right:8px;bottom:max(8px,calc(env(safe-area-inset-bottom) + 6px));width:min(280px,calc(100vw - 16px))}.v39-body{padding:8px}.v39-desc{font-size:8px}.v39-chip{font-size:6px}.v39-cta{min-height:36px!important}}@media(prefers-reduced-motion:reduce){.v39-ping,.v39-toast{animation:none}}`;d.head.appendChild(css);
let s={explore:0,craft:0,sell:0,life:0};try{s=Object.assign(s,JSON.parse(localStorage.getItem('ff-v39-flow')||'{}'))}catch(e){}

function save(){try{localStorage.setItem('ff-v39-flow',JSON.stringify(s))}catch(e){}}function next(){if(s.explore<=s.craft)return'explore';if(s.craft<=s.sell)return'craft';if(s.sell===0||s.sell<s.craft)return'sell';return'life'}function copy(k){return k==='explore'?['素材を集めよう','まず探索で素材を確保。次の鍛冶が止まりにくくなります。','⛏️']:k==='craft'?['一品、鉄を打とう','素材があるなら鍛冶へ。完成品を作ると販売につながります。','🔨']:k==='sell'?['店に並べてみよう','完成品があるなら販売へ。工房の成長を進めるターンです。','🪙']:['家の様子を見よう','一区切りついたら暮らしへ。母との時間も忘れずに。','🌷']}function txt(el){return(el?.innerText||el?.textContent||el?.getAttribute?.('aria-label')||'').trim()}function kind(t){if(/販売|売る|売却|会計|購入/i.test(t))return'sell';if(/鍛冶|鍛える|打つ|叩|ハンマー|製作|制作|作る|仕上/i.test(t))return'craft';if(/探索|冒険|採取|素材.*集|出発/i.test(t))return'explore';if(/母|看病|薬|食事|休む|暮らし|生活|会話/i.test(t))return'life';return''}function render(){const k=next(),c=copy(k);guide.querySelector('.v39-title').textContent=c[0];guide.querySelector('.v39-desc').textContent=c[1];guide.querySelector('.v39-icon').textContent=c[2];guide.querySelectorAll('.v39-chip').forEach(x=>x.classList.toggle('on',x.dataset.k===k));save()}function findTarget(k){const all=[...d.querySelectorAll('button,.btn,[role=button],a')].filter(x=>!guide.contains(x));return all.find(x=>kind(txt(x))===k)}function toast(t){const e=d.createElement('div');e.className='v39-toast';e.textContent=t;d.body.appendChild(e);setTimeout(()=>e.remove(),1700)}
guide.querySelector('.v39-hide').addEventListener('click',()=>{guide.classList.toggle('compact');guide.querySelector('.v39-hide').textContent=guide.classList.contains('compact')?'案内':'しまう'});guide.querySelector('.v39-cta').addEventListener('click',()=>{const k=next(),el=findTarget(k);if(!el){toast('おすすめ操作が見つかりませんでした');return}try{el.scrollIntoView({behavior:'smooth',block:'center'})}catch(e){}el.classList.add('v39-ping');setTimeout(()=>el.classList.remove('v39-ping'),3000);toast('光っている操作が次のおすすめです')});let lock='';d.addEventListener('click',e=>{const b=e.target.closest('button,.btn,[role=button],a');if(!b||guide.contains(b))return;const k=kind(txt(b));if(!k)return;const key=k+'|'+Math.floor(Date.now()/700);if(key===lock)return;lock=key;s[k]=(s[k]||0)+1;render()},true);render();
}catch(e){console.error('v39 install',e)}}function boot(){install();setTimeout(install,500);setTimeout(install,1800)}shell.addEventListener('load',boot);boot();
