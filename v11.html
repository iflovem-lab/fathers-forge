template-columns:repeat(4,1fr);gap:7px}.stripCard{min-height:138px;background:#25172f;border:3px solid #6d4c77;border-radius:14px;padding:9px;font-size:12px}.stripCard b{color:var(--gold)}.resultCard{background:linear-gradient(135deg,#392244,#1a111f);border:3px solid #e7d69a;border-radius:20px;padding:14px;margin:10px 0;box-shadow:0 7px #060308}.resultCard h3{font-size:26px;margin:0 0 6px;color:#fff1a7}.resultCard .weapon{font-size:52px;filter:drop-shadow(0 4px #000)}.customer{display:grid;grid-template-columns:58px 1fr;gap:10px;align-items:start;background:#120c17;border:2px solid #735384;border-radius:16px;padding:10px}.avatar{width:58px;height:58px;border-radius:18px;background:linear-gradient(#ffd0a3,#e6a779);display:flex;align-items:center;justify-content:center;font-size:30px;border:3px solid #e7d69a}.bubble{background:#fff3dc;color:#2b1600;border-radius:16px;padding:10px;position:relative;font-weight:800}.bubble:before{content:'';position:absolute;left:-8px;top:18px;border-right:10px solid #fff3dc;border-top:8px solid transparent;border-bottom:8px solid transparent}.log{min-height:170px;max-height:300px;overflow:auto;font-size:13px}.sellrow{display:grid;grid-template-columns:1fr auto auto auto;gap:6px;align-items:center}.dialog{position:fixed;inset:0;z-index:30;background:#000b;display:flex;align-items:flex-end;justify-content:center;padding:16px}.dialog.hidden{display:none}.dialogBox{width:min(720px,100%);background:#103b2c;border:4px solid #d6c895;border-radius:18px;box-shadow:0 8px #06090a;color:#fff8d8;padding:14px}.dialogBox h3{margin:0 0 8px;color:#fff1a7}.dialogBox p{line-height:1.7}.ad{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(90deg,#130d19,#36263f,#130d19);border-top:3px solid #6e527a;text-align:center;color:#ffe2a7;padding:8px;font-weight:900;z-index:5}.ad small{display:block;color:var(--muted);font-size:11px}@media(max-width:780px){.grid,.forgeGrid{grid-template-columns:1fr}.hud{grid-template-columns:repeat(2,1fr)}.tabs{grid-template-columns:repeat(3,1fr)}.statgrid,.matgrid,.market{grid-template-columns:1fr}.scene{height:250px}.hero{left:160px;transform:scale(.84);transform-origin:top left}.cinema{min-height:320px}.cutHero{transform:scale(.76);transform-origin:left bottom}.cutText{left:150px;top:88px}.strip{grid-template-columns:repeat(2,1fr)}.hitBtn{font-size:25px}.sellrow{grid-template-columns:1fr 1fr 1fr}.sellrow span{grid-column:1/-1}}</style>

<body>
<div class="wrap"><div class="top"><div><p class="ey">v11 / 35点を狙う改善版</p><h1>父の窯と鉄の夢</h1><p class="sub">鍛冶屋経営 × 生活管理 × ミッション × 客の反応</p></div><div class="scoreBadge">評価目標<br>20 → 35点</div></div><div class="goal"><b id="goalText"></b><div class="bar"><div id="goalbar"></div></div><p class="small" id="goalSub"></p></div><div class="hud" id="hud"></div><div class="tabs" id="tabs"></div><main class="panel" id="main"></main></div><div class="ad">AdMob 仮広告枠<small>本番ではバナー/リワード/インタースティシャルに分離</small></div><div id="dialog" class="dialog hidden"><div class="dialogBox"><h3 id="dlgTitle"></h3><p id="dlgText"></p><button class="gold" onclick="closeDlg()">OK</button></div></div>
<script>
const $=id=>document.getElementById(id);const saveKey='ff_v11';const stages={1:{name:'工房を守る',due:1200,sub:'初回返済。まずは短剣を作って売る。'},2:{name:'ギルド登録',due:3500,sub:'王都ギルドへ登録し、上級客を呼び込む。'},3:{name:'工房拡張',due:8000,sub:'窯を増やし、量産の土台を作る。'},4:{name:'王都進出',due:20000,sub:'貴族街の注文と高級素材に挑む。'},5:{name:'名工への道',due:50000,sub:'騎士団契約とブランド化を目指す。'}};
const recipes=[{id:'dagger',n:'鉄の短剣',icon:'🗡️',base:150,need:{ore:2,coal:1},lv:1,stat:'速さ'},{id:'spear',n:'角槍',icon:'🔱',base:260,need:{ore:3,coal:2,horn:1},lv:1,stat:'力'},{id:'staff',n:'見習いの杖',icon:'🪄',base:360,need:{wood:3,gem:1},lv:2,stat:'賢さ'},{id:'silver',n:'銀細工の短剣',icon:'💎',base:620,need:{ore:3,coal:2,gem:2},lv:3,stat:'運'}];
const areas=[{n:'古い採掘跡',m:{ore:[4,8],coal:[2,5],gem:[0,1]}},{n:'森の小道',m:{wood:[5,10],herb:[2,5],horn:[0,2]}},{n:'青火の洞窟',m:{ore:[5,10],coal:[4,8],gem:[1,3]}}];
let s,craft=null,timer=null;function init(){s=JSON.parse(localStorage.getItem(saveKey)||'null')||{stage:1,day:1,phase:'朝',gold:300,paid:0,rep:0,lv:1,xp:0,hp:88,hunger:76,sleep:82,mood:78,momHp:62,momFood:55,momMood:58,mats:{ore:6,coal:4,wood:3,herb:3,horn:0,gem:0},inv:[],tools:{hammer:0,cloth:0,kiln:0},book:[],lastSale:'まだ販売していません。',log:['父の古い窯に火を入れた。'],missions:{craft:0,explore:0,sell:0,care:0}};render()}function save(){localStorage.setItem(saveKey,JSON.stringify(s))}function ffReset(){localStorage.removeItem(saveKey);init();toast('初期化','v11で最初から始めます。')}window.ffReset=ffReset;
function render(){save();renderTop();renderTabs();showTab(current||'home',true)}let current='home';function renderTop(){let st=stages[s.stage];$('goalText').textContent=`Stage ${s.stage}：${st.name} / 目標 ${st.due.toLocaleString()}G`; $('goalSub').textContent=st.sub; $('goalbar').style.width=Math.min(100,s.paid/st.due*100)+'%'; $('hud').innerHTML=[['日数',s.day],['所持金',s.gold+'G'],['返済',s.paid+'G'],['評判',s.rep],['Lv',s.lv],['体力',s.hp],['空腹',s.hunger],['母体調',s.momHp]].map(x=>`<div class=stat><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}function renderTabs(){const tabs=[['home','🏠 ホーム'],['forge','🔥 鍛冶'],['shop','🛒 販売'],['life','🍲 生活'],['explore','🗺 探索'],['tools','🧰 道具'],['book','📖 図鑑'],['progress','🏰 進行']];$('tabs').innerHTML=tabs.map(t=>`<button class="tab ${current==t[0]?'on':''}" onclick="showTab('${t[0]}')">${t[1]}</button>`).join('')}function showTab(tab,skip=false){current=tab;renderTabs();const m=$('main');if(tab==='home')m.innerHTML=home();if(tab==='forge')m.innerHTML=forge();if(tab==='shop')m.innerHTML=shop();if(tab==='life')m.innerHTML=life();if(tab==='explore')m.innerHTML=explore();if(tab==='tools')m.innerHTML=tools();if(tab==='book')m.innerHTML=book();if(tab==='progress')m.innerHTML=progress();if(!skip)save()}
function home(){return `<section class=screen on><div class=title><h2>今日の工房</h2><p>次に何をするかが分かるホームに改善。ミッションを進めると報酬が入ります。</p></div><div class=scene><div class=wall></div><div class=floor></div><div class=kiln></div><div class=anvil></div><div class=shelf></div><div class=hero><div class=hair></div><div class=ribbon></div><div class=face></div><div class="eye l"></div><div class="eye r"></div><div class="cheek l"></div><div class="cheek r"></div><div class=mouth></div><div class=body></div><div class=apron></div><div class=hammer></div></div></div><div class=grid><div class=card><h3>今日やること</h3><div class=mission>${missionHtml()}</div></div><div class=card><h3>ログ</h3><div class=log>${s.log.slice(-12).reverse().map(x=>'・'+x).join('<br>')}</div></div></div></section>`}function missionHtml(){let ms=[];if(!s.missions.explore)ms.push(['素材探索を1回する','探索へ','explore']);if(!s.missions.craft)ms.push(['武器を1本完成させる','鍛冶へ','forge']);if(!s.missions.sell)ms.push(['完成品を1つ売る','販売へ','shop']);if(s.momHp<80&&!s.missions.care)ms.push(['母の世話をする','生活へ','life']);if(!ms.length)ms.push(['今日の基本ミッション達成。時間を進めよう','進行へ','progress']);return ms.map(a=>`<div><b>${a[0]}</b><br><button class=blue onclick="showTab('${a[2]}')">${a[1]}</button></div>`).join('')}
function forge(){let opts=recipes.filter(r=>r.lv<=s.stage+1).map(r=>`<option value="${r.id}">${r.icon} ${r.n}</option>`).join('');return `<section class=screen on><div class=title><h2>武器制作</h2><p>4工程の後に必ず完成/失敗画面を出す。できた武器は在庫に入ったことを明示します。</p></div><div class=card><select id=recipe>${opts}</select><p class=small id=recipeInfo></p><button class=ok onclick=startCraft()>手動制作を始める</button> <button class=blue onclick=skipCraft()>通常スキップ制作</button></div><div class=forgeGrid><div class=card><h3>漫画カットイン</h3><div id=cinema class=cinema data-step=待機 data-rank=""><div class=cutHero><div class=hair></div><div class=head></div><div class="eye l"></div><div class="eye r"></div><div class=body></div><div class=apron></div><div class=tool>🔨</div></div><div class=cutText id=cutText>準備完了。<small>制作開始後、工程ごとに判定が出ます。</small></div></div><div id=craftBox class=hidden><div class=gauge><div id=zone class=zone></div><div id=pointer class=pointer></div></div><button class=hitBtn onclick=hitCraft()>ここだ！</button><p id=craftHint class=small></p></div></div><div><div class=card><h3>今回の制作4コマ</h3><div id=strip class=strip>${['火入れ','叩き','水入れ','研ぎ'].map(x=>`<div class=stripCard><b>${x}</b><br>未実行</div>`).join('')}</div></div><div id=result></div></div></div><div class=card><h3>素材</h3><div class=matgrid>${matsHtml()}</div></div></section>`}function recipeObj(){return recipes.find(r=>r.id===($('recipe')?.value||'dagger'))||recipes[0]}document.addEventListener('change',e=>{if(e.target.id==='recipe')updateRecipeInfo()});function updateRecipeInfo(){let r=recipeObj();let need=Object.entries(r.need).map(([k,v])=>`${matName(k)}${v}`).join('、');let el=$('recipeInfo');if(el)el.textContent=`必要素材：${need} / 得意能力：${r.stat} / 基礎価格：${r.base}G`}
function startCraft(){let r=recipeObj();updateRecipeInfo();for(let k in r.need){if((s.mats[k]||0)<r.need[k])return toast('素材不足',`${r.n}の素材が足りません。探索で集めてください。`)}if(s.hp<12||s.hunger<8)return toast('体調不足','体力か空腹が不足しています。生活タブで食事や睡眠をしてください。');for(let k in r.need)s.mats[k]-=r.need[k];craft={r,step:0,pos:0,dir:1,hits:[],names:['火入れ','叩き','水入れ','研ぎ']};$('craftBox').classList.remove('hidden');$('result').innerHTML='';setCinema('待機','',`火を入れる準備。<small>「ここだ！」を押して制作開始。</small>`);moveGauge();save()}function moveGauge(){clearInterval(timer);timer=setInterval(()=>{if(!craft)return;craft.pos+=craft.dir*(5+s.stage+s.tools.hammer);if(craft.pos>98||craft.pos<2)craft.dir*=-1;let p=$('pointer');if(p)p.style.left=craft.pos+'%'},35)}function hitCraft(){if(!craft)return;let pos=craft.pos;let center=50;let d=Math.abs(pos-center);let rank=d<5&&s.lv>=5?'MARVELOUS':d<9&&s.lv>=3?'PERFECT':d<17?'GOOD':d<29?'OK':'MISS';let msg={MISS:'素材を落とした',OK:'無難に進行',GOOD:'いい手応え',PERFECT:'職人の集中',MARVELOUS:'覚醒の一打'}[rank];let step=craft.names[craft.step];craft.hits.push({step,rank,msg});setCinema(step,rank,cutLine(rank,msg));renderStrip();craft.step++;if(craft.step>=4){finishCraft()}else{let hint=$('craftHint');if(hint)hint.textContent=`次：${craft.names[craft.step]}。タイミングを見て押してください。`}}function cutLine(rank,msg){if(rank==='MISS')return `あっ…！<small>${msg}。立て直せるか…？</small>`;if(rank==='OK')return `よし、進める。<small>${msg}。</small>`;if(rank==='GOOD')return `流れが見えた！<small>${msg}。</small>`;if(rank==='PERFECT')return `ここだ…！<small>${msg}。</small>`;return `今なら打てる！<small>${msg}。空気が変わった。</small>`}function setCinema(step,rank,txt){let c=$('cinema');if(!c)return;c.dataset.step=step;c.dataset.rank=rank||'';$('cutText').innerHTML=txt;c.classList.remove('flash');void c.offsetWidth;c.classList.add('flash')}function renderStrip(){let h=craft?.hits||[];$('strip').innerHTML=['火入れ','叩き','水入れ','研ぎ'].map((name,i)=>{let x=h[i];return `<div class=stripCard><b>${name}</b><br>${x?`${x.rank}<br>${x.msg}`:'未実行'}</div>`}).join('')}
function finishCraft(){clearInterval(timer);let h=craft.hits;let score=h.reduce((a,x)=>a+({MISS:0,OK:1,GOOD:2,PERFECT:3,MARVELOUS:4}[x.rank]),0);let miss=h.filter(x=>x.rank==='MISS').length;let r=craft.r;craft=null;$('craftBox').classList.add('hidden');let ok=miss<2&&score>=5;if(!ok){$('result').innerHTML=`<div class=resultCard><h3>制作失敗…</h3><div class=weapon>💔</div><p>素材は失われました。生活で体力を整えて再挑戦しましょう。</p><button class=blue onclick="showTab('explore')">素材を集める</button> <button class=gold onclick="showTab('life')">食事/休息</button></div>`;s.log.push(`${r.n}の制作に失敗した。`);save();renderTop();return}let q=score>=14?'逸品':score>=10?'名品':score>=7?'良品':'普通';let price=Math.round(r.base*(1+score/12)+(s.rep*3));let item={id:Date.now(),name:`${q}の${r.n}`,price,q,icon:r.icon};s.inv.push(item);s.xp+=score;s.hp=Math.max(0,s.hp-12);s.hunger=Math.max(0,s.hunger-7);s.sleep=Math.max(0,s.sleep-3);s.missions.craft=1;if(q==='名品'||q==='逸品'){s.rep+=2;s.lv+=s.xp>25?1:0}s.log.push(`${item.name}が完成。在庫に追加。想定${price}G。`);$('result').innerHTML=`<div class=resultCard><h3>完成！</h3><div class=weapon>${r.icon}</div><p><b>${item.name}</b> が完成しました。<br>在庫に追加済み / 想定価格 ${price}G</p><button class=gold onclick="showTab('shop')">販売へ行く</button> <button class=ok onclick="startCraft()">もう一本作る</button></div>`;save();renderTop()}
function skipCraft(){let r=recipeObj();for(let k in r.need){if((s.mats[k]||0)<r.need[k])return toast('素材不足','探索で素材を集めてください。')}for(let k in r.need)s.mats[k]-=r.need[k];let item={id:Date.now(),name:`普通の${r.n}`,price:r.base, q:'普通',icon:r.icon};s.inv.push(item);s.hp=Math.max(0,s.hp-8);s.hunger=Math.max(0,s.hunger-5);s.missions.craft=1;s.log.push(`${item.name}をスキップ制作。在庫に追加。`);showTab('forge');setTimeout(()=>{$('result').innerHTML=`<div class=resultCard><h3>スキップ制作完了</h3><div class=weapon>${r.icon}</div><p>${item.name}を在庫に追加しました。高品質や図鑑は手動制作で狙えます。</p><button class=gold onclick="showTab('shop')">販売へ</button></div>`},0);save();renderTop()}
function shop(){let voices=['新人冒険者「安くて丈夫な短剣、ありますか？」','旅人「最近ここの鍛冶屋が評判って聞いたよ」','兵士「良品なら少し高くても買う」','商人「まとめ買いできる在庫があると助かるね」'];let inv=s.inv.map(it=>`<div class=item><strong>${it.icon} ${it.name}</strong><br><span class=pill>${it.q}</span> 想定${it.price}G<br><button class=gold onclick="sellItem(${it.id})">販売する</button></div>`).join('')||'<div class=item>在庫がありません。客「今日は何もないのか…また来るよ」</div>';return `<section class=screen on><div class=title><h2>販売</h2><p>店内の声と購入リアクションを追加。何が起きたか見えるようにしました。</p></div><div class=grid><div class=card><h3>店内の客の声</h3><div class=list>${voices.map((v,i)=>`<div class=customer><div class=avatar>${['🧑','🧙','🛡️','💼'][i]}</div><div class=bubble>${v}</div></div>`).join('')}</div></div><div class=card><h3>前回の販売反応</h3><div class=bubble>${s.lastSale}</div><h3>在庫</h3><div class=list>${inv}</div></div></div><div class=card><h3>素材市場</h3><div class=market>${Object.keys(s.mats).map(k=>`<div class=sellrow><span>${matName(k)}：${s.mats[k]}</span><button onclick="sellMat('${k}',1)">1個</button><button onclick="sellMat('${k}',5)">5個</button><button onclick="sellMat('${k}',999)">全部</button></div>`).join('')}</div></div></section>`}function sellItem(id){let idx=s.inv.findIndex(x=>x.id===id);if(idx<0)return;let it=s.inv.splice(idx,1)[0];let bonus=1+s.rep/100+s.tools.cloth*.05;let price=Math.round(it.price*bonus);s.gold+=price;s.rep+=it.q==='普通'?0:2;s.missions.sell=1;s.lastSale=`客「${it.name}、いいね！ ${price}Gで買うよ」`;s.log.push(`${it.name}が${price}Gで売れた。`);save();renderTop();showTab('shop')}function sellMat(k,n){let c=Math.min(s.mats[k]||0,n);if(c<=0)return;let price={ore:8,coal:6,wood:5,herb:13,horn:18,gem:55}[k]*c;s.mats[k]-=c;s.gold+=price;s.lastSale=`商人「${matName(k)}を${c}個、${price}Gで買い取るよ」`;s.log.push(`${matName(k)}を${price}Gで売却。`);save();renderTop();showTab('shop')}
function explore(){return `<section class=screen on><div class=title><h2>探索</h2><p>素材回収が止まらないよう安定化。探索は体力と空腹を使います。</p></div><div class=grid><div class=card><h3>探索先</h3><select id=area>${areas.map((a,i)=>`<option value=${i}>${a.n}</option>`).join('')}</select><button class=ok onclick=doExplore(1)>通常探索</button> <button class=blue onclick=doExplore(2)>仮広告：2倍探索</button></div><div class=card><h3>素材</h3><div class=matgrid>${matsHtml()}</div></div></div></section>`}function doExplore(mult){if(s.hp<10||s.hunger<8)return toast('探索できない','体力か空腹が不足しています。生活タブへ。');let a=areas[Number($('area').value)||0];let got=[];for(let k in a.m){let [lo,hi]=a.m[k];let v=(lo+Math.floor(Math.random()*(hi-lo+1)))*mult;s.mats[k]=(s.mats[k]||0)+v;got.push(`${matName(k)}${v}`)}s.hp=Math.max(0,s.hp-12*mult);s.hunger=Math.max(0,s.hunger-8*mult);s.sleep=Math.max(0,s.sleep-3);s.missions.explore=1;s.log.push(`${a.n}で${got.join('、')}を入手。`);toast('探索結果',got.join('、')+'を入手。');save();renderTop();showTab('explore')}
function life(){return `<section class=screen on><div class=title><h2>生活</h2><p>無限行動を防ぐため、体力・空腹・睡眠・母の体調を管理します。</p></div><div class=grid><div class=card><h3>自分</h3><div class=statgrid><div class=box>体力<b>${s.hp}/100</b></div><div class=box>空腹<b>${s.hunger}/100</b></div><div class=box>睡眠<b>${s.sleep}/100</b></div><div class=box>気分<b>${s.mood}/100</b></div></div><button class=gold onclick=eat()>食事をとる 40G</button> <button class=blue onclick=sleep()>睡眠する</button></div><div class=card><h3>母</h3><div class=statgrid><div class=box>体調<b>${s.momHp}/100</b></div><div class=box>空腹<b>${s.momFood}/100</b></div><div class=box>気分<b>${s.momMood}/100</b></div><div class=box>世話<b>${s.missions.care?'済':'未'}</b></div></div><button class=gold onclick=feedMom()>母の食事 35G</button> <button class=blue onclick=medicine()>薬 80G</button> <button class=ok onclick=care()>看病する</button></div></div></section>`}function eat(){if(s.gold<40)return toast('お金不足','食事代が足りません。');s.gold-=40;s.hp=Math.min(100,s.hp+28);s.hunger=Math.min(100,s.hunger+35);s.mood=Math.min(100,s.mood+8);s.log.push('食事をとった。');save();renderTop();showTab('life')}function sleep(){s.day++;s.hp=Math.min(100,s.hp+45);s.sleep=100;s.hunger=Math.max(0,s.hunger-12);s.momFood=Math.max(0,s.momFood-8);dailyEvent();save();renderTop();showTab('home')}function feedMom(){if(s.gold<35)return toast('お金不足','食事代が足りません。');s.gold-=35;s.momFood=Math.min(100,s.momFood+35);s.momMood=Math.min(100,s.momMood+8);s.missions.care=1;s.log.push('母に温かい食事を用意した。');save();renderTop();showTab('life')}function medicine(){if(s.gold<80)return toast('お金不足','薬代が足りません。');s.gold-=80;s.momHp=Math.min(100,s.momHp+28);s.missions.care=1;s.log.push('母に薬を渡した。');save();renderTop();showTab('life')}function care(){s.hp=Math.max(0,s.hp-8);s.momHp=Math.min(100,s.momHp+12);s.momMood=Math.min(100,s.momMood+15);s.missions.care=1;s.log.push('母の看病をした。');save();renderTop();showTab('life')}
function tools(){let data=[['hammer','職人ハンマー',500,'判定が少し楽になる'],['cloth','接客服',420,'販売単価と魅力が上がる'],['kiln','修理済みの窯',800,'品質下限と安定感が上がる']];return `<section class=screen on><div class=title><h2>道具・設備</h2><p>買った意味が見えるように効果を表示。今後は見た目差分も追加予定。</p></div><div class=list>${data.map(d=>`<div class=item><strong>${d[1]} Lv.${s.tools[d[0]]}</strong><br>${d[3]}<br>価格 ${d[2]*(s.tools[d[0]]+1)}G<br><button class=gold onclick="buyTool('${d[0]}',${d[2]})">購入/強化</button></div>`).join('')}</div></section>`}function buyTool(k,base){let cost=base*(s.tools[k]+1);if(s.gold<cost)return toast('お金不足',`${cost}G必要です。`);s.gold-=cost;s.tools[k]++;s.log.push(`${k}を強化した。`);save();renderTop();showTab('tools')}
function book(){return `<section class=screen on><div class=title><h2>図鑑</h2><p>今後のやり込み要素。v11では制作履歴と品質収集を表示。</p></div><div class=card><h3>制作履歴</h3><div class=log>${s.log.filter(x=>x.includes('完成')).slice(-20).reverse().join('<br>')||'まだ完成履歴がありません。'}</div></div></section>`}function progress(){let st=stages[s.stage];return `<section class=screen on><div class=title><h2>進行</h2><p>返済すると次のステージへ。先の解放要素が見えるようにしました。</p></div><div class=grid><div class=card><h3>返済</h3><p>現在：${s.paid} / ${st.due}G</p><button class=gold onclick=pay(200)>200G返済</button> <button class=gold onclick=pay(1000)>1000G返済</button><button class=bad onclick=nextDay()>時間を進める</button></div><div class=card><h3>次の解放</h3><div class=mission><div><b>Stage2</b><br>ギルド客・銀細工</div><div><b>Stage3</b><br>工房拡張・量産</div><div><b>Stage4</b><br>王都進出・貴族街</div><div><b>Stage5</b><br>名工ブランド化</div></div></div></div></section>`}function pay(n){let c=Math.min(n,s.gold);if(c<=0)return;s.gold-=c;s.paid+=c;let st=stages[s.stage];if(s.paid>=st.due&&s.stage<5){s.stage++;s.paid=0;s.rep+=5;toast('Stage UP!',`Stage ${s.stage}：${stages[s.stage].name}へ進みました。`)}save();renderTop();showTab('progress')}function nextDay(){s.day++;s.hp=Math.min(100,s.hp+15);s.hunger=Math.max(0,s.hunger-15);s.sleep=Math.max(0,s.sleep-10);s.momHp=Math.max(0,s.momHp+(s.momFood>30?3:-8));s.momFood=Math.max(0,s.momFood-12);s.missions={craft:0,explore:0,sell:0,care:0};dailyEvent();save();renderTop();showTab('home')}function dailyEvent(){let ev=['街で小さな市が立った。客足が少し増えそう。','ごろつきが工房の前をうろついている。評判が低いと危険。','母が少し楽そうにしている。','冒険者が鉱山の噂を話していた。'];let msg=ev[Math.floor(Math.random()*ev.length)];s.log.push(`Day${s.day}: ${msg}`)}
function matsHtml(){return Object.keys(s.mats).map(k=>`<div class=mat>${matName(k)}<b>${s.mats[k]}</b></div>`).join('')}function matName(k){return {ore:'鉄鉱石',coal:'石炭',wood:'木材',herb:'薬草',horn:'角',gem:'宝石'}[k]||k}function toast(t,msg){$('dlgTitle').textContent=t;$('dlgText').textContent=msg;$('dialog').classList.remove('hidden')}function closeDlg(){$('dialog').classList.add('hidden')}window.closeDlg=closeDlg;function log(x){s.log.push(x)}init();
</script>
</body>
</html>
