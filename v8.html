const $=s=>document.querySelector(s),fmt=n=>Math.floor(n).toLocaleString()+"G",clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const STAGES={1:{name:"工房を守る",due:1200,desc:"7日以内に初回返済"},2:{name:"ギルド登録",due:3500,desc:"王都ギルドへ登録"},3:{name:"工房拡張",due:8000,desc:"窯修理と2本制作の準備"},4:{name:"王都進出",due:20000,desc:"高級客と特殊素材"},5:{name:"名工への道",due:50000,desc:"騎士団契約と量産ライン"}};const MATS={iron:"鉄鉱石",coal:"石炭",wood:"木材",herb:"薬草",horn:"針ウサギの角",leather:"革",mana:"魔石",silver:"銀鉱石",gem:"宝石"};const REC=[{id:"knife",n:"鉄の短剣",stage:1,base:150,req:{spd:2,int:1},mat:{iron:2,coal:1}},{id:"spear",n:"角槍",stage:1,base:260,req:{str:2,sta:1},mat:{iron:2,horn:1,wood:1}},{id:"armor",n:"革の胸当て",stage:1,base:240,req:{spd:1,sta:2},mat:{leather:2,iron:1}},{id:"sword",n:"騎士団の直剣",stage:2,base:520,req:{str:3,spd:2},mat:{iron:4,coal:2,silver:1}},{id:"wand",n:"魔導師の杖",stage:2,base:600,req:{int:4,luck:2},mat:{wood:2,mana:2,gem:1}},{id:"jewel",n:"銀細工の短剣",stage:3,base:900,req:{spd:4,int:3,luck:2},mat:{silver:3,gem:1,coal:2}},{id:"great",n:"黒鉄の大剣",stage:4,base:1800,req:{str:6,sta:4},mat:{iron:8,coal:5,mana:1}},{id:"royal",n:"王家の儀礼剣",stage:5,base:4200,req:{str:6,spd:5,int:5,luck:4},mat:{silver:6,gem:4,mana:3}}];const AREAS=[{id:"field",n:"草原",stage:1,loot:{herb:[4,9],wood:[2,5],horn:[0,2]}},{id:"mine",n:"古い採掘跡",stage:1,loot:{iron:[5,11],coal:[3,7],mana:[0,1]}},{id:"forest",n:"深い森",stage:1,loot:{wood:[6,12],herb:[3,7],leather:[0,2]}},{id:"cave",n:"青火の洞窟",stage:2,loot:{iron:[8,16],coal:[6,11],silver:[1,4],mana:[1,3]}},{id:"capital",n:"王都近郊",stage:2,loot:{silver:[2,5],gem:[1,3],leather:[2,5]}}];const STEPS=["火入れ","叩き","水入れ","研ぎ"],RANKS={MISS:0,OK:1,GOOD:2,PERFECT:3,MARVELOUS:4};let state,tab="home",forge=null,raf=0,pos=0,dir=1;function fresh(){return{ver:8,stage:1,day:1,phase:0,gold:300,rep:0,trust:0,walk:0,lv:1,xp:0,stats:{str:2,spd:2,int:2,sta:2,luck:1,charm:1},body:{hp:78,hunger:45,sleep:82,mood:70},mother:{hp:58,hunger:48,mood:55},mats:{iron:8,coal:5,wood:5,herb:8,horn:1,leather:2,mana:0,silver:0,gem:0},items:[],dex:{},tools:{hammer:"標準ハンマー",cloth:"作業エプロン",kiln:"古い窯",kilnLv:0},lastComic:[],log:["父の窯に火を入れた。ここから始まる。"]}}function load(){try{state=JSON.parse(localStorage.ff_v8)||fresh()}catch(e){state=fresh()}}function save(){localStorage.ff_v8=JSON.stringify(state)}window.ffReset=()=>{localStorage.removeItem("ff_v8");location.reload()}function addLog(t){state.log.unshift(t);state.log=state.log.slice(0,40)}function canAct(cost){return state.body.hp>=cost.hp&&state.body.hunger>0&&state.body.sleep>0}function cost(c){state.body.hp=clamp(state.body.hp-(c.hp||0),0,100);state.body.hunger=clamp(state.body.hunger-(c.hunger||0),0,100);state.body.sleep=clamp(state.body.sleep-(c.sleep||0),0,100);state.body.mood=clamp(state.body.mood+(c.mood||0),0,100)}function tabs(){let a=[["home","🏠 ホーム"],["forge","🔥 鍛冶"],["shop","🛒 販売"],["life","🍲 生活"],["explore","🗺 探索"],["tools","🧰 道具"],["book","📖 図鑑"],["progress","🏰 進行"]];$("#tabs").innerHTML=a.map(x=>`<button class="tab ${tab==x[0]?"on":""}" onclick="tab='${x[0]}';render()">${x[1]}</button>`).join("")}function statTop(){let s=state,b=state.body,m=state.mother;$("#stats").innerHTML=[["日数",s.day],["所持金",fmt(s.gold)],["Stage",s.stage],["評判",s.rep],["Lv",s.lv],["体力",b.hp],["空腹",b.hunger],["母体調",m.hp]].map(x=>`<div class="stat"><small>${x[0]}</small><b>${x[1]}</b></div>`).join("");let st=STAGES[s.stage];$("#goalText").textContent=`Stage ${s.stage}：${st.name} / 目標 ${fmt(st.due)}`;$("#goalSub").textContent=st.desc;$("#goalbar").style.width=clamp(s.gold/st.due*100,0,100)+"%"}function render(){save();tabs();statTop();cancelAnimationFrame(raf);if(tab==="forge")drawForge();else if(tab==="home")drawHome();else if(tab==="explore")drawExplore();else if(tab==="shop")drawShop();else if(tab==="life")drawLife();else if(tab==="tools")drawTools();else if(tab==="book")drawBook();else drawProgress()}function drawHome(){let s=state;$("#main").innerHTML=`<section class="screen on"><div class="title"><h2>ボロ工房の朝</h2><p>母を守るため、少女は父の窯で鉄を打つ。</p></div><div class="scene"><div class="wall"></div><div class="floor"></div><div class="kiln"></div><div class="anvil"></div><div class="shelf"></div><div class="hero"><div class="hair"></div><div class="ribbon"></div><div class="face"></div><div class="eye l"></div><div class="eye r"></div><div class="cheek l"></div><div class="cheek r"></div><div class="mouth"></div><div class="body"></div><div class="apron"></div><div class="arm l"></div><div class="arm r"></div><div class="hammer"></div></div></div><div class="phase"><span class="${s.phase==0?"now":""}">朝<br><small>販売・噂</small></span><span class="${s.phase==1?"now":""}">昼<br><small>探索・市場</small></span><span class="${s.phase==2?"now":""}">夜<br><small>制作・休息</small></span></div><div class="grid"><div class="card"><h3>主人公ステータス</h3><div class="statgrid">${Object.entries(s.stats).map(([k,v])=>`<div class="box"><small>${jpStat(k)}</small><b>${v}</b></div>`).join("")}</div></div><div class="card"><h3>ログ</h3><div class="log">${s.log.map(x=>"・"+x).join("<br>")}</div></div></div></section>`}function jpStat(k){return{str:"力",spd:"速さ",int:"賢さ",sta:"体力",luck:"運",charm:"魅力"}[k]||k}function drawForge(){let recipes=REC.filter(r=>r.stage<=state.stage),rid=(forge&&forge.rec)||recipes[0].id,rec=REC.find(r=>r.id===rid)||recipes[0];$("#main").innerHTML=`<section class="screen on"><div class="title"><h2>武器制作</h2><p>待機画面では判定文字を出しません。判定後だけカットインが変わります。</p></div><div class="card"><select id="recipeSel" ${forge?"disabled":""}>${recipes.map(r=>`<option value="${r.id}" ${r.id===rec.id?"selected":""}>${r.n}</option>`).join("")}</select><p class="small">${reqText(rec)}<br>素材：${matText(rec.mat)}<br>基礎価格：${fmt(rec.base)}</p>${forge?`<button class="bad" onclick="cancelForge()">制作中止</button>`:`<button class="ok" onclick="startForge()">手動制作を始める</button> <button class="blue" onclick="skipForge()">通常スキップ制作</button>`}</div><div class="forgeStage"><div class="card"><h3>漫画カットイン</h3><div id="cinema" class="cinema wait" data-step="待機"><div class="waitArt"><div><b>制作待機</b><p>工程開始後、判定に応じたカットインを表示</p></div></div></div></div><div class="card"><h3>タイミング</h3><p id="stepInfo" class="small">手動制作を始めると4工程が進みます。</p><div class="gauge ${forge?'':'hidden'}"><div id="zok" class="zone zok"></div><div id="zgood" class="zone zgood"></div><div id="zper" class="zone zper"></div><div id="zmar" class="zone zmar"></div><div id="ptr" class="pointer"></div></div><button id="hit" class="hitBtn ${forge?'':'hidden'}" onclick="hitForge()">ここだ！</button><div id="rankInfo" class="small"></div></div></div><div class="card"><h3>今回の制作4コマ</h3><div id="strip" class="mangaStrip"></div></div><div class="card"><h3>素材</h3><div class="matgrid">${matList()}</div></div></section>`;$("#recipeSel")?.addEventListener("change",e=>{forge=null;drawForge()});if($("#recipeSel"))$("#recipeSel").value=rid;if(forge){updateForgeView();loop()}}function reqText(r){return"必要能力："+Object.entries(r.req).map(([k,v])=>`${jpStat(k)}${v}`).join(" / ")}function matText(m){return Object.entries(m).map(([k,v])=>`${MATS[k]}${v}`).join("、")}function matList(){return Object.entries(MATS).map(([k,n])=>`<div class="mat"><span>${n}</span><b>${state.mats[k]||0}</b></div>`).join("")}function hasMats(r){return Object.entries(r.mat).every(([k,v])=>(state.mats[k]||0)>=v)}function startForge(){let rec=REC.find(r=>r.id==$("#recipeSel").value);if(!canAct({hp:12})){addLog("体力・空腹・睡眠が足りず制作できない。");render();return}if(!hasMats(rec)){addLog("素材が足りない。探索か素材市場で補充しよう。");render();return}Object.entries(rec.mat).forEach(([k,v])=>state.mats[k]-=v);cost({hp:12,hunger:4,sleep:3});forge={rec:rec.id,step:0,hits:[],pos:0,lastRank:null};addLog(`${rec.n}の制作を開始。`);drawForge()}function cancelForge(){forge=null;addLog("制作を中止した。消費済み素材は戻らない。");render()}function skipForge(){let rec=REC.find(r=>r.id==$("#recipeSel").value);if(!canAct({hp:8})||!hasMats(rec)){addLog("素材か体力が足りない。");render();return}Object.entries(rec.mat).forEach(([k,v])=>state.mats[k]-=v);cost({hp:8,hunger:3,sleep:2});finishItem(rec,["OK","OK","GOOD","OK"],1.6,true)}function zone(w){return{l:50-w/2,r:50+w/2}}function allowed(){return state.lv>=5?["OK","GOOD","PERFECT","MARVELOUS"]:state.lv>=3?["OK","GOOD","PERFECT"]:["OK","GOOD"]}function zoneWidths(){let rec=REC.find(r=>r.id==forge.rec),gap=needGap(rec),base=28+state.tools.kilnLv*3-gap;return{OK:clamp(base,16,42),GOOD:clamp(base*.55,9,24),PERFECT:clamp(base*.28,5,13),MARVELOUS:clamp(base*.14,3,7)}}function needGap(r){return Math.max(0,...Object.entries(r.req).map(([k,v])=>v-(state.stats[k]||0)))*3}function loop(){if(!forge)return;let rec=REC.find(r=>r.id==forge.rec),speed=.9+rec.stage*.18+needGap(rec)*.02-state.lv*.025-state.tools.kilnLv*.03;pos+=dir*speed;if(pos>100){pos=100;dir=-1}if(pos<0){pos=0;dir=1}$("#ptr").style.left=pos+"%";raf=requestAnimationFrame(loop)}function judge(){let w=zoneWidths(),a=allowed(),p=pos,hit="MISS";for(const r of ["MARVELOUS","PERFECT","GOOD","OK"]){let z=zone(w[r]);if(a.includes(r)&&p>=z.l&&p<=z.r){hit=r;break}}return hit}function hitForge(){if(!forge)return;let r=judge();forge.hits.push(r);forge.lastRank=r;registerCut(STEPS[forge.step],r);forge.step++;updateForgeView(true);if(forge.step>=4){let rec=REC.find(x=>x.id==forge.rec),q=forge.hits.reduce((a,b)=>a+RANKS[b],0)/4,miss=forge.hits.filter(x=>x==="MISS").length;if(miss>=2||q<.9){showCut("破損","MISS",true);addLog("制作失敗。素材は失われた。");forge=null;state.body.mood=clamp(state.body.mood-8,0,100);save();setTimeout(render,550)}else{finishItem(rec,forge.hits,q,false);forge=null;save();setTimeout(render,550)}}}function finishItem(rec,hits,q,skip){let grade=q>=3.7?"伝説級":q>=3.1?"逸品":q>=2.45?"名品":q>=1.7?"良品":"普通",price=Math.round(rec.base*(1+q*.35+state.rep*.01+state.stats.charm*.03));state.items.push({n:rec.n,grade,price,hits,skip});state.xp+=Math.round(8+q*6);while(state.xp>=state.lv*22){state.xp-=state.lv*22;state.lv++;addLog(`職人Lvが${state.lv}に上がった。`)}if(["名品","逸品","伝説級"].includes(grade)){Object.keys(rec.req).forEach(k=>state.stats[k]=(state.stats[k]||0)+1);addLog(`${grade}を完成。関連能力が伸びた。`)}addLog(`${grade}の${rec.n}が完成。`);state.lastComic=hits.map((r,i)=>({step:STEPS[i],rank:r}));render()}function updateForgeView(flash=false){if(!forge)return;let rec=REC.find(r=>r.id==forge.rec),w=zoneWidths(),a=allowed();for(const r of ["OK","GOOD","PERFECT","MARVELOUS"]){let id=r=="OK"?"zok":r=="MARVELOUS"?"zmar":"z"+r.toLowerCase(),el=$("#"+id);if(el){let z=zone(w[r]);el.style.left=z.l+"%";el.style.width=(z.r-z.l)+"%";el.style.display=a.includes(r)?"block":"none"}}$("#stepInfo").innerHTML=`工程 ${forge.step+1}/4：<b>${STEPS[forge.step]||"完成"}</b><br>Lv${state.lv}で表示判定：${a.join(" / ")}`;$("#rankInfo").textContent=forge.lastRank?`直前判定：${forge.lastRank}`:"";if(forge.lastRank)showCut(STEPS[forge.step-1],forge.lastRank,flash);drawStrip()}function cutHtml(rank){let cls=rank==="MISS"?"miss":rank==="PERFECT"?"perfect":rank==="MARVELOUS"?"marvelous":"good",msg=rank==="MISS"?"あっ…！":rank==="PERFECT"?"ここだ…！":rank==="MARVELOUS"?"今なら打てる！":"よし、流れが見えた！",fx=rank==="MISS"?"💦":rank==="PERFECT"?"🔥":rank==="MARVELOUS"?"✨":"🔨";return`<div class="cut ${cls}"><div class="girl"></div><div class="fx">${fx}</div><div class="txt">${msg}</div><div class="rank">${rank}</div></div>`}function showCut(step,rank,flash){let c=$("#cinema");if(!c)return;c.className="cinema "+(flash?(rank==="MISS"?"shake":"flash"):"");c.dataset.step=step;c.innerHTML=cutHtml(rank)}function drawStrip(){let arr=forge?forge.hits.map((r,i)=>({step:STEPS[i],rank:r})):state.lastComic||[];$("#strip").innerHTML=arr.length?arr.map(x=>`<div class="stripCard"><small>${x.step}</small>${cutHtml(x.rank)}</div>`).join(""):`<p class="small">まだ今回の4コマはありません。</p>`}function registerCut(step,rank){let k=step+"_"+rank;if(!state.dex[k]){state.dex[k]=1;let n=Object.keys(state.dex).length;if(n%4===0){state.stats.charm++;addLog(`カットイン図鑑${n}枚。魅力+1。`)}}else state.dex[k]++}function drawExplore(){let areas=AREAS.filter(a=>a.stage<=state.stage);$("#main").innerHTML=`<div class="title"><h2>探索 / GPS</h2><p>素材回収処理をv8で復旧。体力不足以外では止まらないように修正。</p></div><div class="grid"><div class="card"><h3>探索先</h3><select id="areaSel">${areas.map(a=>`<option value="${a.id}">${a.n}</option>`).join("")}</select><p id="areaInfo" class="small"></p><button class="ok" onclick="doExplore(1)">通常探索</button> <button class="blue" onclick="doExplore(2)">仮広告：2倍探索</button><hr><input id="meters" type="number" min="100" step="100" value="1000"><button class="gold" onclick="addWalk()">仮距離を追加</button><p>歩行ストック：<b>${state.walk}</b>m</p><button class="ok" onclick="walkExplore()">歩行素材を回収</button></div><div class="card"><h3>素材</h3><div class="matgrid">${matList()}</div></div></div>`;let upd=()=>{$("#areaInfo").textContent=lootText(AREAS.find(a=>a.id==$("#areaSel").value).loot)};$("#areaSel").onchange=upd;upd()}function lootText(l){return Object.entries(l).map(([k,v])=>`${MATS[k]}${v[0]}〜${v[1]}`).join("、")}function gain(area,mul=1){let got=[];Object.entries(area.loot).forEach(([k,[a,b]])=>{let n=Math.floor((a+Math.random()*(b-a+1))*mul);state.mats[k]=(state.mats[k]||0)+n;got.push(`${MATS[k]}${n}`)});return got.join("、")}function doExplore(mul){let a=AREAS.find(x=>x.id==$("#areaSel").value);if(!canAct({hp:10})){addLog("体力・空腹・睡眠不足で探索できない。生活タブで回復しよう。");render();return}cost({hp:10,hunger:5,sleep:2});addLog(`${a.n}で${gain(a,mul)}を入手。`);render()}function addWalk(){state.walk+=Math.max(0,+$("#meters").value||0);addLog(`${$("#meters").value}mの歩行ストックを追加。`);render()}function walkExplore(){if(state.walk<300){addLog("歩行ストックが少ない。300m以上で回収可能。");render();return}let mul=clamp(state.walk/1200,.4,2.5);state.walk=0;let a=AREAS.find(x=>x.stage<=state.stage);addLog(`歩行回収：${gain(a,mul)}を入手。`);render()}function drawShop(){let mats=Object.keys(MATS);$("#main").innerHTML=`<div class="title"><h2>販売</h2><p>品質と評判で単価・口コミ・リピーターが変化。</p></div><div class="grid"><div class="card"><h3>完成品</h3><div class="list">${state.items.length?state.items.map((it,i)=>`<div class="item"><strong>${it.grade} ${it.n}</strong><br>${fmt(it.price)} <button class="gold" onclick="sellItem(${i})">売る</button></div>`).join(""):"在庫なし"}</div></div><div class="card"><h3>素材市場</h3><div class="list">${mats.map(k=>`<div class="sellrow"><span>${MATS[k]}：${state.mats[k]||0}個 / 単価${matPrice(k)}G</span><button onclick="sellMat('${k}',1)">1個</button><button onclick="sellMat('${k}',5)">5個</button><button onclick="sellMat('${k}',9999)">全部</button></div>`).join("")}</div></div></div>`}function sellItem(i){let it=state.items.splice(i,1)[0],bonus=1+state.rep*.005+state.stats.charm*.02,earn=Math.round(it.price*bonus);state.gold+=earn;if(["名品","逸品","伝説級"].includes(it.grade)){state.rep+=3;state.trust+=2;addLog(`${it.grade}販売で口コミが広がった。+${fmt(earn)}`)}else if(it.grade==="普通"){state.rep=Math.max(0,state.rep-1);addLog(`普通品質の販売で評価は伸び悩んだ。+${fmt(earn)}`)}else addLog(`${it.n}を販売。+${fmt(earn)}`);render()}function matPrice(k){let base={iron:12,coal:9,wood:7,herb:18,horn:25,leather:20,mana:55,silver:75,gem:120}[k]||10;return Math.round(base*(k==="herb"?1.7:1))}function sellMat(k,n){let q=Math.min(state.mats[k]||0,n);if(q<=0)return;state.mats[k]-=q;state.gold+=q*matPrice(k);addLog(`${MATS[k]}を${q}個売却。+${fmt(q*matPrice(k))}`);render()}function drawLife(){let b=state.body,m=state.mother;$("#main").innerHTML=`<div class="title"><h2>生活</h2><p>無限行動防止。食事と睡眠、母の世話が大事です。</p></div><div class="grid"><div class="card"><h3>自分</h3><p>体力${b.hp}/100 空腹${b.hunger}/100 睡眠${b.sleep}/100 気分${b.mood}/100</p><button class="gold" onclick="eatSelf()">食事をとる 60G</button> <button class="blue" onclick="sleep()">睡眠する</button></div><div class="card"><h3>母</h3><p>体調${m.hp}/100 空腹${m.hunger}/100 気分${m.mood}/100</p><button class="gold" onclick="feedMom()">母に食事 80G</button> <button class="blue" onclick="medMom()">薬 120G</button> <button class="ok" onclick="careMom()">看病</button></div></div>`}function eatSelf(){if(state.gold<60)return;state.gold-=60;state.body.hp=clamp(state.body.hp+30,0,100);state.body.hunger=clamp(state.body.hunger+45,0,100);state.body.mood=clamp(state.body.mood+8,0,100);addLog("温かい食事で回復した。");render()}function sleep(){state.day++;state.phase=0;state.body.hp=clamp(state.body.hp+55,0,100);state.body.sleep=100;state.body.hunger=clamp(state.body.hunger-15,0,100);state.mother.hunger=clamp(state.mother.hunger-10,0,100);randomEvent();render()}function feedMom(){if(state.gold<80)return;state.gold-=80;state.mother.hunger=clamp(state.mother.hunger+45,0,100);state.mother.mood=clamp(state.mother.mood+10,0,100);addLog("母に食事を用意した。");render()}function medMom(){if(state.gold<120)return;state.gold-=120;state.mother.hp=clamp(state.mother.hp+28,0,100);addLog("母に薬を渡した。");render()}function careMom(){if(!canAct({hp:6}))return;cost({hp:6,hunger:2,sleep:1,mood:4});state.mother.hp=clamp(state.mother.hp+12,0,100);state.mother.mood=clamp(state.mother.mood+10,0,100);addLog("母の看病をした。");render()}function drawTools(){let buys=[["窯修理",800,"kiln"],["軽量ハンマー",600,"hammer"],["接客服",700,"cloth"],["高温窯",4000,"kiln2"],["魔導窯",12000,"kiln3"]];$("#main").innerHTML=`<div class="title"><h2>道具・設備</h2><p>v8で効果を明確化。判定幅・消費体力・単価に影響します。</p></div><div class="card"><h3>現在</h3><p>窯：${state.tools.kiln} Lv${state.tools.kilnLv}<br>ハンマー：${state.tools.hammer}<br>服：${state.tools.cloth}</p></div><div class="grid">${buys.map(b=>`<div class="card"><h3>${b[0]}</h3><p>${fmt(b[1])}</p><button class="gold" onclick="buyTool('${b[2]}',${b[1]})">購入/強化</button></div>`).join("")}</div>`}function buyTool(kind,price){if(state.gold<price){addLog("お金が足りない。");render();return}state.gold-=price;if(kind==="kiln"){state.tools.kiln="修理済みの窯";state.tools.kilnLv=Math.max(state.tools.kilnLv,1)}if(kind==="kiln2"){state.tools.kiln="高温窯";state.tools.kilnLv=Math.max(state.tools.kilnLv,2)}if(kind==="kiln3"){state.tools.kiln="魔導窯";state.tools.kilnLv=Math.max(state.tools.kilnLv,3)}if(kind==="hammer"){state.tools.hammer="軽量ハンマー";state.stats.spd++}if(kind==="cloth"){state.tools.cloth="接客服";state.stats.charm+=2}addLog("設備/装備を更新した。");render()}function drawBook(){let keys=Object.keys(state.dex);$("#main").innerHTML=`<div class="title"><h2>カットイン図鑑</h2><p>手動制作で登録。枚数に応じて魅力や運が伸びます。</p></div><div class="card"><h3>登録 ${keys.length} 種</h3><div class="list">${keys.length?keys.map(k=>`<div class="item">${k} × ${state.dex[k]}</div>`).join(""):"まだ登録なし"}</div></div>`}function drawProgress(){let st=STAGES[state.stage];$("#main").innerHTML=`<div class="title"><h2>進行</h2><p>${st.name}</p></div><div class="card"><h3>返済/進行</h3><p>目標：${fmt(st.due)} / 所持：${fmt(state.gold)}</p><button class="ok" onclick="payStage()">目標を達成して次へ</button></div><div class="card"><h3>今後のStage</h3>${Object.entries(STAGES).map(([k,v])=>`<p><b>Stage ${k}</b> ${v.name}：${fmt(v.due)}</p>`).join("")}</div>`}function payStage(){let st=STAGES[state.stage];if(state.gold<st.due){addLog("まだ目標金額に届いていない。");render();return}state.gold-=st.due;if(state.stage<5){state.stage++;addLog(`Stage ${state.stage}へ進行。新しい客と素材が解放。`)}else addLog("名工への道を切り開いた。");render()}function randomEvent(){let r=Math.random();if(r<.15){state.gold=Math.max(0,state.gold-120);addLog("ごろつきが場所代を要求。120G失った。")}else if(r<.3){state.rep+=3;addLog("街のお祭りで客足が増えた。評判+3。")}else if(r<.42){state.mats.iron=Math.max(0,state.mats.iron-2);addLog("夜の強盗で鉄鉱石を少し盗まれた。")}else if(r<.55){state.trust+=2;addLog("貴族の使いが工房を覗いていった。信頼+2。")}}load();render();</script></body></html>
