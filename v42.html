<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>父の窯と鉄の夢 v42</title><style>html,body{margin:0;height:100%;background:#08040b;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}.badge{position:fixed;left:max(8px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));z-index:99;background:#120b10e8;border:1px solid #e2a75f;border-radius:999px;padding:5px 9px;color:#fff1dc;font:900 11px system-ui;pointer-events:none;box-shadow:0 5px 18px #0009,0 0 20px #d67a241f}</style></head><body><div class="badge">v42 • CUSTOMER VOICES</div><iframe id="game" src="/v41.html?v=42" title="父の窯と鉄の夢 v42"></iframe><script>
const game=document.getElementById('game');
function deepest(win){try{let cur=win;for(let i=0;i<64;i++){const f=[...cur.document.querySelectorAll('iframe')].find(x=>x.contentWindow&&x.contentDocument);if(!f)break;cur=f.contentWindow}return cur}catch(e){return null}}
function install(){try{const w=deepest(game.contentWindow);if(!w||!w.document?.body||w.__v42installed)return;w.__v42installed=1;const d=w.document;d.title='父の窯と鉄の夢 v42';
const css=d.createElement('style');css.id='v42-customer-voices-style';css.textContent=`
.v42-voice-card{position:fixed;right:max(10px,env(safe-area-inset-right));top:max(52px,calc(env(safe-area-inset-top) + 44px));z-index:2147483300;width:min(292px,calc(100vw - 20px));font-family:system-ui,-apple-system,sans-serif;color:#fff0db;background:linear-gradient(155deg,#21151cf5,#100b0ff2);border:1px solid #8f6349;border-radius:16px;box-shadow:0 12px 34px #0009,0 0 22px #c7773020;backdrop-filter:blur(10px);overflow:hidden;transition:opacity .2s ease,transform .2s ease}.v42-voice-card[data-hidden="1"]{opacity:0;transform:translateY(-6px);pointer-events:none}.v42-head{display:flex;align-items:center;gap:8px;padding:9px 10px;border-bottom:1px solid #ffffff0d}.v42-title{font:900 10px/1.2 system-ui;letter-spacing:.08em;color:#e7bd93}.v42-badge{margin-left:auto;padding:3px 6px;border-radius:999px;background:#181015;border:1px solid #51382f;font:900 8px/1 system-ui;color:#cdb49d}.v42-main{display:flex;gap:9px;align-items:flex-start;padding:10px}.v42-face{flex:0 0 36px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:#35231f;border:1px solid #745042;box-shadow:inset 0 1px #ffffff12}.v42-copy{min-width:0;flex:1}.v42-name{font:900 9px/1.2 system-ui;color:#d3ad89}.v42-line{margin-top:3px;font:800 12px/1.35 system-ui;color:#fff1dc}.v42-foot{display:flex;gap:6px;padding:0 10px 10px;flex-wrap:wrap}.v42-chip{padding:4px 6px;border-radius:999px;background:#171014;border:1px solid #46312c;font:900 8px/1 system-ui;color:#cdb6a1}.v42-chip.good{color:#d9e8c9;border-color:#687657;background:#172017}.v42-return{animation:v42pulse 1.2s ease 1}.v42-pop{position:fixed;z-index:2147483646;pointer-events:none;font:900 12px/1 system-ui;color:#ffd27f;text-shadow:0 2px 7px #000c;animation:v42pop .8s ease-out forwards}@keyframes v42pop{0%{opacity:0;transform:translate(-50%,-20%) scale(.75)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-125%) scale(1.04)}}@keyframes v42pulse{0%,100%{box-shadow:0 12px 34px #0009,0 0 22px #c7773020}50%{box-shadow:0 12px 34px #0009,0 0 34px #e7aa4e45}}@media(max-width:600px){.v42-voice-card{top:auto;bottom:max(88px,calc(env(safe-area-inset-bottom) + 80px));right:10px;width:min(280px,calc(100vw - 20px))}}@media(prefers-reduced-motion:reduce){.v42-voice-card,.v42-return,.v42-pop{transition:none!important;animation:none!important}.v42-pop{display:none!important}}
`;d.head.appendChild(css);
let sales=0;try{sales=Math.max(0,Number(localStorage.getItem('ff-v42-sales')||0)||0)}catch(e){}
const roster=[
{face:'🧑‍🌾',name:'旅の農夫',first:['丈夫そうだ。畑仕事の帰り道も安心だな。','この握り、手に馴染む。長く使えそうだ。'],repeat:['また来たよ。前の品が本当に丈夫だった。','村で評判になってたぞ。今日はもう一本頼む。']},
{face:'🛡️',name:'若い騎士',first:['重心がいい。遠征に持っていきたい。','これなら仲間の前に立つ時も心強い。'],repeat:['隊長にも褒められた。やっぱりここで頼む。','前の一本が良かった。今度は仲間の分だ。']},
{face:'🧙',name:'旅の術師',first:['鉄の響きが澄んでいる。作り手の心が見えるようだ。','旅道具は信頼が一番。これは良い相棒になる。'],repeat:['あの品は魔力の流れまで素直だった。また頼みたい。','評判を聞いた者が増えている。工房の名が広がっているな。']},
{face:'🧔',name:'古参の冒険者',first:['派手さより信頼だ。こういう仕事を待っていた。','刃を見れば分かる。丁寧に打ってあるな。'],repeat:['戻ってきたぞ。前の一本、まだ現役だ。','仲間に教えたら羨ましがられてな。もう一本頼む。']},
{face:'👩‍🍳',name:'宿屋の女将',first:['厨房道具も、いい鍛冶屋の品は違うんだよ。','毎日使うものほど丈夫じゃないと困るからね。'],repeat:['前の品、料理人たちに大好評だったよ。','常連客まで工房の話をしてる。評判だねえ。']}
];
function text(el){return(el?.innerText||el?.textContent||el?.getAttribute?.('aria-label')||'').trim()}
function isSale(t){return /販売|売る|売却|購入してもら|店に出す|売店/i.test(t)&&!/販売画面|販売候補|販売先/i.test(t)}
function saleButtons(){return [...d.querySelectorAll('button,.btn,[role="button"],a')].filter(el=>isSale(text(el)))}
const card=d.createElement('aside');card.className='v42-voice-card';card.dataset.hidden='1';card.setAttribute('aria-live','polite');card.innerHTML='<div class="v42-head"><div class="v42-title">CUSTOMER VOICE</div><div class="v42-badge">店先の声</div></div><div class="v42-main"><div class="v42-face">👀</div><div class="v42-copy"><div class="v42-name">工房の前</div><div class="v42-line">客が品物を眺めています。</div></div></div><div class="v42-foot"><span class="v42-chip">販売すると声が届く</span></div>';d.body.appendChild(card);
function render(c,line,repeat){card.dataset.hidden='0';card.querySelector('.v42-face').textContent=c.face;card.querySelector('.v42-name').textContent=c.name+(repeat?'・再来店':'');card.querySelector('.v42-line').textContent='「'+line+'」';card.querySelector('.v42-foot').innerHTML=`<span class="v42-chip good">✓ ${repeat?'また来てくれた':'購入満足'}</span><span class="v42-chip">累計 ${sales}件</span>${sales>=5?'<span class="v42-chip">口コミが広がっている</span>':''}`;card.classList.remove('v42-return');void card.offsetWidth;if(repeat)card.classList.add('v42-return')}
function pop(target,repeat){const r=target?.getBoundingClientRect?.();if(!r)return;const p=d.createElement('span');p.className='v42-pop';p.textContent=repeat?'✦ また来店':'✦ いい評判';p.style.left=(r.left+r.width/2)+'px';p.style.top=(r.top+r.height/2)+'px';d.body.appendChild(p);setTimeout(()=>p.remove(),900)}
function onSale(target){sales++;try{localStorage.setItem('ff-v42-sales',String(sales))}catch(e){}const c=roster[(sales-1)%roster.length];const repeat=sales>roster.length&&((sales-1)%3===0||sales%5===0);const pool=repeat?c.repeat:c.first;const line=pool[(sales-1)%pool.length];setTimeout(()=>{render(c,line,repeat);pop(target,repeat)},220)}
let guard='';d.addEventListener('click',e=>{const b=e.target.closest('button,.btn,[role="button"],a');if(!b)return;const t=text(b);if(!isSale(t))return;const key=t+'|'+Math.floor(Date.now()/1000);if(key===guard)return;guard=key;onSale(b)},true);
function visibility(){const hasSale=saleButtons().length>0;if(hasSale||sales>0)card.dataset.hidden='0';else card.dataset.hidden='1'}visibility();const obs=new MutationObserver(()=>visibility());obs.observe(d.body,{subtree:true,childList:true,attributes:false});w.addEventListener('beforeunload',()=>obs.disconnect(),{once:true});
}catch(e){console.error('v42 install',e)}}
function boot(){install();setTimeout(install,450);setTimeout(install,1500)}game.addEventListener('load',boot);boot();
</script></body></html>
