<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>父の窯と鉄の夢 v18</title><style>html,body{margin:0;height:100%;background:#0d0710;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}.v18badge{position:fixed;left:8px;top:8px;z-index:99;background:#160d1eee;border:2px solid #ff9fbd;border-radius:999px;padding:5px 9px;color:#ffe2ec;font:900 11px system-ui;pointer-events:none}</style></head><body><div class="v18badge">v18 • LIFE & MOTHER</div><iframe id="shell" src="/v17.html?v=18" title="父の窯と鉄の夢 v18"></iframe><script>
const shell=document.getElementById('shell');
function deepestFrame(win){try{let cur=win;for(let i=0;i<7;i++){const fs=[...cur.document.querySelectorAll('iframe')];if(!fs.length)break;const next=fs.find(x=>x.contentWindow&&x.contentDocument);if(!next)break;cur=next.contentWindow}return cur}catch(e){return null}}
function install(){try{const w=deepestFrame(shell.contentWindow);if(!w||!w.document||!w.document.body)return;const d=w.document;if(w.__v18installed)return;w.__v18installed=1;d.title='父の窯と鉄の夢 v18';
const s=d.createElement('style');s.textContent=`
.v18life{margin:10px 0 12px;background:linear-gradient(135deg,#2d1b29,#1a1625);border:3px solid #ff9fbd;border-radius:20px;padding:12px;box-shadow:0 8px #09050d}.v18lifeTop{display:flex;justify-content:space-between;gap:10px;align-items:center}.v18life h3{margin:0;color:#ffd8e5}.v18portrait{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:linear-gradient(135deg,#ffe4c9,#d79ac3);border:3px solid #fff0d6;box-shadow:0 0 18px #ff9fbd44}.v18bars{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.v18meter{background:#120c17;border:2px solid #65485b;border-radius:13px;padding:8px}.v18meter small{display:block;color:#d8c4ce;font-size:10px}.v18meter b{display:block;color:#fff1d6;margin:3px 0}.v18track{height:8px;background:#09060c;border-radius:99px;overflow:hidden}.v18fill{height:100%;background:linear-gradient(90deg,#ce6f91,#ffd0a5);border-radius:99px;transition:.35s width}.v18dialog{margin-top:9px;background:#fff0da;color:#2c1721;border:3px solid #fff8e8;border-radius:18px;padding:11px 13px;font-weight:800;line-height:1.55;position:relative}.v18dialog:before{content:'💬';margin-right:6px}.v18care{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.v18chip{border-radius:99px;border:1px solid #876072;background:#24151f;color:#f9dbe5;padding:4px 8px;font-size:10px;font-weight:900}.v18chip.good{background:#173d2a;border-color:#7ee6a7;color:#ddffea}.v18event{position:fixed;left:50%;bottom:92px;z-index:10001;transform:translateX(-50%) translateY(16px);width:min(390px,90vw);background:linear-gradient(145deg,#3b2435,#180f1b);border:3px solid #ffb5ca;border-radius:22px;padding:14px;color:#fff4e9;box-shadow:0 16px 44px #000a;opacity:0;pointer-events:none;transition:.2s}.v18event.on{opacity:1;transform:translateX(-50%) translateY(0)}.v18event b{display:block;color:#ffd6e2;font-size:17px;margin-bottom:4px}.v18heart{display:inline-block;animation:v18heart .7s ease-in-out}.v18careGlow{outline:3px solid #ffb5ca!important;outline-offset:2px;box-shadow:0 0 26px #ff9fbd66!important}@keyframes v18heart{50%{transform:scale(1.35)}}@media(max-width:620px){.v18bars{grid-template-columns:1fr}.v18portrait{width:50px;height:50px}}
`;d.head.appendChild(s);
let state;try{state=JSON.parse(localStorage.getItem('ff_v18_life')||'null')}catch(e){}if(!state)state={bond:38,care:42,streak:0,last:'まだ少し疲れているけれど、あなたが工房に立つ音を聞くと安心するよ。'};
function save(){try{localStorage.setItem('ff_v18_life',JSON.stringify(state))}catch(e){}}
const evt=d.createElement('div');evt.className='v18event';d.body.appendChild(evt);let et;function pop(title,text){clearTimeout(et);evt.innerHTML='<b>🌷 '+title+'</b>'+text;evt.classList.add('on');et=setTimeout(()=>evt.classList.remove('on'),2600)}
function lifeScreen(){return [...d.querySelectorAll('.screen')].find(x=>/life|rest|home2/i.test(x.id))||[...d.querySelectorAll('.screen')].find(x=>/母|看病|薬|睡眠|食事/.test(x.innerText||''))}
function motherLine(){if(state.care>=80)return '今日は顔色がいいみたい。無理しすぎないでね。あなたの作る音、好きよ。';if(state.care>=55)return '少し楽になってきたよ。工房のことも、ちゃんと応援してるからね。';if(state.care>=30)return 'まだ横になっていたいけど、大丈夫。薬を忘れないようにしないとね。';return '今日は少しつらそうだ…。工房より先に様子を見た方がよさそう。'}
function ensure(){const sc=lifeScreen();if(!sc)return;let box=sc.querySelector('.v18life');if(!box){box=d.createElement('div');box.className='v18life';box.innerHTML='<div class="v18lifeTop"><div><small>HOME HEARTBEAT</small><h3>🏠 母との暮らし</h3></div><div class="v18portrait">👩</div></div><div class="v18bars"><div class="v18meter"><small>母の体調</small><b data-k="care">安定</b><div class="v18track"><div class="v18fill" data-fill="care"></div></div></div><div class="v18meter"><small>親子の絆</small><b data-k="bond">38</b><div class="v18track"><div class="v18fill" data-fill="bond"></div></div></div></div><div class="v18dialog" data-k="line"></div><div class="v18care"><span class="v18chip">🍲 食事</span><span class="v18chip">💊 薬</span><span class="v18chip">🤝 看病</span><span class="v18chip" data-k="streak">連続ケア 0</span></div>';const title=sc.querySelector('.title');if(title&&title.nextSibling)sc.insertBefore(box,title.nextSibling);else sc.prepend(box)}box.querySelector('[data-k="care"]').textContent=state.care>=75?'とても良い':state.care>=50?'安定':state.care>=30?'少し疲れ':'要ケア';box.querySelector('[data-k="bond"]').textContent=state.bond;box.querySelector('[data-fill="care"]').style.width=Math.max(4,Math.min(100,state.care))+'%';box.querySelector('[data-fill="bond"]').style.width=Math.max(4,Math.min(100,state.bond))+'%';box.querySelector('[data-k="line"]').textContent=motherLine();box.querySelector('[data-k="streak"]').textContent='連続ケア '+state.streak;const careButtons=[...sc.querySelectorAll('button')].filter(b=>/母|薬|看病|食事/.test(b.textContent));careButtons.forEach(b=>b.classList.toggle('v18careGlow',state.care<45))}
const reactions={meal:['母と一緒に食卓を囲んだ','「こうして一緒に食べると、ちゃんと元気が出るね」'],medicine:['薬を忘れず渡した','「ありがとう。これで少し楽になりそう」'],care:['そばで少し話をした','「工房の話、もっと聞かせて。あなたが楽しそうだと私も嬉しいよ」'],sleep:['夜が静かに更けていく','「おやすみ。明日も無理しすぎないでね」']};
function apply(kind){let r=reactions[kind];if(!r)return;if(kind==='meal'){state.care=Math.min(100,state.care+7);state.bond=Math.min(100,state.bond+3)}if(kind==='medicine'){state.care=Math.min(100,state.care+10);state.bond=Math.min(100,state.bond+2)}if(kind==='care'){state.care=Math.min(100,state.care+5);state.bond=Math.min(100,state.bond+8)}if(kind==='sleep'){state.care=Math.max(0,state.care-2)}if(kind!=='sleep')state.streak++;state.last=r[1];save();pop(r[0],r[1]);setTimeout(ensure,80)}
d.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const t=b.textContent.trim();if(/母.*食事|食事.*母/.test(t))apply('meal');else if(/薬/.test(t))apply('medicine');else if(/看病|話す|様子/.test(t))apply('care');else if(/睡眠|寝る/.test(t))apply('sleep');setTimeout(ensure,100)},true);
const mo=new MutationObserver(()=>{clearTimeout(w.__v18timer);w.__v18timer=setTimeout(ensure,90)});mo.observe(d.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class']});ensure();
}catch(e){console.error('v18 install',e)}}
function boot(){install();setTimeout(install,260);setTimeout(install,900)}shell.addEventListener('load',boot);boot();
</script></body></html>
