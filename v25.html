<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>父の窯と鉄の夢 v25</title><style>html,body{margin:0;height:100%;background:#08040b;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}.badge{position:fixed;left:8px;top:8px;z-index:99;background:#100a16e8;border:2px solid #e8c77a;border-radius:999px;padding:5px 9px;color:#fff0bd;font:900 11px system-ui;pointer-events:none}</style></head><body><div class="badge">v25 • CUSTOMER VOICES</div><iframe id="shell" src="/v24.html?v=25" title="父の窯と鉄の夢 v25"></iframe><script>
const shell=document.getElementById('shell');
function deepest(win){try{let cur=win;for(let i=0;i<28;i++){const f=[...cur.document.querySelectorAll('iframe')].find(x=>x.contentWindow&&x.contentDocument);if(!f)break;cur=f.contentWindow}return cur}catch(e){return null}}
function install(){try{const w=deepest(shell.contentWindow);if(!w||!w.document?.body||w.__v25installed)return;w.__v25installed=1;const d=w.document;d.title='父の窯と鉄の夢 v25';
const s=d.createElement('style');s.textContent=`
.v25voices{margin:10px 0 12px;padding:12px;border-radius:20px;background:linear-gradient(145deg,#211629,#120c18);border:2px solid #7d6388;box-shadow:0 8px 24px #0007;color:#f9eddd}.v25voices h3{margin:0 0 8px;color:#ffe3a3;font-size:15px}.v25row{display:flex;gap:8px;overflow:auto;padding-bottom:2px}.v25person{min-width:132px;padding:9px;border-radius:15px;background:#100a15;border:1px solid #53415c;opacity:.7;transition:.18s}.v25person.on{opacity:1;border-color:#f0cb77;box-shadow:0 0 18px #ffd98a33;transform:translateY(-2px)}.v25face{font-size:27px}.v25person b{display:block;color:#fff1b2;font-size:12px}.v25person small{color:#cdbdce}.v25bubble{position:relative;margin-top:10px;padding:11px 12px;border-radius:16px;background:#f7edda;color:#2a1600;font-weight:850;line-height:1.45;box-shadow:0 5px #b79968}.v25bubble:before{content:'💬';margin-right:6px}.v25note{margin-top:8px;color:#cdbdce;font-size:11px}.v25pop{position:fixed;left:50%;top:34%;z-index:11990;transform:translate(-50%,-50%) scale(.82);padding:11px 15px;border-radius:999px;background:#fff0c8;color:#2a1600;border:3px solid #d39a3c;font-weight:1000;box-shadow:0 10px 34px #000b;pointer-events:none;opacity:0}.v25pop.on{animation:v25pop .75s ease-out}.v25spark{position:fixed;z-index:11980;pointer-events:none;font-size:20px;animation:v25spark .8s ease-out forwards}@keyframes v25pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}28%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-65%) scale(.95)}}@keyframes v25spark{0%{opacity:1;transform:translate(0,0) scale(.7)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1.25)}}@media(prefers-reduced-motion:reduce){.v25person,.v25pop,.v25spark{animation:none!important;transition:none!important}}
`;d.head.appendChild(s);
const cast=[{n:'若い冒険者',f:'🧑‍🌾',ask:['軽くて振りやすい一本、ある？','初遠征なんだ。安心できる武器が欲しい！'],buy:['これなら行けそう！ありがとう！','握った瞬間わかった。いい仕事だ！']},{n:'王国騎士',f:'🛡️',ask:['刃の仕上げを見せてもらおう。','訓練用でも妥協はしない。'],buy:['見事だ。騎士団にも薦めよう。','重心がいい。実戦でも使えそうだ。']},{n:'旅商人',f:'🧳',ask:['売れ筋になりそうな一本はあるかい？','旅先で評判になりそうな品を探してる。'],buy:['これは売れる顔をしてるね。','次の町でも噂しておくよ。']}];let ci=0,turn=0;const pop=d.createElement('div');pop.className='v25pop';d.body.appendChild(pop);
function market(){return [...d.querySelectorAll('.screen')].find(x=>/market|shop|sell/.test(x.id)&&x.offsetParent!==null)||[...d.querySelectorAll('.screen')].find(x=>/market|shop|sell/.test(x.id))}
function ensure(){const sc=market();if(!sc)return;let box=sc.querySelector('.v25voices');if(!box){box=d.createElement('section');box.className='v25voices';box.innerHTML='<h3>🗣️ 今日のお客さんの声</h3><div class="v25row"></div><div class="v25bubble"></div><div class="v25note">お客さんの言葉から、店に何が求められているか感じ取れます。</div>';const old=sc.querySelector('.v15customers');if(old&&old.nextSibling)sc.insertBefore(box,old.nextSibling);else sc.prepend(box)}const row=box.querySelector('.v25row');row.innerHTML=cast.map((c,i)=>`<div class="v25person ${i===ci?'on':''}" data-i="${i}"><div class="v25face">${c.f}</div><b>${c.n}</b><small>${i===ci?'話しかけてきた':'店内を見ている'}</small></div>`).join('');const c=cast[ci];box.querySelector('.v25bubble').textContent=c.ask[turn%c.ask.length];box.querySelectorAll('.v25person').forEach(el=>el.onclick=()=>{ci=+el.dataset.i;turn++;ensure()})}
function sparkle(){for(let i=0;i<7;i++){const e=d.createElement('i');e.className='v25spark';e.textContent=i%2?'✨':'⭐';e.style.left=(50+(Math.random()*8-4))+'vw';e.style.top=(38+(Math.random()*4-2))+'vh';e.style.setProperty('--x',(Math.random()*140-70)+'px');e.style.setProperty('--y',(-25-Math.random()*85)+'px');d.body.appendChild(e);setTimeout(()=>e.remove(),900)}}function soldVoice(){const c=cast[ci];pop.textContent=c.f+' '+c.buy[turn%c.buy.length];pop.classList.remove('on');void pop.offsetWidth;pop.classList.add('on');sparkle();turn++;ci=(ci+1)%cast.length;setTimeout(ensure,500)}
d.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const t=b.textContent.trim();if(/販売|売る|接客/.test(t)){setTimeout(soldVoice,260)}setTimeout(ensure,100)},true);const mo=new MutationObserver(()=>ensure());mo.observe(d.body,{subtree:true,childList:true,attributes:true,attributeFilter:['class','style']});ensure();
}catch(e){console.error('v25 install',e)}}function boot(){install();setTimeout(install,350);setTimeout(install,1300)}shell.addEventListener('load',boot);boot();
</script></body></html>
