<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>父の窯と鉄の夢 v36</title><style>html,body{margin:0;height:100%;background:#08040b;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}.badge{position:fixed;left:max(8px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top));z-index:99;background:#130c16e8;border:2px solid #e7b9c8;border-radius:999px;padding:5px 9px;color:#fff2f6;font:900 11px system-ui;pointer-events:none;box-shadow:0 5px 16px #0008}</style></head><body><div class="badge">v36 • HOME HEART</div><iframe id="shell" src="/v35.html?v=36" title="父の窯と鉄の夢 v36"></iframe><script>
const shell=document.getElementById('shell');
function deepest(win){try{let cur=win;for(let i=0;i<64;i++){const f=[...cur.document.querySelectorAll('iframe')].find(x=>x.contentWindow&&x.contentDocument);if(!f)break;cur=f.contentWindow}return cur}catch(e){return null}}
function install(){try{const w=deepest(shell.contentWindow);if(!w||!w.document?.body||w.__v36installed)return;w.__v36installed=1;const d=w.document;d.title='父の窯と鉄の夢 v36';
const css=d.createElement('style');css.id='v36-home-style';css.textContent=`
.v36-home{position:fixed;left:max(10px,env(safe-area-inset-left));bottom:max(82px,calc(env(safe-area-inset-bottom) + 76px));z-index:99992;width:min(304px,calc(100vw - 20px));font-family:system-ui,-apple-system,sans-serif;color:#fff8fb;filter:drop-shadow(0 14px 28px #0009);transition:opacity .2s ease,transform .2s ease}.v36-home.v36-hide{opacity:0;pointer-events:none;transform:translateY(8px)}.v36-card{overflow:hidden;border-radius:18px;border:1px solid #9f687d;background:linear-gradient(155deg,#24151ef4,#111014f7);backdrop-filter:blur(11px)}.v36-head{display:flex;align-items:center;gap:8px;padding:9px 10px;background:linear-gradient(120deg,#3c2330,#21161d);border-bottom:1px solid #6f4657}.v36-title{flex:1;font:900 12px/1.2 system-ui}.v36-chip{font:900 8px system-ui;color:#ffdce7;background:#2f1d26;border:1px solid #805266;border-radius:999px;padding:3px 6px}.v36-toggle{width:26px;height:26px;border:0;border-radius:8px;background:#4a2b38;color:white;font-weight:1000;cursor:pointer}.v36-body{padding:10px}.v36-voice{padding:9px 10px;border-radius:13px;background:linear-gradient(120deg,#39232d,#262026);border:1px solid #805164}.v36-voice small{display:block;color:#d9aebc;font-size:8px;letter-spacing:.08em}.v36-voice strong{display:block;margin-top:4px;font:850 11px/1.45 system-ui;color:#fff4f7}.v36-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.v36-stat{padding:8px;border-radius:12px;background:#171216;border:1px solid #49313a}.v36-stat small{display:block;color:#b99da7;font-size:8px}.v36-stat b{display:block;margin-top:3px;font-size:13px;color:#ffeaf0}.v36-tip{margin-top:8px;padding:8px 9px;border-radius:12px;background:#1f191d;border:1px solid #4b3840;font-size:9px;line-height:1.45;color:#d9c4cc}.v36-tip b{color:#fff1f5}.v36-pop{animation:v36pop .42s ease}@keyframes v36pop{50%{transform:scale(1.018);box-shadow:0 0 0 3px #f3b7cc24}}.v36-collapsed{width:188px}.v36-collapsed .v36-body{display:none}.v36-toast{position:fixed;left:50%;bottom:max(146px,calc(env(safe-area-inset-bottom) + 136px));z-index:99994;transform:translate(-50%,8px);opacity:0;pointer-events:none;background:#2a1822ee;border:1px solid #a86982;color:#fff3f7;border-radius:999px;padding:8px 12px;font:900 10px system-ui;box-shadow:0 8px 24px #0009;transition:.2s ease}.v36-toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:620px){.v36-home{left:8px;bottom:max(78px,calc(env(safe-area-inset-bottom) + 72px));width:min(274px,calc(100vw - 16px))}.v36-collapsed{width:176px}}@media(prefers-reduced-motion:reduce){.v36-home,.v36-toast{transition:none}.v36-pop{animation:none}}
`;d.head.appendChild(css);
const box=d.createElement('aside');box.className='v36-home v36-hide';box.innerHTML='<div class="v36-card"><div class="v36-head"><span>🌷</span><div class="v36-title">母と暮らす今日</div><span class="v36-chip">HOME</span><button class="v36-toggle" type="button" aria-label="母と暮らす今日を折りたたむ">−</button></div><div class="v36-body"><div class="v36-voice"><small>母のひとこと</small><strong data-k="voice">「無理しすぎないでね」</strong></div><div class="v36-grid"><div class="v36-stat"><small>今日の気づかい</small><b data-k="care">0回</b></div><div class="v36-stat"><small>家のぬくもり</small><b data-k="warm">静か</b></div></div><div class="v36-tip"><b data-k="next">おすすめ：</b><span data-k="tip"> 母の様子を見てから工房へ。</span></div></div></div>';d.body.appendChild(box);
const toast=d.createElement('div');toast.className='v36-toast';d.body.appendChild(toast);
let collapsed=false;box.querySelector('.v36-toggle').addEventListener('click',()=>{collapsed=!collapsed;box.classList.toggle('v36-collapsed',collapsed);box.querySelector('.v36-toggle').textContent=collapsed?'+':'−'});
const dayKey=()=>new Date().toISOString().slice(0,10);function load(){try{const x=JSON.parse(localStorage.getItem('ff_v36_home')||'{}');if(x.day!==dayKey())return{day:dayKey(),care:0,last:''};return x}catch(e){return{day:dayKey(),care:0,last:''}}}function save(s){try{localStorage.setItem('ff_v36_home',JSON.stringify(s))}catch(e){}}
let state=load(),lastHit=0,timer;
function txt(el){return(el?.innerText||el?.textContent||'').trim()}
function visible(){return [...d.querySelectorAll('.screen,main,section,[role=main]')].filter(x=>{try{return x.offsetParent!==null&&!x.closest('.v36-home')}catch(e){return false}})}
function homeContext(){const candidates=visible();return candidates.find(x=>/母|暮らし|生活|家|休息|体調|薬|食事/.test(txt(x)))||null}
function voiceFor(t){if(/体調.{0,8}(悪|低|危)|しんど|病|薬/.test(t))return '「今日は、そばにいてくれるだけで安心するよ」';if(/元気|安定|良好|回復/.test(t))return state.care>=2?'「ありがとう。あなたも自分の時間を大事にしてね」':'「今日は少し調子がいいみたい」';if(state.care>=3)return '「そんなに気をつかわなくても大丈夫よ」';if(state.care>=1)return '「ありがとう。少し安心したよ」';return '「無理しすぎないでね」'}
function render(){const sc=homeContext();if(!sc){box.classList.add('v36-hide');return}box.classList.remove('v36-hide');const t=txt(sc),care=state.care;let warm=care===0?'静か':care===1?'ほっとする':care===2?'あたたかい':'とても穏やか';let next='おすすめ：',tip='母の様子を見てから工房へ。';if(/体調.{0,8}(悪|低|危)|しんど|病|薬/.test(t)){tip='今日はケアを優先。焦って工房へ戻らなくても大丈夫。'}else if(care===0){tip='会話・食事・休息など、ひとつ気づかいをしてみよう。'}else if(care<2){tip='もう一度様子を見たら、安心して工房へ戻れそう。'}else{tip='今日は十分に気づかえた。工房の仕事を進めよう。'}box.querySelector('[data-k="voice"]').textContent=voiceFor(t);box.querySelector('[data-k="care"]').textContent=care+'回';box.querySelector('[data-k="warm"]').textContent=warm;box.querySelector('[data-k="next"]').textContent=next;box.querySelector('[data-k="tip"]').textContent=' '+tip}
function celebrate(label){toast.textContent=label;toast.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),1200);const card=box.querySelector('.v36-card');card.classList.remove('v36-pop');void card.offsetWidth;card.classList.add('v36-pop')}
d.addEventListener('click',e=>{const b=e.target.closest('button,[role=button],a');if(!b)return;const t=txt(b);if(!/母|話|会話|食事|ごはん|薬|休む|休息|手伝|様子/.test(t))return;const now=Date.now();if(now-lastHit<700)return;lastHit=now;state=load();state.care=Math.min(9,(state.care||0)+1);state.last=t.slice(0,30);save(state);setTimeout(()=>{render();celebrate(state.care>=3?'家に穏やかな時間が流れた 🌷':'母との時間が少し増えた 🌷')},120)},true);
const mo=new MutationObserver(()=>{clearTimeout(w.__v36renderTimer);w.__v36renderTimer=setTimeout(render,160)});mo.observe(d.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['class','style']});render();
}catch(e){console.error('v36 install',e)}}
function boot(){install();setTimeout(install,450);setTimeout(install,1600)}shell.addEventListener('load',boot);boot();
</script></body></html>
