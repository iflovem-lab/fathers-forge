<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>父の窯と鉄の夢 v28</title><style>html,body{margin:0;height:100%;background:#08040b;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}.badge{position:fixed;left:8px;top:8px;z-index:99;background:#100a16e8;border:2px solid #ffb55d;border-radius:999px;padding:5px 9px;color:#fff2de;font:900 11px system-ui;pointer-events:none}</style></head><body><div class="badge">v28 • FORGE FEEDBACK</div><iframe id="shell" src="/v27.html?v=28" title="父の窯と鉄の夢 v28"></iframe><script>
const shell=document.getElementById('shell');
function deepest(win){try{let cur=win;for(let i=0;i<40;i++){const f=[...cur.document.querySelectorAll('iframe')].find(x=>x.contentWindow&&x.contentDocument);if(!f)break;cur=f.contentWindow}return cur}catch(e){return null}}
function install(){try{const w=deepest(shell.contentWindow);if(!w||!w.document?.body||w.__v28installed)return;w.__v28installed=1;const d=w.document;d.title='父の窯と鉄の夢 v28';
const s=d.createElement('style');s.textContent=`
.v28forge{margin:10px 0 12px;padding:13px;border-radius:21px;background:linear-gradient(145deg,#2b160e,#140c12);border:2px solid #d87d31;box-shadow:0 9px 30px #0009,inset 0 1px #ffd39a20;color:#fff6ea;overflow:hidden;position:relative}.v28forge:before{content:'';position:absolute;inset:-40%;background:radial-gradient(circle,#ffbb5a22 0 2px,transparent 3px);background-size:24px 24px;animation:v28embers 7s linear infinite;pointer-events:none}.v28top{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px}.v28top h3{margin:0;color:#ffd7a0;font-size:15px}.v28pill{font-size:10px;font-weight:1000;padding:4px 8px;border-radius:999px;background:#4a2414;border:1px solid #ee9e56;color:#ffe5c5}.v28meter{position:relative;height:12px;border-radius:999px;background:#120b0c;border:1px solid #6a3720;overflow:hidden;margin-top:10px}.v28fill{height:100%;width:18%;border-radius:999px;background:linear-gradient(90deg,#c84a22,#ffb043,#fff0a6);transition:width .28s ease}.v28row{position:relative;display:flex;gap:7px;margin-top:8px;flex-wrap:wrap}.v28stat{flex:1;min-width:84px;padding:7px 8px;border-radius:12px;background:#120c10bb;border:1px solid #573224}.v28stat small{display:block;color:#c7a78e;font-size:9px}.v28stat b{display:block;margin-top:2px;color:#fff2de;font-size:13px}.v28msg{position:relative;margin-top:8px;padding:8px 9px;border-radius:12px;background:#1b1010cc;border:1px solid #714021;color:#ffdcb6;font-size:11px;line-height:1.45;min-height:16px}.v28forgebtn{position:relative}.v28forgebtn.v28hit{animation:v28hit .22s ease}.v28pulse{animation:v28pulse .56s ease}.v28complete{animation:v28complete .8s ease}.v28float{position:fixed;z-index:99999;pointer-events:none;font:1000 18px system-ui;color:#ffe5a6;text-shadow:0 2px 8px #000,0 0 16px #ff7c32;animation:v28float .8s ease forwards}.v28spark{position:fixed;z-index:99998;width:5px;height:5px;border-radius:50%;background:#ffd77a;box-shadow:0 0 8px #ff7b27;pointer-events:none;animation:v28spark .65s ease-out forwards}@keyframes v28hit{50%{transform:scale(.96)}100%{transform:scale(1)}}@keyframes v28pulse{0%{box-shadow:0 9px 30px #0009,0 0 0 #ff9a36}50%{box-shadow:0 9px 30px #0009,0 0 35px #ff9a3688}100%{box-shadow:0 9px 30px #0009,0 0 0 #ff9a36}}@keyframes v28complete{0%,100%{filter:none}35%{filter:brightness(1.55) saturate(1.25)}}@keyframes v28float{0%{opacity:0;transform:translate(-50%,8px) scale(.8)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-42px) scale(1.08)}}@keyframes v28spark{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2)}}@keyframes v28embers{to{transform:translate3d(24px,-24px,0)}}@media(prefers-reduced-motion:reduce){.v28forge:before,.v28forgebtn.v28hit,.v28pulse,.v28complete,.v28float,.v28spark{animation:none!important}.v28fill{transition:none}}
`;d.head.appendChild(s);
let hits=0,last=Date.now(),streak=0;
function craftScreen(){return [...d.querySelectorAll('.screen')].find(x=>x.offsetParent!==null&&(/forge|craft|blacksmith|smith/i.test(x.id||'')||/鍛冶|制作|製作|炉|金床/.test(x.innerText||'')))}
function forgeButtons(sc){if(!sc)return[];return [...sc.querySelectorAll('button,.btn,[role="button"]')].filter(b=>/叩|打|鍛|加熱|熱|焼|冷却|仕上|制作|製作|作る|鋳造|研磨|forge|craft|hammer|heat|cool|finish/i.test(b.innerText||b.getAttribute('aria-label')||''))}
function ensure(sc){let box=sc.querySelector('.v28forge');if(box)return box;box=d.createElement('section');box.className='v28forge';box.innerHTML='<div class="v28top"><h3>🔥 鍛冶の手応え</h3><span class="v28pill">CRAFT FEEDBACK</span></div><div class="v28meter"><div class="v28fill"></div></div><div class="v28row"><div class="v28stat"><small>今回の打撃</small><b data-k="hits">0 回</b></div><div class="v28stat"><small>テンポ</small><b data-k="streak">READY</b></div><div class="v28stat"><small>炉の勢い</small><b data-k="heat">🔥</b></div></div><div class="v28msg">鍛冶アクションを行うと、打撃の手応えと完成演出が強く表示されます。</div>';const title=sc.querySelector('.title,h2,h3');if(title&&title.nextSibling)sc.insertBefore(box,title.nextSibling);else sc.prepend(box);return box}
function sparks(el){const r=el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;for(let i=0;i<7;i++){const p=d.createElement('i');p.className='v28spark';p.style.left=x+'px';p.style.top=y+'px';p.style.setProperty('--dx',((Math.random()-.5)*90)+'px');p.style.setProperty('--dy',(-20-Math.random()*65)+'px');d.body.appendChild(p);setTimeout(()=>p.remove(),720)}const f=d.createElement('div');f.className='v28float';f.style.left=x+'px';f.style.top=(y-8)+'px';f.textContent=['CLANG!','GOOD!','🔥','NICE!'][Math.floor(Math.random()*4)];d.body.appendChild(f);setTimeout(()=>f.remove(),850)}
function hit(el,sc){const now=Date.now();streak=now-last<1900?Math.min(streak+1,9):1;last=now;hits++;const box=ensure(sc);box.querySelector('[data-k="hits"]').textContent=hits+' 回';box.querySelector('[data-k="streak"]').textContent=streak>=5?'GREAT ×'+streak:streak>=3?'GOOD ×'+streak:'NICE';box.querySelector('[data-k="heat"]').textContent=streak>=5?'🔥🔥🔥':streak>=3?'🔥🔥':'🔥';box.querySelector('.v28fill').style.width=Math.min(100,18+hits*8)+'%';box.querySelector('.v28msg').textContent=streak>=5?'最高のテンポ！ このまま仕上げよう。':streak>=3?'リズムが乗ってきた。炉の勢いも十分。':'一打ごとに完成へ近づいている。';box.classList.remove('v28pulse');void box.offsetWidth;box.classList.add('v28pulse');el.classList.add('v28forgebtn','v28hit');setTimeout(()=>el.classList.remove('v28hit'),260);sparks(el)}
function detectComplete(sc){const t=sc?.innerText||'';if(/完成！|完成しました|完成品|傑作|名品|SUCCESS|COMPLETE/i.test(t)&&!sc.__v28complete){sc.__v28complete=1;const box=ensure(sc);box.classList.add('v28complete');box.querySelector('.v28fill').style.width='100%';box.querySelector('.v28msg').textContent='✨ 完成！ 一振りが工房の新しい実績になった。';setTimeout(()=>box.classList.remove('v28complete'),900);setTimeout(()=>{sc.__v28complete=0;hits=0;streak=0},1800)}}
function render(){const sc=craftScreen();if(!sc)return;const box=ensure(sc);forgeButtons(sc).forEach(b=>b.classList.add('v28forgebtn'));detectComplete(sc);if(!forgeButtons(sc).length)box.querySelector('.v28msg').textContent='制作工程を選ぶと、ここに鍛冶フィードバックが表示されます。'}
d.addEventListener('click',e=>{const sc=craftScreen();if(!sc)return;const b=e.target.closest('button,.btn,[role="button"]');if(b&&forgeButtons(sc).includes(b))hit(b,sc);setTimeout(()=>detectComplete(sc),180)},true);const mo=new MutationObserver(()=>{clearTimeout(w.__v28timer);w.__v28timer=setTimeout(render,120)});mo.observe(d.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['class','style']});render();
}catch(e){console.error('v28 install',e)}}function boot(){install();setTimeout(install,350);setTimeout(install,1400)}shell.addEventListener('load',boot);boot();
</script></body></html>
