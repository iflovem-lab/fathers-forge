<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>父の窯と鉄の夢 v19</title><style>html,body{margin:0;height:100%;background:#0d0710;overflow:hidden}iframe{border:0;width:100%;height:100%;display:block}.v19badge{position:fixed;left:8px;top:8px;z-index:99;background:#160d1eee;border:2px solid #9fd3ff;border-radius:999px;padding:5px 9px;color:#e5f5ff;font:900 11px system-ui;pointer-events:none}</style></head><body><div class="v19badge">v19 • PROGRESSION</div><iframe id="shell" src="/v18.html?v=19" title="父の窯と鉄の夢 v19"></iframe><script>
const shell=document.getElementById('shell');
function deepestFrame(win){try{let cur=win;for(let i=0;i<9;i++){const fs=[...cur.document.querySelectorAll('iframe')];if(!fs.length)break;const next=fs.find(x=>x.contentWindow&&x.contentDocument);if(!next)break;cur=next.contentWindow}return cur}catch(e){return null}}
function install(){try{const w=deepestFrame(shell.contentWindow);if(!w||!w.document||!w.document.body)return;const d=w.document;if(w.__v19installed)return;w.__v19installed=1;d.title='父の窯と鉄の夢 v19';
const s=d.createElement('style');s.textContent=`
.v19progress{margin:10px 0 12px;background:linear-gradient(135deg,#192438,#171120);border:3px solid #83c8ff;border-radius:20px;padding:12px;box-shadow:0 8px #09050d,0 0 22px #6dbfff22}.v19head{display:flex;align-items:center;justify-content:space-between;gap:10px}.v19head h3{margin:2px 0;color:#dff2ff}.v19rank{min-width:76px;text-align:center;background:#0f1723;border:2px solid #8ed0ff;border-radius:16px;padding:7px}.v19rank small{display:block;color:#a7c9df;font-size:10px}.v19rank b{display:block;color:#fff0ac;font-size:24px;line-height:1}.v19xp{margin-top:10px}.v19xpTop{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:#c0d8e8}.v19track{height:12px;background:#080b11;border:2px solid #3b5265;border-radius:99px;overflow:hidden;margin-top:5px}.v19fill{height:100%;background:linear-gradient(90deg,#6ebeff,#a88cff,#ffd37e);border-radius:99px;transition:.45s width}.v19road{display:grid;grid-template-columns:repeat(5,minmax(105px,1fr));gap:7px;margin-top:10px;overflow:auto;padding-bottom:3px}.v19node{position:relative;background:#10141d;border:2px solid #405064;border-radius:15px;padding:8px;min-height:82px;opacity:.55}.v19node.done{opacity:1;border-color:#7ee6a7;background:#10231d}.v19node.current{opacity:1;border-color:#ffd98a;background:#2c2217;box-shadow:0 0 18px #ffd98a33}.v19node b{display:block;color:#fff1c3;font-size:12px}.v19node small{display:block;color:#aec2d0;font-size:10px;line-height:1.35;margin-top:4px}.v19node .v19ico{font-size:22px}.v19next{margin-top:9px;padding:9px 11px;background:#eef7ff;color:#142131;border:2px solid white;border-radius:14px;font-weight:900;line-height:1.45}.v19toast{position:fixed;left:50%;top:16%;z-index:10020;transform:translate(-50%,-10px) scale(.92);width:min(360px,86vw);background:linear-gradient(145deg,#233d52,#17101f);border:3px solid #9fd9ff;border-radius:22px;padding:13px 15px;text-align:center;color:#fff;box-shadow:0 18px 50px #000b,0 0 30px #72c4ff55;opacity:0;pointer-events:none;transition:.22s}.v19toast.on{opacity:1;transform:translate(-50%,0) scale(1)}.v19toast strong{display:block;color:#fff0a8;font-size:20px;margin-bottom:3px}.v19levelup{animation:v19level .7s ease-out}@keyframes v19level{0%{transform:scale(.92)}45%{transform:scale(1.04);box-shadow:0 0 35px #ffd98a77}100%{transform:scale(1)}}@media(max-width:680px){.v19road{grid-template-columns:repeat(5,125px)}.v19head h3{font-size:17px}}
`;d.head.appendChild(s);
let st;try{st=JSON.parse(localStorage.getItem('ff_v19_progress')||'null')}catch(e){}if(!st)st={xp:0,lastLevel:1,seen:{}};if(!st.seen)st.seen={};
const levels=[{n:1,name:'町外れの工房',need:0,ico:'🔥',unlock:'短剣づくり'},{n:2,name:'評判の鍛冶屋',need:80,ico:'⚒️',unlock:'良客の来店'},{n:3,name:'街の人気店',need:200,ico:'🏪',unlock:'上客・新依頼'},{n:4,name:'王国御用達',need:380,ico:'🛡️',unlock:'騎士団注文'},{n:5,name:'伝説の工房',need:650,ico:'👑',unlock:'特別な依頼'}];
function level(){let n=1;for(const l of levels)if(st.xp>=l.need)n=l.n;return n}function nextLevel(){return levels.find(x=>x.need>st.xp)||levels[levels.length-1]}function save(){try{localStorage.setItem('ff_v19_progress',JSON.stringify(st))}catch(e){}}
const toast=d.createElement('div');toast.className='v19toast';d.body.appendChild(toast);let tt;function pop(title,text){clearTimeout(tt);toast.innerHTML='<strong>'+title+'</strong>'+text;toast.classList.add('on');tt=setTimeout(()=>toast.classList.remove('on'),2500)}
function homeScreen(){return d.querySelector('#home')||[...d.querySelectorAll('.screen')].find(x=>/工房ホーム|今日のミッション/.test(x.innerText||''))}
function ensure(){const sc=homeScreen();if(!sc)return;let box=sc.querySelector('.v19progress');if(!box){box=d.createElement('div');box.className='v19progress';box.innerHTML='<div class="v19head"><div><small>WORKSHOP JOURNEY</small><h3>📜 工房の成長</h3></div><div class="v19rank"><small>工房RANK</small><b data-v19="rank">1</b></div></div><div class="v19xp"><div class="v19xpTop"><span data-v19="name"></span><span data-v19="xp"></span></div><div class="v19track"><div class="v19fill"></div></div></div><div class="v19road"></div><div class="v19next"></div>';const title=sc.querySelector('.title');if(title&&title.nextSibling)sc.insertBefore(box,title.nextSibling);else sc.prepend(box)}const lv=level(),cur=levels[lv-1],nxt=levels.find(x=>x.n===lv+1);box.querySelector('[data-v19="rank"]').textContent=lv;box.querySelector('[data-v19="name"]').textContent=cur.name;box.querySelector('[data-v19="xp"]').textContent=st.xp+' XP';let pct=100;if(nxt){pct=Math.max(0,Math.min(100,(st.xp-cur.need)/(nxt.need-cur.need)*100))}box.querySelector('.v19fill').style.width=pct+'%';box.querySelector('.v19road').innerHTML=levels.map(x=>`<div class="v19node ${x.n<lv?'done':x.n===lv?'current':''}"><div class="v19ico">${x.ico}</div><b>RANK ${x.n}</b><small>${x.name}<br>${x.n<=lv?'✓ '+x.unlock:'🔒 '+x.need+' XP'}</small></div>`).join('');const next=box.querySelector('.v19next');next.textContent=nxt?'次の目標：'+nxt.name+'まで あと'+Math.max(0,nxt.need-st.xp)+' XP ／ 解放：'+nxt.unlock:'最高ランク到達！ 特別依頼をこなして伝説を伸ばそう。'}
function gain(xp,reason,key){const now=Date.now();if(key&&st.seen[key]&&now-st.seen[key]<900)return;if(key)st.seen[key]=now;const before=level();st.xp=Math.min(9999,st.xp+xp);const after=level();save();ensure();if(after>before){st.lastLevel=after;save();const l=levels[after-1];pop('🎉 RANK '+after+' 昇格！',l.name+'へ成長。'+l.unlock+' が目標として解放されました。');const box=homeScreen()?.querySelector('.v19progress');if(box){box.classList.remove('v19levelup');void box.offsetWidth;box.classList.add('v19levelup')}}else if(xp>=12)pop('+'+xp+' XP',reason)}
d.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const t=b.textContent.trim();if(/探索|出発|回収/.test(t))gain(7,'素材集めが工房の経験になった','explore'+Math.floor(Date.now()/1200));else if(/ここだ/.test(t))gain(3,'鍛冶の腕が磨かれた','hit'+Math.floor(Date.now()/500));else if(/販売|売る|接客/.test(t))gain(12,'接客で店の評判が上がった','sell'+Math.floor(Date.now()/1200));else if(/母.*食事|食事.*母|薬|看病|話す|様子/.test(t))gain(5,'暮らしを守ることも工房の力','care'+Math.floor(Date.now()/1000));setTimeout(ensure,100)},true);
let lastDone=false,lastSoldCount=0;const mo=new MutationObserver(()=>{clearTimeout(w.__v19timer);w.__v19timer=setTimeout(()=>{ensure();const txt=d.body.innerText;const done=/完成！|武器完成|鍛造成功/.test(txt)&&!!d.querySelector('.result');if(done&&!lastDone)gain(18,'一本を完成させ、職人として成長した','craft'+Date.now());lastDone=done;const sold=(txt.match(/売れました|売上|購入/g)||[]).length;if(sold>lastSoldCount&&lastSoldCount>0)gain(15,'販売実績で工房の評判が上がった','sold'+Date.now());lastSoldCount=sold},100)});mo.observe(d.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:['class']});ensure();
}catch(e){console.error('v19 install',e)}}
function boot(){install();setTimeout(install,260);setTimeout(install,1000)}shell.addEventListener('load',boot);boot();
</script></body></html>
